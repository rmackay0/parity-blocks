<!--
  Parity Blocks logo mark (2026-11-02, "Warm and friendly", the user's pick).
  Two pieces that fill a 3x3 square exactly: a vermilion V pentomino
  (down the left and along the bottom) and a teal 2x2 square in the
  top-right corner. Woodblock colors (INKS in shapes.js). Drawn like the
  game's pieces: flat color, a darker line between blocks and round the
  outside.
  Layout: squares 34 wide, 3 apart; columns and rows start at 6, 43, 80.
  (Never write two dashes in a row inside this comment: it breaks the file.)
  To swap in your own logo, replace this file (keep the name logo.svg), or
  drop a new file in assets/ and change the img src in index.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- V pentomino (vermilion): the left column and the bottom row -->
  <path d="M6,6 H40 V80 H114 V114 H6 Z" fill="#E2483D"/>
  <path d="M6,41.5 H40 M6,78.5 H40 M41.5,80 V114 M78.5,80 V114" stroke="#9A3129" stroke-width="2.5" fill="none"/>
  <path d="M7,7 H39 V81 H113 V113 H7 Z" stroke="#9A3129" stroke-width="2" fill="none"/>

  <!-- 2x2 square (asagi teal): the top-right corner -->
  <rect x="43" y="6" width="71" height="71" fill="#3E8E9E"/>
  <path d="M78.5,6 V77 M43,41.5 H114" stroke="#2A616B" stroke-width="2.5" fill="none"/>
  <rect x="44" y="7" width="69" height="69" fill="none" stroke="#2A616B" stroke-width="2"/>
</svg>
