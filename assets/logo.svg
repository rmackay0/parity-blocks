<!--
  Parity Blocks logo mark (2026-11-02, the user's design).
  Black and white, no background (the page is celadon): a 3x3 grid in
  which a P pentomino is drawn only as a dotted outline, plain white
  inside, while the other four squares form an ordinary grid of solid lines.
  Where the P meets the other squares, the dotted line takes the place of
  the grid line (as on the game board).
      . . |          . = inside the P (white, no lines)
      . . |          | = an ordinary grid square
      . | |
  Layout: teal square 120 with rounded corners; grid 18 to 102, squares
  28 wide (lines at 18, 46, 74, 102); lines 3 wide in ink #1F2330.
  Each dotted edge starts and ends on a dash, so the corners are filled.
  (Never write two dashes in a row inside this comment: it breaks the file.)
  To swap in your own logo, replace this file (keep the name logo.svg), or
  drop a new file in assets/ and change the img src in index.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- the white grid (no background: the page's own color shows round it) -->
  <rect x="18" y="18" width="84" height="84" fill="#FFFFFF"/>

  <!-- the four ordinary squares: solid grid lines -->
  <g stroke="#1F2330" stroke-width="3" stroke-linecap="square" fill="none">
    <path d="M74,18 H102 V102 H46"/>
    <path d="M74,46 H102 M74,74 H102 M74,74 V102"/>
  </g>

  <!-- the P: a dotted outline, white inside -->
  <g stroke="#1F2330" stroke-width="3" stroke-linecap="square" fill="none">
    <path d="M18,18 H74" stroke-dasharray="3 7"/>
    <path d="M74,18 V74" stroke-dasharray="3 7"/>
    <path d="M18,18 V102" stroke-dasharray="2.87 6.91"/>
    <path d="M18,102 H46" stroke-dasharray="3.4 7.27"/>
    <path d="M46,102 V74" stroke-dasharray="3.4 7.27"/>
    <path d="M46,74 H74" stroke-dasharray="3.4 7.27"/>
  </g>
</svg>
