<!--
  Parity Blocks logo mark.
  A 3x3 board: a teal P pentomino plus four monominoes (single squares),
  filling the remaining cells (two orange, two purple).
  Layout: squares are 28 wide with 6 between; columns and rows both start
  at 12, 46, 80. To recolor a square, change its fill.
  To swap in your own logo, replace this file (keep the name logo.svg), or
  drop a new file in assets/ and change the <img src> in index.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="14" fill="#1c1714"/>

  <!-- P pentomino squares (matches the title's P) -->
  <g fill="#4f8a8b">
    <rect x="12" y="12" width="28" height="28" rx="3"/>
    <rect x="46" y="12" width="28" height="28" rx="3"/>
    <rect x="12" y="46" width="28" height="28" rx="3"/>
    <rect x="46" y="46" width="28" height="28" rx="3"/>
    <rect x="12" y="80" width="28" height="28" rx="3"/>
  </g>

  <!-- monominoes: top two on the right orange, bottom two on the right purple -->
  <rect x="80" y="12" width="28" height="28" rx="3" fill="#d99a4e"/>  <!-- orange (same as title) -->
  <rect x="80" y="46" width="28" height="28" rx="3" fill="#d99a4e"/>  <!-- orange (same as title) -->
  <rect x="46" y="80" width="28" height="28" rx="3" fill="#7d5a78"/>  <!-- purple -->
  <rect x="80" y="80" width="28" height="28" rx="3" fill="#7d5a78"/>  <!-- purple -->
</svg>
