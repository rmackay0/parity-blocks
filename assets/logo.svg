<!--
  Parity Blocks logo mark (2026-11-02, the user's design).
  A 4x4 square made of two P pentominoes, one the letter P (Parity) and
  one turned upside down so it reads as a b (Blocks), plus two L-shaped
  trominoes that fill the two leftover corners:
      P P L L        P = vermilion P pentomino (top left)
      P P b L        b = teal P pentomino, upside down (bottom right)
      P L b b        L = gold trominoes (top right, bottom left)
      L L b b
  Woodblock colors (INKS in shapes.js). Drawn like the game's pieces:
  flat color, a darker line between blocks and round the outside.
  Layout: squares 25 wide, 3 apart; columns and rows start at 4, 32, 60, 88.
  (Never write two dashes in a row inside this comment: it breaks the file.)
  To swap in your own logo, replace this file (keep the name logo.svg), or
  drop a new file in assets/ and change the img src in index.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 117 117" width="120" height="120">
  <!-- P (vermilion): top-left 2x2 plus the square below it -->
  <path d="M4,4 H57 V57 H29 V85 H4 Z" fill="#E2483D"/>
  <path d="M30.5,4 V57 M4,30.5 H57 M4,58.5 H29" stroke="#9A3129" stroke-width="2" fill="none"/>
  <path d="M5,5 H56 V56 H28 V84 H5 Z" stroke="#9A3129" stroke-width="1.75" fill="none"/>

  <!-- b (teal): bottom-right 2x2 plus the square above it -->
  <path d="M60,32 H85 V60 H113 V113 H60 Z" fill="#3E8E9E"/>
  <path d="M60,58.5 H85 M60,86.5 H113 M86.5,60 V113" stroke="#2A616B" stroke-width="2" fill="none"/>
  <path d="M61,33 H84 V61 H112 V112 H61 Z" stroke="#2A616B" stroke-width="1.75" fill="none"/>

  <!-- tromino (gold): top-right corner -->
  <path d="M60,4 H113 V57 H88 V29 H60 Z" fill="#E8B33B"/>
  <path d="M86.5,4 V29 M88,30.5 H113" stroke="#9E7A28" stroke-width="2" fill="none"/>
  <path d="M61,5 H112 V56 H89 V28 H61 Z" stroke="#9E7A28" stroke-width="1.75" fill="none"/>

  <!-- tromino (gold): bottom-left corner -->
  <path d="M32,60 H57 V113 H4 V88 H32 Z" fill="#E8B33B"/>
  <path d="M32,86.5 H57 M30.5,88 V113" stroke="#9E7A28" stroke-width="2" fill="none"/>
  <path d="M33,61 H56 V112 H5 V89 H33 Z" stroke="#9E7A28" stroke-width="1.75" fill="none"/>
</svg>
