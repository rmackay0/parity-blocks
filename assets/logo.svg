<!--
  Parity Blocks logo mark (placeholder).
  A 4x4 mini board where every row and column has an even number of
  filled squares: the game's win rule in one picture.
  To swap in your own logo, replace this file (keep the name logo.svg), or
  drop a new file in assets/ and change the <img src> in index.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="14" fill="#1c1714"/>
  <!-- empty centre cells -->
  <g fill="#443830">
    <rect x="36" y="36" width="22" height="22" rx="3"/>
    <rect x="62" y="36" width="22" height="22" rx="3"/>
    <rect x="36" y="62" width="22" height="22" rx="3"/>
    <rect x="62" y="62" width="22" height="22" rx="3"/>
  </g>
  <!-- I piece (top row) -->
  <g fill="#d99a4e">
    <rect x="10" y="10" width="22" height="22" rx="3"/>
    <rect x="36" y="10" width="22" height="22" rx="3"/>
    <rect x="62" y="10" width="22" height="22" rx="3"/>
    <rect x="88" y="10" width="22" height="22" rx="3"/>
  </g>
  <!-- L piece (left column + bottom) -->
  <g fill="#4f8a8b">
    <rect x="10" y="36" width="22" height="22" rx="3"/>
    <rect x="10" y="62" width="22" height="22" rx="3"/>
    <rect x="10" y="88" width="22" height="22" rx="3"/>
    <rect x="36" y="88" width="22" height="22" rx="3"/>
  </g>
  <!-- J piece (right column + bottom) -->
  <g fill="#7d5a78">
    <rect x="88" y="36" width="22" height="22" rx="3"/>
    <rect x="88" y="62" width="22" height="22" rx="3"/>
    <rect x="88" y="88" width="22" height="22" rx="3"/>
    <rect x="62" y="88" width="22" height="22" rx="3"/>
  </g>
</svg>
