<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  PARITY BLOCKS: SANDBOX (puzzle builder, admin tool, not linked from the game)
  ═══════════════════════════════════════════════════════════════════════
  The right side IS the game: same code (game.js) and look (game.css) as
  play.html. The left panel builds the puzzle it's playing:

    Start from   a blank board or any puzzle in puzzles.js
    Board        rows / columns
    Click mode   Play | Block squares | Dotted area
    Pieces       any of the 12 pentominoes
    Analyze      runs the solver (solver.js, in a Web Worker), then lets
                 you flip through every way the pieces fit, on the board
    Export       a ready-to-paste puzzles.js entry, or the analysis JSON

  Your work is saved in this browser (localStorage) as you go.
  The previous sandbox (infinite grid, custom pieces, checkerboards…)
  is still available as sandbox-classic.html.
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parity Blocks: Sandbox</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geo&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rules.css">
<link rel="stylesheet" href="game.css">
<style>
  /* ── Layout: builder panel on the left, the game on the right ── */
  body { display: flex; height: 100vh; height: 100dvh; }
  .builder {
    flex: 0 0 330px;
    height: 100%;
    overflow-y: auto;
    background: var(--color-panel);
    border-right: 1px solid var(--color-cell-border);
    padding: 16px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    user-select: none;
  }
  .game { flex: 1 1 auto; min-width: 0; }
  @media (max-width: 760px) {
    body { flex-direction: column; height: auto; overflow: auto; }
    .builder { flex: none; height: auto; border-right: none; border-bottom: 1px solid var(--color-cell-border); }
    .game { height: 100vh; height: 100dvh; }
  }

  .builder h1 { font-size: 1.7rem; font-weight: 400; color: var(--color-accent); line-height: 1; }
  .builder h1 small { display: block; font-size: 0.95rem; color: var(--color-text-dim); margin-top: 4px; }
  .builder h2 { font-size: 1.2rem; font-weight: 400; color: var(--color-accent); margin-bottom: 8px; }
  .builder section { display: flex; flex-direction: column; gap: 8px; }
  .builder .note { font-size: 0.95rem; color: var(--color-text-dim); line-height: 1.3; }
  .builder .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 1.1rem; }

  .builder select, .builder input[type=number], .builder input[type=text] {
    font: inherit; font-size: 1.05rem;
    background: var(--color-bg); color: var(--color-text);
    border: 1px solid var(--color-cell-border); border-radius: 8px;
    padding: 5px 8px;
  }
  .builder input[type=number] { width: 60px; }
  .builder input[type=text] { width: 100%; }
  .builder select { flex: 1; min-width: 0; }

  .btn {
    font: inherit; font-size: 1.15rem; letter-spacing: 0.03em;
    border: none; border-radius: 10px; padding: 7px 14px;
    background: var(--color-cell-border); color: var(--color-text);
    cursor: pointer;
  }
  .btn.primary { background: var(--color-rotate); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn:not(:disabled):hover { filter: brightness(1.15); }

  /* Click mode: a segmented control */
  .segmented { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--color-cell-border); }
  .segmented button {
    flex: 1; font: inherit; font-size: 1.05rem; padding: 7px 4px; border: none;
    background: var(--color-bg); color: var(--color-text-dim); cursor: pointer;
  }
  .segmented button.on { background: var(--color-accent); color: #1c1714; }

  /* Piece picker: the 12 pentominoes */
  .picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pick {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 6px 2px; border-radius: 10px; cursor: pointer;
    background: var(--color-bg); border: 2px solid transparent;
    font-size: 1rem; color: var(--color-text-dim); opacity: 0.55;
  }
  .pick.on { border-color: var(--color-select); opacity: 1; color: var(--color-text); }
  .pick svg { display: block; }

  /* Analysis */
  .progress { height: 8px; background: var(--color-bg); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--color-accent); transition: width 0.15s; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .stat { background: var(--color-bg); border-radius: 8px; padding: 6px 8px; font-size: 0.9rem; color: var(--color-text-dim); }
  .stat b { display: block; font-size: 1.35rem; font-weight: 400; color: var(--color-text); }
  .verdict { font-size: 1.15rem; line-height: 1.25; }
  .verdict.good { color: #8cc77a; }
  .verdict.bad { color: var(--color-status); }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper span { flex: 1; text-align: center; font-size: 1.05rem; }
  .builder label { display: flex; align-items: center; gap: 6px; font-size: 1.05rem; cursor: pointer; }
  .builder input[type=checkbox] { accent-color: var(--color-accent); width: 16px; height: 16px; }
  textarea {
    width: 100%; min-height: 150px; font: 11px/1.4 ui-monospace, Menlo, monospace;
    background: var(--color-bg); color: var(--color-text);
    border: 1px solid var(--color-cell-border); border-radius: 8px; padding: 8px;
    user-select: text;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- ═══ BUILDER PANEL ═══ -->
<aside class="builder">
  <h1>Sandbox<small>puzzle builder &middot; <a href="analyzer.html" style="color:inherit">analyzer</a> &middot; <a href="sandbox-classic.html" style="color:inherit">classic</a></small></h1>

  <section>
    <h2>Start from</h2>
    <div class="row">
      <select id="start-select"></select>
      <button class="btn" id="start-btn">Load</button>
    </div>
  </section>

  <section>
    <h2>Board</h2>
    <div class="row">
      Rows <input type="number" id="rows-input" min="3" max="12">
      Columns <input type="number" id="cols-input" min="3" max="12">
    </div>
    <p class="note" id="board-note"></p>
  </section>

  <section>
    <h2>Clicking the board</h2>
    <div class="segmented" id="mode-seg">
      <button data-mode="play" class="on">Play</button>
      <button data-mode="block">Block squares</button>
      <button data-mode="dotted">Dotted area</button>
    </div>
    <p class="note" id="mode-note"></p>
    <div id="hint-text-row" hidden>
      <input type="text" id="hint-text" placeholder="Caption under the board (optional)">
    </div>
  </section>

  <section>
    <h2>Pieces</h2>
    <div class="picker" id="picker"></div>
    <div class="row"><button class="btn" id="clear-board-btn">Clear placed pieces</button></div>
  </section>

  <section>
    <h2>Analyze</h2>
    <div class="row">
      <button class="btn primary" id="analyze-btn">Analyze puzzle</button>
      <button class="btn" id="cancel-btn" hidden>Cancel</button>
    </div>
    <div class="progress" id="progress" hidden><div></div></div>
    <p class="note" id="progress-text"></p>
    <div id="results" hidden>
      <div class="stats">
        <div class="stat">Tilings<b id="stat-total"></b></div>
        <div class="stat">Pass parity<b id="stat-pass"></b></div>
        <div class="stat">Time<b id="stat-time"></b></div>
      </div>
      <p class="verdict" id="verdict" style="margin-top:8px;"></p>
      <h2 style="margin-top:14px;">Solutions on the board</h2>
      <label><input type="checkbox" id="parity-only"> Parity-passing only</label>
      <div class="stepper" style="margin-top:6px;">
        <button class="btn" id="prev-btn">&larr;</button>
        <span id="step-label"></span>
        <button class="btn" id="next-btn">&rarr;</button>
      </div>
      <div class="row" style="margin-top:6px;">
        <button class="btn" id="show-btn">Show on board</button>
        <button class="btn" id="copy-tiling-btn" title="Put this tiling's pieces on the board to play with">Place these pieces</button>
      </div>
      <p class="note">Arrow keys flip through solutions while they're shown. Rings mark empty squares; red strokes mark odd rows/columns.</p>
    </div>
  </section>

  <section>
    <h2>Export</h2>
    <div class="row">
      <button class="btn" id="export-btn">puzzles.js entry</button>
      <button class="btn" id="download-btn" disabled>Download JSON</button>
    </div>
    <textarea id="export-text" readonly hidden></textarea>
  </section>
</aside>

<!-- ═══ THE GAME (same markup as play.html) ═══ -->
<main class="game">
  <div class="top-row">
    <a class="back-btn" href="index.html" aria-label="Back to menu">&lsaquo;</a>
    <button type="button" class="rules-btn" data-open-rules>Rules</button>
  </div>
  <div class="tray" id="tray" aria-label="Available pieces"></div>

      <div id="board"></div>
      <div id="pieces-layer"></div>
      <div id="hint-overlay"></div>
      <svg id="mark-overlay" aria-hidden="true"></svg>

    <button type="button" id="reflect-btn" disabled>Reflect</button>

  </div>
</main>

<div class="popup-backdrop" id="solved-popup" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="solved-title">
    <h2 id="solved-title">Solved!</h2>
    <p id="solved-time"></p>
    <div class="popup-buttons"><button type="button" class="secondary" id="solved-close">Close</button></div>
  </div>
</div>

<script src="puzzles.js"></script>
<script src="shapes.js"></script>
<script src="rules.js"></script>
<script src="solver.js"></script>
<script src="game.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   THE DRAFT PUZZLE
   Same shape as a puzzles.js entry. Every edit changes `draft`, saves it,
   and reloads it into the game with loadPuzzle(draft, {keep:true}) so
   pieces you've placed stay put.
═══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const DRAFT_KEY = 'pb_sandboxDraft';
const key = (r,c) => r + ',' + c;

function blankDraft(){
  return { title:'Sandbox puzzle', rows:6, cols:6, blocked:[], hiddenBlocked:[], hintOutline:[], hintText:'',
           pieces: ['L','I','X','N','P','U'].map(catalogPiece) };
}
function catalogPiece(name){
  const d = ParitySolver.pentomino(name);
  return { name, color: d.color, cells: d.cells.map(c=>c.slice()) };
}
function copyPuzzle(p){
  return {
    title: p.title, rows: p.rows, cols: p.cols,
    blocked: (p.blocked || []).map(c=>c.slice()),
    hiddenBlocked: (p.hiddenBlocked || []).map(c=>c.slice()),
    hintOutline: (p.hintOutline || []).map(c=>c.slice()),
    hintText: p.hintText || '',
    pieces: p.pieces.map(d=>({ name:d.name, color:d.color, cells:d.cells.map(c=>c.slice()) })),
  };
}

let draft;
try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch(e){}
if(!draft || !draft.pieces) draft = blankDraft();
// Colors/shapes remembered per piece name, so toggling a piece off and on keeps its puzzle color
const pieceMemory = {};
draft.pieces.forEach(d=>{ pieceMemory[d.name] = d; });

function saveDraft(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch(e){} }

// Something about the puzzle changed: save, reload into the game, drop old analysis
function draftChanged(){
  saveDraft();
  invalidateAnalysis();
  loadPuzzle(draft, { keep:true });
  renderPanel();
}

/* ═══════════════════════════════════════════════════════════════════
   PANEL
═══════════════════════════════════════════════════════════════════ */
function renderStartSelect(){
  const sel = $('start-select');
  sel.innerHTML = '<option value="__blank">Blank 6×6 board</option>' +
    Object.keys(PUZZLES).map(k=>`<option value="${k}">${PUZZLES[k].title}</option>`).join('');
}
$('start-btn').onclick = ()=>{
  const v = $('start-select').value;
  draft = v === '__blank' ? blankDraft() : copyPuzzle(PUZZLES[v]);
  if(v !== '__blank') draft.title = PUZZLES[v].title + ' (edited)';
  Object.keys(pieceMemory).forEach(k=>delete pieceMemory[k]);
  draft.pieces.forEach(d=>{ pieceMemory[d.name] = d; });
  saveDraft();
  invalidateAnalysis();
  setMode('play');
  loadPuzzle(draft);
  renderPanel();
};

function renderPanel(){
  $('rows-input').value = draft.rows;
  $('cols-input').value = draft.cols;
  const open = draft.rows*draft.cols - draft.blocked.length;
  const empty = open - 5*draft.pieces.length;
  $('board-note').textContent =
    `${draft.blocked.length} blocked (${draft.hiddenBlocked.length} hidden) · ${open} open · ` +
    `${draft.pieces.length} pieces cover ${5*draft.pieces.length} · ` +
    (empty >= 0 ? `${empty} empty square${empty===1?'':'s'}` : `${-empty} too few squares!`);
  $('hint-text').value = draft.hintText || '';
  renderPicker();
}

$('rows-input').onchange = $('cols-input').onchange = ()=>{
  const rows = Math.max(3, Math.min(12, parseInt($('rows-input').value,10) || draft.rows));
  const cols = Math.max(3, Math.min(12, parseInt($('cols-input').value,10) || draft.cols));
  const inside = ([r,c])=>r < rows && c < cols;
  draft.rows = rows; draft.cols = cols;
  draft.blocked = draft.blocked.filter(inside);
  draft.hiddenBlocked = draft.hiddenBlocked.filter(inside);
  draft.hintOutline = draft.hintOutline.filter(inside);
  draftChanged();
};

/* ── Click mode ── */
let clickMode = 'play';
const MODE_NOTES = {
  play: 'Drag pieces onto the board to play-test, just like the game.',
  block: 'Click a square to cycle it: open → blocked (X) → hidden gap (blocked, but players see a normal square) → open.',
  dotted: 'Click squares to add or remove them from the dotted area. Pieces must sit wholly inside it or wholly outside it.',
};
function setMode(mode){
  clickMode = mode;
  document.querySelectorAll('#mode-seg button').forEach(b=>b.classList.toggle('on', b.dataset.mode === mode));
  $('mode-note').textContent = MODE_NOTES[mode];
  $('hint-text-row').hidden = mode !== 'dotted';
  setGameMode(mode === 'play' ? 'play' : 'edit');
  $('show-btn').textContent = 'Show on board';
}
document.querySelectorAll('#mode-seg button').forEach(b=>b.onclick = ()=>setMode(b.dataset.mode));

gameHooks.onCellClick = (r, c)=>{
  const has = (list)=>list.some(([a,b])=>a===r && b===c);
  const without = (list)=>list.filter(([a,b])=>!(a===r && b===c));
  if(clickMode === 'block'){
    if(!has(draft.blocked)){ draft.blocked.push([r,c]); }                                    // open → X
    else if(!has(draft.hiddenBlocked)){ draft.hiddenBlocked.push([r,c]); }                   // X → hidden
    else { draft.blocked = without(draft.blocked); draft.hiddenBlocked = without(draft.hiddenBlocked); }  // hidden → open
  } else if(clickMode === 'dotted'){
    draft.hintOutline = has(draft.hintOutline) ? without(draft.hintOutline) : draft.hintOutline.concat([[r,c]]);
  }
  draftChanged();
};
$('hint-text').oninput = ()=>{ draft.hintText = $('hint-text').value; saveDraft(); loadPuzzle(draft, { keep:true }); };

/* ── Piece picker ── */
function pickerIcon(cells, color){
  const size = 9, gap = 1, b = bounds(cells);
  const w = b.cols*size + (b.cols-1)*gap, h = b.rows*size + (b.rows-1)*gap;
  const svg = svgEl('svg', { width:w, height:h, viewBox:`0 0 ${w} ${h}` });
  svgEl('path', { d: buildFillPath(cells, size, gap), fill: color }, svg);
  return svg;
}
function renderPicker(){
  const box = $('picker');
  box.innerHTML = '';
  const chosen = new Set(draft.pieces.map(d=>d.name));
  ParitySolver.PENTOMINOES.forEach(p=>{
    const d = pieceMemory[p.name] || catalogPiece(p.name);
    const el = document.createElement('div');
    el.className = 'pick' + (chosen.has(p.name) ? ' on' : '');
    el.title = chosen.has(p.name) ? 'Remove ' + p.name : 'Add ' + p.name;
    el.appendChild(pickerIcon(p.cells, d.color));
    el.appendChild(document.createTextNode(p.name));
    el.onclick = ()=>{
      if(chosen.has(p.name)) draft.pieces = draft.pieces.filter(q=>q.name !== p.name);
      else { pieceMemory[p.name] = d; draft.pieces.push(d); }
      draftChanged();
    };
    box.appendChild(el);
  });
}
$('clear-board-btn').onclick = ()=>{ placedPieces = []; selection = null; solved = false; startTime = Date.now(); renderAll(); };

/* ═══════════════════════════════════════════════════════════════════
   ANALYZE  (solver.js in a Web Worker; Cancel terminates it)
═══════════════════════════════════════════════════════════════════ */
let analysis = null, worker = null;
let view = [], viewPos = 0;

function invalidateAnalysis(){
  if(worker){ worker.terminate(); worker = null; endProgress(''); }
  analysis = null;
  $('results').hidden = true;
  $('download-btn').disabled = true;
  if(gameMode === 'view') setMode(clickMode);
}

function endProgress(msg){
  $('progress').hidden = true;
  $('progress-text').textContent = msg || '';
  $('analyze-btn').disabled = false;
  $('cancel-btn').hidden = true;
}

$('analyze-btn').onclick = ()=>{
  invalidateAnalysis();
  const config = {
    rows: draft.rows, cols: draft.cols, blocked: draft.blocked, dotted: draft.hintOutline,
    pieces: draft.pieces.map(d=>({ name:d.name, cells:d.cells })),
  };
  worker = ParitySolver.createWorker();
  $('progress').hidden = false; $('progress').firstElementChild.style.width = '0%';
  $('progress-text').textContent = 'Starting…';
  $('analyze-btn').disabled = true; $('cancel-btn').hidden = false;
  worker.onmessage = e=>{
    const m = e.data;
    if(m.type === 'progress'){
      $('progress').firstElementChild.style.width = Math.round(m.fraction*100) + '%';
      $('progress-text').textContent = `${m.solutions.toLocaleString()} tilings found · ${Math.round(m.fraction*100)}%`;
    } else if(m.type === 'result'){
      worker.terminate(); worker = null; endProgress('');
      analysis = m.result;
      showResults();
    } else if(m.type === 'error'){
      worker.terminate(); worker = null; endProgress('Error: ' + m.message);
    }
  };
  worker.postMessage({ type:'analyze', config });
};
$('cancel-btn').onclick = ()=>{ if(worker){ worker.terminate(); worker = null; } endProgress('Cancelled.'); };

function showResults(){
  $('results').hidden = false;
  $('download-btn').disabled = false;
  $('stat-total').textContent = analysis.totalTilings.toLocaleString();
  $('stat-pass').textContent = analysis.paritySolutions.toLocaleString();
  $('stat-time').textContent = analysis.solveTimeMs < 1000 ? analysis.solveTimeMs + ' ms' : (analysis.solveTimeMs/1000).toFixed(1) + ' s';
  const n = analysis.paritySolutions;
  const v = $('verdict');
  v.className = 'verdict ' + (n === 1 ? 'good' : 'bad');
  v.textContent = n === 1 ? 'Good puzzle: exactly one tiling passes parity.'
    : n === 0 ? (analysis.totalTilings ? 'Not solvable: no tiling passes parity.' : 'Not solvable: the pieces can’t all fit.')
    : `Not unique: ${n.toLocaleString()} tilings pass parity.`;
  if(analysis.totalTilings && analysis.paritySolutions === 1 && analysis.totalTilings === 1)
    v.textContent += ' (But it’s the only way the pieces fit at all, so parity never decides anything.)';
  $('parity-only').checked = n > 0;
  rebuildView();
  if(analysis.totalTilings) showOnBoard();
}

function rebuildView(){
  const only = $('parity-only').checked;
  view = analysis.tilings.map((t,i)=>i).filter(i=>!only || analysis.tilings[i].parity);
  viewPos = 0;
  updateStepper();
}
$('parity-only').onchange = ()=>{ if(analysis) rebuildView(); };

function updateStepper(){
  $('step-label').textContent = view.length ? `${viewPos+1} of ${view.length.toLocaleString()}` : 'none';
  $('prev-btn').disabled = viewPos <= 0;
  $('next-btn').disabled = viewPos >= view.length - 1;
  $('copy-tiling-btn').disabled = $('show-btn').disabled = !view.length;
  if(gameMode === 'view') pushTilingToBoard();
}
$('prev-btn').onclick = ()=>{ if(viewPos > 0){ viewPos--; updateStepper(); } };
$('next-btn').onclick = ()=>{ if(viewPos < view.length-1){ viewPos++; updateStepper(); } };
document.addEventListener('keydown', e=>{
  if(gameMode !== 'view' || e.target.matches('input[type=text], input[type=number], select, textarea')) return;
  if(e.key === 'ArrowLeft') $('prev-btn').click();
  if(e.key === 'ArrowRight') $('next-btn').click();
});

// Convert a solver tiling (absolute cells) into board pieces
function tilingPieces(t){
  return t.placements.map(pl=>{
    const r0 = Math.min(...pl.cells.map(c=>c[0])), c0 = Math.min(...pl.cells.map(c=>c[1]));
    const d = draft.pieces.find(q=>q.name === pl.piece);
    return { name: pl.piece, color: d ? d.color : '#888', row: r0, col: c0, cells: pl.cells.map(([r,c])=>[r-r0, c-c0]) };
  });
}

function pushTilingToBoard(){
  if(!view.length){ setViewTiling({ pieces:[], oddRows:[], oddCols:[], empty:[], status:'No tilings to show' }); return; }
  const t = analysis.tilings[view[viewPos]];
  const status = (t.parity ? 'Passes parity' : unevenMessage(t.failingRows.length, t.failingCols.length)) +
    ` · tiling ${viewPos+1} of ${view.length.toLocaleString()}`;
  setViewTiling({ pieces: tilingPieces(t), oddRows: t.failingRows, oddCols: t.failingCols, empty: t.gaps, status, good: t.parity });
}

function showOnBoard(){
  if(gameMode === 'view'){ setMode(clickMode); return; }   // button toggles back
  pushTilingToBoard();
  setGameMode('view');
  $('show-btn').textContent = 'Back to playing';
}
$('show-btn').onclick = showOnBoard;

$('copy-tiling-btn').onclick = ()=>{
  if(!view.length) return;
  const t = analysis.tilings[view[viewPos]];
  setMode('play');
  placedPieces = tilingPieces(t).map((p,i)=>Object.assign({ id:'s'+i }, p));
  placedIdCounter = placedPieces.length + 1;
  solved = false;
  renderAll();
};

/* ═══════════════════════════════════════════════════════════════════
   EXPORT
═══════════════════════════════════════════════════════════════════ */
$('export-btn').onclick = ()=>{
  const cells = arr=>'[' + arr.map(c=>'[' + c.join(',') + ']').join(',') + ']';
  const id = 'puzzle-' + draft.pieces.map(d=>d.name).join('').toLowerCase();
  const lines = [
    `  '${id}': {`,
    `    title: '${draft.title.replace(/'/g, "\\'")}',`,
    `    rows: ${draft.rows}, cols: ${draft.cols},`,
    `    blocked: ${cells(draft.blocked)},`,
  ];
  if(draft.hiddenBlocked.length) lines.push(`    hiddenBlocked: ${cells(draft.hiddenBlocked)},`);
  if(draft.hintOutline.length) lines.push(`    hintOutline: ${cells(draft.hintOutline)},`);
  if(draft.hintText) lines.push(`    hintText: '${draft.hintText.replace(/'/g, "\\'")}',`);
  lines.push('    pieces: [');
  draft.pieces.forEach(d=>lines.push(`      { name:'${d.name}', color:'${d.color}', cells:${cells(d.cells)} },`));
  lines.push('    ]', '  },');
  const ta = $('export-text');
  ta.value = lines.join('\n');
  ta.hidden = false;
  ta.select();
};
$('download-btn').onclick = ()=>{
  if(!analysis) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(analysis, null, 2)], { type:'application/json' }));
  a.download = 'analysis-sandbox.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

$('solved-close').onclick = ()=>{ $('solved-popup').hidden = true; };

/* ═══════════════════════════════════════════════════════════════════
   START
═══════════════════════════════════════════════════════════════════ */
renderStartSelect();
setMode('play');
loadPuzzle(draft);
renderPanel();
</script>
