<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  PARITY BLOCKS: PLAYTEST PAGE (internal; not linked from anywhere)
  ═══════════════════════════════════════════════════════════════════════
  Puzzles uploaded from the sandbox (its ☁ button), for friends to try
  before they're published. Anyone with the address can open it; it isn't
  linked from the game and asks search engines not to list it.

  One box per puzzle, newest upload in the top left: the puzzle's name,
  its empty board (as it starts), and when it was uploaded. A box opens
  the puzzle in the normal game (play.html?playtest=<id>).

  The puzzles come from playtest.json, which the sandbox writes to the
  GitHub repo; the site updates about a minute after an upload.
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Parity Blocks: Playtest</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geo&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rules.css">
<link rel="stylesheet" href="game.css">
<style>
  body { overflow: auto; user-select: auto; -webkit-user-select: auto; }
  .page { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .head h1 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; color: var(--color-text); flex: 1; }
  .head .note { color: var(--color-text-dim); font-size: 0.95rem; }
  .status-line { color: var(--color-text-dim); font-size: 1.05rem; padding: 20px 0; }
  /* [POSITIONING] The boxes: as many across as fit, newest first */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .box {
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 12px 12px;
    background: var(--color-panel); color: var(--color-text); text-decoration: none;
    border: 1.5px solid var(--color-cell-border); border-radius: 12px;
    transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  .box:hover { border-color: var(--color-btn-line); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1); }
  .box:active { transform: translateY(1px); }
  .box .pic { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 150px; }
  .box .pic svg { max-width: 100%; height: auto; }
  .box b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
  .box small { color: var(--color-text-dim); font-size: 0.85rem; text-align: center; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .box .pic { min-height: 110px; } }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <a class="back-btn" href="index.html" aria-label="Back to menu"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M13 4 L7 10 L13 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1>Playtest</h1>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode"></button>
  </div>
  <p class="status-line" id="status">Loading…</p>
  <div class="grid" id="grid"></div>
</div>

<script src="shapes.js"></script>
<script>
const grid = document.getElementById('grid'), status = document.getElementById('status');
const fmt = iso => new Date(iso).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });

fetch('playtest.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r=>r.ok ? r.json() : { puzzles: [] })
  .then(data=>{
    // Newest upload first (top left)
    const list = (data.puzzles || []).slice().sort((a, b)=>(b.uploadedAt || '').localeCompare(a.uploadedAt || ''));
    status.hidden = list.length > 0;
    status.textContent = 'No puzzles uploaded yet.';
    list.forEach(e=>{
      const p = e.puzzle;
      const a = document.createElement('a');
      a.className = 'box';
      a.href = 'play.html?playtest=' + encodeURIComponent(e.id);
      // The empty board, as the puzzle starts (no pieces, so no answer)
      const cell = Math.max(10, Math.floor(150 / Math.max(p.rows, p.cols)) - 3);
      const pic = document.createElement('div');
      pic.className = 'pic';
      pic.appendChild(miniBoard({ rows:p.rows, cols:p.cols, cell, gaps:p.blocked || [], removed:p.removed || [], dotted:p.hintOutline || [] }));
      const name = document.createElement('b');
      name.textContent = e.title;
      const when = document.createElement('small');
      when.textContent = `${p.rows} × ${p.cols} · ${p.pieces.length} pieces · ${fmt(e.uploadedAt)}`;
      a.append(pic, name, when);
      grid.appendChild(a);
    });
  })
  .catch(()=>{ status.textContent = 'Couldn’t load the puzzles. Try refreshing.'; });
</script>
</body>
</html>
