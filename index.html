<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  PARITY BLOCKS: SPLASH SCREEN
  ═══════════════════════════════════════════════════════════════════════

  EDIT GUIDE: search this file for these tags to find each kind of setting:

    [FONTS]        typefaces, sizes, weights        (font link in <head> + CSS)
    [COLORS]       every color on the page          (CSS :root block)
    [POSITIONING]  layout, spacing, sizes, placement (CSS :root block + rules)
    [IMAGES]       logo, favicon, background image  (<head>, CSS, <body>)
    [CONTENT]      tagline, button labels           (<body>; rules text is in rules.js)
    [BEHAVIOR]     what the difficulty buttons do   (<script>)

  The old puzzle sandbox (admin tool) now lives in sandbox.html.
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parity Blocks</title>

<!-- [IMAGES] Browser-tab icon. Point href at any .svg / .png / .ico in assets/. -->
<!-- (favicon.svg, not logo.svg: a new name, so browsers stop showing an
     older saved icon; the PNGs are for browsers that don't use SVG icons.
     Same three lines on every page; made by tests/browser/make_icons.js) -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<!-- Light / dark mode: first, so the page never flashes the wrong colors -->
<script src="theme.js"></script>

<!-- [FONTS] Step 1 of 2: load the fonts from Google Fonts.
     To change fonts: pick new ones at https://fonts.google.com, copy their
     "family=" part into this URL, then update --font-display / --font-body
     in the :root block below (step 2). Delete this <link> entirely if you
     only want system fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geo&family=Lilita+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Rules popup + Rules button styles (shared with play.html) -->
<link rel="stylesheet" href="rules.css">

<style>
  /* [FONTS] Locally hosted font for the title/logo text.
     To swap it: drop a new .ttf/.otf/.woff2 in the project, change the
     url() below, and (optionally) rename font-family here and in
     --font-logo. The variable font covers every weight from 400 to 700. */
  @font-face {
    font-family: 'Pixelify Sans';
    src: url('Pixelify_Sans/PixelifySans-VariableFont_wght.ttf') format('truetype');
    font-weight: 400 700;
    font-display: swap;
  }

  :root {
    /* ─────────────────────────────────────────────────────────────
       [FONTS] Step 2 of 2: which font is used where.
       The first name must match a family loaded in the <link> above;
       the names after it are fallbacks if that font fails to load.
       ───────────────────────────────────────────────────────────── */
    --font-logo:    'Lilita One', 'Segoe UI', sans-serif; /* "Parity Blocks" title (user's pick, 2026-11-02:
                                                            "Warm and friendly"). Before: 'Geo' (then set
                                                            --title-boldness to 0.045em and the title's
                                                            letter-spacing to 0.05em) */
    --font-display: 'Geo', 'Segoe UI', sans-serif;       /* buttons (kept Geo, user's choice) */
    --font-body:    'Nunito', 'Segoe UI', sans-serif;    /* notices (rules popup fonts: rules.css) */
    --font-tagline: 'Nunito', 'Segoe UI', sans-serif;    /* subheader under the title */

    /* [FONTS] Sizes. clamp(min, preferred, max) scales with screen width. */
    --title-size:   clamp(2.6rem, 11vw, 4.4rem);
    /* Extra thickness for the title: an outline in the letters' own color.
       0 = normal (Lilita One is bold already); Geo needed 0.045em. */
    --title-boldness: 0;
    --tagline-size: clamp(0.95rem, 2.6vw, 1.15rem);
    --button-size:  1.5rem;    /* Geo runs small, so these are larger than usual */

    /* [FONTS] Weights (must be a weight listed in the font <link>).
       Geo only comes in 400 (regular); anything higher gets a fake,
       browser-smeared bold. Raise these only if you switch fonts. */
    --title-weight:  400;
    --button-weight: 400;

    /* ─────────────────────────────────────────────────────────────
       [COLORS] Every color on the page is set here.
       Change a value once and it updates everywhere it's used.
       ───────────────────────────────────────────────────────────── */
    /* "Woodblock" (user's pick, 2026-11-02): paper page, ink text. Level
       buttons ("Warm and friendly", also the user's pick): rounded, in
       asagi teal, gold and vermilion, the same three colors as the
       🟦 🟨 🟥 in a shared result (play.html, Share).
       Same palette as game.css. Dark mode: html.dark below. */
    --color-bg:          #E3EFED;   /* page background: celadon, a pale teal-green (2026-11-03) */
    --color-title:       #1F2330;   /* "Parity Blocks" heading (ink) */
    --color-text:        #1F2330;   /* main text */
    --color-text-dim:    #5E6270;   /* tagline, secondary text */

    --color-easy:        #3E8E9E;   /* Easy button (asagi teal) */
    --color-medium:      #E8B33B;   /* Medium button (gold) */
    --color-hard:        #E2483D;   /* Hard button (vermilion) */
    --color-easy-text:   #FFFFFF;   /* the label on each */
    --color-medium-text: #1F2330;
    --color-hard-text:   #FFFFFF;
    --color-button-line: #1F2330;   /* the fine ink border on buttons */
    --color-key-edge:    rgba(0, 0, 0, 0.14);   /* the soft shade along a button's bottom */

    --color-panel:       #FBFBF8;   /* "coming soon" notice, Archive background */
    --color-panel-border:#DCDDD6;   /* their outline */
    --color-focus:       #2B4C7E;   /* keyboard-focus ring on buttons (indigo) */
    --color-overlay:     rgba(31, 35, 48, 0.45);

    /* ─────────────────────────────────────────────────────────────
       [POSITIONING] Sizes and spacing.
       ───────────────────────────────────────────────────────────── */
    --logo-size:       clamp(110px, 30vw, 140px);  /* logo width & height (the file has a margin round the grid) */
    --brand-gap:       12px;    /* space between the logo and the title */
    --stack-gap:       44px;    /* space between the title block and the buttons */
    --button-width:    280px;   /* width of each difficulty button */
    --button-height:   54px;    /* height of each difficulty button */
    --button-gap:      12px;    /* space between the three buttons */
    --button-radius:   999px;   /* corner roundness (0 = square, 999px = pill) */

    --rules-top:       18px;    /* Rules button distance from top edge */
    --rules-right:     18px;    /* Rules button distance from right edge */


    /* [IMAGES] Optional full-page background image.
       e.g. url('assets/background.jpg'). Leave as none for a plain color. */
    --bg-image: none;
  }
  /* [COLORS] Dark mode (theme.js; the button is in the Rules popup, next
     to Large text). The level buttons keep their colors. */
  html.dark {
    --color-bg:          #0E1C1F;   /* dark celadon */
    --color-title:       #EDEAE3;
    --color-text:        #EDEAE3;
    --color-text-dim:    #A3A6B0;
    --color-button-line: #EDEAE3;
    --color-key-edge:    rgba(0, 0, 0, 0.3);
    --color-panel:       #181C26;
    --color-panel-border:#2C3240;
    --color-focus:       #8FA9D6;
    --color-overlay:     rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--font-body);
    color: var(--color-text);
    background-color: var(--color-bg);
    /* [IMAGES] Optional background image. Change background-size to
       `contain` or a fixed size if needed. */
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ── [POSITIONING] Main column ──────────────────────────────────
     Everything (logo, title, buttons) is stacked in one centered column.
       • justify-content: vertical placement.
           center     = middle of screen (current)
           flex-start = top   (add padding-top to push down)
           flex-end   = bottom
       • align-items: horizontal placement (center / flex-start / flex-end).
       • To reorder elements, move them in the HTML or set `order:` on them. */
  .splash {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: var(--stack-gap);
    /* (more room at the bottom than the top, so the whole stack sits a
       little above the middle, which looks centred to the eye) */
    padding: 72px 16px 96px;
    text-align: center;
  }
  /* The logo, title and tagline: close together */
  .brand { display: flex; flex-direction: column; align-items: center; gap: var(--brand-gap); }
  /* The level buttons and Tutorial */
  .actions {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    width: 100%; max-width: var(--button-width);
  }

  /* [IMAGES] [POSITIONING] Logo image size. Its file is set in the <img> tag. */
  .logo {
    width: var(--logo-size);
    height: var(--logo-size);
    object-fit: contain;
    display: block;
  }
  /* [COLORS] Dark mode: a soft light glow round the logo, so its dark
     outline shows against the dark page */
  html.dark .logo { filter: drop-shadow(0 0 10px rgba(190, 230, 225, 0.35)) drop-shadow(0 0 2px rgba(190, 230, 225, 0.5)); }

  /* [FONTS] Title text */
  .title {
    font-family: var(--font-logo);
    font-size: var(--title-size);
    font-weight: var(--title-weight);
    color: var(--color-title);
    -webkit-text-stroke: var(--title-boldness) currentColor;
    paint-order: stroke fill;
    letter-spacing: 0.01em;      /* (Geo needed 0.05em so its thickened letters didn't touch) */
    line-height: 1.05;
  }

  /* [FONTS] Tagline under the title */
  .tagline {
    margin-top: 10px;              /* [POSITIONING] gap between title and tagline */
    font-family: var(--font-tagline);
    font-size: var(--tagline-size);
    color: var(--color-text-dim);
  }

  /* ── [POSITIONING] Difficulty buttons ───────────────────────────
     flex-direction: column = stacked vertically (current).
     Change to `row` (and add flex-wrap: wrap) to lay them side by side. */
  .difficulty {
    display: flex;
    flex-direction: column;
    gap: var(--button-gap);
    width: 100%;
    max-width: var(--button-width);
  }

  .difficulty-btn {
    height: var(--button-height);
    border: none;
    border-radius: var(--button-radius);
    font-family: var(--font-display);          /* [FONTS] */
    font-size: var(--button-size);             /* [FONTS] */
    font-weight: var(--button-weight);         /* [FONTS] */
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.16);   /* a soft darker band along the bottom */
    transition: transform 0.1s, box-shadow 0.1s, filter 0.15s;
  }
  .difficulty-btn:hover  { filter: brightness(1.05); transform: translateY(-1px); }
  .difficulty-btn:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.16); }

  /* [COLORS] Per-difficulty button colors (values live in :root) */
  .difficulty-btn[data-difficulty="easy"]   { background: var(--color-easy);   color: var(--color-easy-text); }
  .difficulty-btn[data-difficulty="medium"] { background: var(--color-medium); color: var(--color-medium-text); }
  .difficulty-btn[data-difficulty="hard"]   { background: var(--color-hard);   color: var(--color-hard-text); }

  /* ── [POSITIONING] Rules (top-right) and Tutorial (bottom) buttons ──
     Their look (colors, font) comes from .rules-btn in rules.css.
     Rules: pinned to the top-right corner. Tutorial: under the
     difficulty buttons, same width as them. */
  .rules-top {
    position: fixed;
    top: var(--rules-top);
    right: var(--rules-right);
    z-index: 10;
  }
  .theme-top {                     /* the dark mode button, mirroring Rules */
    position: fixed;
    top: var(--rules-top);
    left: var(--rules-right);
    z-index: 10;
  }
  .rules-bottom {
    width: 100%;
    max-width: 180px;              /* narrower than the levels: it's a lesser button */
    height: 44px;
    display: flex;                 /* it's a link, so center its text like a button */
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .difficulty-btn:focus-visible {
    outline: 3px solid var(--color-focus);
    outline-offset: 3px;
  }

  /* Small "coming soon" notice shown when a difficulty has no game yet */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(10px);
    background: var(--color-panel);
    border: 1px solid var(--color-panel-border);
    color: var(--color-text);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Archive: a calendar with a star on each day a puzzle was solved ──
     [COLORS] the stars use the three difficulty colors from :root */
  .cal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--color-overlay);
  }
  .cal-backdrop[hidden] { display: none; }
  .cal {
    width: min(420px, 100%); max-height: 100%; overflow-y: auto;
    background: var(--color-panel); border: 1px solid var(--color-panel-border); border-radius: 18px;
    padding: 18px 18px 16px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  }
  .cal h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; color: var(--color-title); text-align: center; margin-bottom: 10px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav b { font-size: 1.15rem; font-weight: 700; }
  .cal-nav button {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--color-panel-border);
    background: transparent; color: var(--color-text); font-size: 1.3rem; cursor: pointer;
  }
  .cal-nav button:disabled { opacity: 0.3; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid .wd { font-size: 0.8rem; color: var(--color-text-dim); text-align: center; padding-bottom: 2px; }
  .cal-day {
    aspect-ratio: 1; border-radius: 8px; background: rgba(128, 128, 128, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 4px; font-size: 0.85rem; color: var(--color-text-dim);
  }
  .cal-day.today { box-shadow: 0 0 0 2px var(--color-focus); color: var(--color-text); }
  .cal-day .stars { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; margin-top: 2px; }
  .cal-day .stars svg { width: 16px; height: 16px; }
  .star-easy   { fill: var(--color-easy); }
  .star-medium { fill: var(--color-medium); }
  .star-hard   { fill: var(--color-hard); }
  .star-easy, .star-medium, .star-hard { stroke: rgba(0, 0, 0, 0.3); stroke-width: 1; stroke-linejoin: round; }
  .cal-legend { display: flex; justify-content: center; gap: 16px; margin: 12px 0 4px; font-size: 0.9rem; color: var(--color-text-dim); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .cal-legend svg { width: 15px; height: 15px; }
  .cal-total { text-align: center; font-size: 0.9rem; color: var(--color-text-dim); margin-bottom: 12px; }
  .cal-close {
    display: block; width: 100%; height: 46px; border: 2px solid var(--color-button-line); border-radius: 4px; cursor: pointer;
    box-shadow: inset 0 -3px 0 var(--color-key-edge);
    font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.04em;
    background: var(--color-title); color: var(--color-bg);
  }
</style>
</head>
<body>

<!-- [POSITIONING] Rules button, pinned to the top-right corner via .rules-top -->
<button class="rules-btn rules-top" type="button" data-open-rules>Rules</button>

<!-- [POSITIONING] Dark mode on / off (moon / sun; theme.js), pinned to the top-left corner -->
<button class="theme-toggle theme-top" type="button" data-theme-toggle aria-label="Switch to dark mode"></button>

<main class="splash">

  <!-- [IMAGES] Logo. To replace it, overwrite assets/logo.svg, or put a new
       file in assets/ and change src (e.g. src="assets/logo.png").
       Keep alt text descriptive. Size is set by --logo-size in CSS.
       To ADD another image, copy this line, change src/alt, and give it its
       own class for sizing. -->
  <!-- [POSITIONING] Two groups: the brand (logo, title, tagline) sit close
       together; the buttons sit together below, with more room between
       the two groups. -->
  <header class="brand">
    <img class="logo" src="assets/logo.svg" alt="Parity Blocks logo">
    <!-- [CONTENT] Title + tagline -->
    <div>
      <h1 class="title">Parity Blocks</h1>
      <p class="tagline">Place every piece. Keep every row and column even.</p>
    </div>
  </header>

  <div class="actions">
    <!-- [CONTENT] Difficulty buttons. data-difficulty is what the script
         reads, so leave it alone. Change only the visible label. -->
    <nav class="difficulty" aria-label="Choose difficulty">
      <button class="difficulty-btn" type="button" data-difficulty="easy">Easy</button>
      <button class="difficulty-btn" type="button" data-difficulty="medium">Medium</button>
      <button class="difficulty-btn" type="button" data-difficulty="hard">Hard</button>
    </nav>

    <!-- [CONTENT] Tutorial button, under the levels (opens tutorial.html; its
         ✕ and Finish buttons come back here). Rules stay in the top-right corner. -->
    <a class="rules-btn rules-bottom" href="tutorial.html">Tutorial</a>

    <!-- [CONTENT] Archive (calendar of solved puzzles) is hidden for now
         (user, 2026-11-03). To bring it back, put this line back:
         <button class="rules-btn rules-bottom" type="button" id="archive-btn">Archive</button> -->
  </div>

</main>

<!-- The Archive calendar: a star on each day this player solved a puzzle
     (teal = Easy, gold = Medium, vermilion = Hard). Kept in this browser only
     (progress.js). Drawn by showMonth() below. -->
<div class="cal-backdrop" id="cal-popup" hidden>
  <div class="cal" role="dialog" aria-modal="true" aria-labelledby="cal-title">
    <h2 id="cal-title">Archive</h2>
    <div class="cal-nav">
      <button type="button" id="cal-prev" aria-label="Previous month">&lsaquo;</button>
      <b id="cal-month"></b>
      <button type="button" id="cal-next" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend" id="cal-legend"></div>
    <p class="cal-total" id="cal-total"></p>
    <button type="button" class="cal-close" id="cal-close">Close</button>
  </div>
</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- The rules popup: text and pictures in rules.js, which needs shapes.js -->
<script src="shapes.js"></script>
<script src="scroll-hint.js"></script>   <!-- (phones: a ▾ when the rules go on below) -->
<script src="rules.js"></script>
<script src="progress.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   [BEHAVIOR] Where each difficulty button goes.
   play.html?level=<difficulty> opens whatever is published for it in
   published.js (set from the sandbox's Publish button). null = no link;
   the button shows "coming soon".
═══════════════════════════════════════════════════════════════════ */
const DIFFICULTY_LINKS = {
  easy:   'play.html?level=easy',
  medium: 'play.html?level=medium',
  hard:   'play.html?level=hard',
};

const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2200);
}

document.querySelectorAll('.difficulty-btn[data-difficulty]').forEach(btn => {
  btn.addEventListener('click', () => {
    const level = btn.dataset.difficulty;
    const url = DIFFICULTY_LINKS[level];
    if (url) {
      window.location.href = url;
    } else {
      showToast(btn.textContent.trim() + ' puzzles are coming soon');
    }
  });
});

/* ═══════════════════════════════════════════════════════════════════
   [BEHAVIOR] Archive calendar. One star per difficulty on each day it
   was solved (solving the same one twice that day still shows one star).
   Opens on the current month; ‹ › go back and forward (not past this
   month). Days are the player's own calendar days.
═══════════════════════════════════════════════════════════════════ */
const LEVELS = [['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard']];
const STAR_PATH = 'M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z';
const star = level => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="star-${level}" d="${STAR_PATH}"/></svg>`;
const calPopup = document.getElementById('cal-popup');
let shownMonth = null;     // a Date on the 1st of the month being shown

function showMonth(){
  const solves = loadSolves();
  const byDay = {};        // 'YYYY-MM-DD' → Set of levels solved that day
  solves.forEach(s => { (byDay[s.date] = byDay[s.date] || new Set()).add(s.level); });
  const y = shownMonth.getFullYear(), m = shownMonth.getMonth();
  document.getElementById('cal-month').textContent = shownMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const now = new Date();
  document.getElementById('cal-next').disabled = y === now.getFullYear() && m === now.getMonth();
  const grid = document.getElementById('cal-grid');
  // Weekday headings (starting Sunday), in the browser's language
  let html = [...Array(7)].map((_, i) => `<div class="wd">${new Date(2026, 1, 1 + i).toLocaleDateString(undefined, { weekday: 'narrow' })}</div>`).join('');
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  html += '<div></div>'.repeat(first);
  let solvedThisMonth = 0;
  for (let d = 1; d <= days; d++) {
    const key = localDay(new Date(y, m, d));
    const done = byDay[key] || new Set();
    solvedThisMonth += done.size;
    const label = done.size ? ' (solved: ' + LEVELS.filter(([l]) => done.has(l)).map(([, n]) => n).join(', ') + ')' : '';
    html += `<div class="cal-day${key === localDay() ? ' today' : ''}" aria-label="${d}${label}">${d}`
          + `<div class="stars">${LEVELS.filter(([l]) => done.has(l)).map(([l]) => star(l)).join('')}</div></div>`;
  }
  grid.innerHTML = html;
  document.getElementById('cal-total').textContent = solvedThisMonth
    ? `${solvedThisMonth} solved this month`
    : (solves.length ? 'Nothing solved this month' : 'Solve a puzzle to earn your first star.');
}
document.getElementById('cal-legend').innerHTML = LEVELS.map(([l, n]) => `<span>${star(l)}${n}</span>`).join('');
// (the Archive button is hidden for now; this only runs if it's on the page)
const archiveBtn = document.getElementById('archive-btn');
if (archiveBtn) archiveBtn.addEventListener('click', () => {
  const now = new Date();
  shownMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  showMonth();
  calPopup.hidden = false;
  document.getElementById('cal-close').focus();
});
document.getElementById('cal-prev').onclick = () => { shownMonth.setMonth(shownMonth.getMonth() - 1); showMonth(); };
document.getElementById('cal-next').onclick = () => { shownMonth.setMonth(shownMonth.getMonth() + 1); showMonth(); };
const closeCal = () => { calPopup.hidden = true; };
document.getElementById('cal-close').onclick = closeCal;
calPopup.addEventListener('click', e => { if (e.target === calPopup) closeCal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !calPopup.hidden) closeCal(); });
</script>
</body>
