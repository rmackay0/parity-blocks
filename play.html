<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  PARITY BLOCKS: GAME PAGE
  ═══════════════════════════════════════════════════════════════════════

  Opened from the splash screen as play.html?puzzle=<puzzle-key>. The
  puzzles themselves (board size, blocked cells, pieces) live in
  puzzles.js, shared with the sandbox.

  Layout, top to bottom: back button, available pieces, board, Reflect /
  Rotate buttons.

  How to play on this page:
    • Drag a piece from the top onto the board.
    • Click a piece (on the board or at the top) to rotate it clockwise;
      double-click to reflect it. Reflect / Rotate buttons and the R / F
      keys work on the last piece clicked. Esc = deselect.
    • Drag a placed piece off the board (or back up to the top) to remove it.

  EDIT GUIDE: search this file for these tags:
    [FONTS]  [COLORS]  [POSITIONING]  [CONTENT]  [BEHAVIOR]
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parity Blocks</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<!-- Light / dark mode: first, so the page never flashes the wrong colors -->
<script src="theme.js"></script>

<!-- [FONTS] Same font as the splash screen's buttons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geo&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rules.css">

<link rel="stylesheet" href="game.css">
</head>
<body>

<main class="game">
  <div class="top-row">
    <!-- (A drawn chevron, not the ‹ character, so it sits dead centre in the circle) -->
    <div class="top-left">
      <a class="back-btn" href="index.html" aria-label="Back to menu"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M13 4 L7 10 L13 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <!-- Dark mode on / off at any time (moon / sun; theme.js, styled in rules.css) -->
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode"></button>
    </div>
    <div class="top-right">
      <!-- Clears the board at once (Undo for a few seconds); the timer keeps
           going. On a solved board it asks "Play again?". (2026-11-17) -->
      <button type="button" class="reset-btn" id="reset-btn" aria-label="Clear the board"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5 A8 8 0 1 1 5 15.5"/><path d="M4 4.5 V9.8 H9.3"/></svg>Clear</button>
      <!-- Opens the rules popup (rules.js); styled by rules.css -->
      <button type="button" class="rules-btn" data-open-rules>Rules</button>
    </div>
  </div>

  <!-- The pieces to place -->
  <div class="tray-area has-hl">
    <div class="tray" id="tray" aria-label="Available pieces"></div>
    <!-- The highlighter (pencil + colors), built and placed by game.js -->
    <div class="hl-tool" id="hl-tool"></div>
  </div>

  <!-- Mistakes only glow red here (no written explanation; see
       gameSettings.explain below), so the message area is hidden and the
       board gets its space -->
  <p class="status" id="status" role="status" aria-live="polite" hidden></p>

  <div class="board-wrap" id="board-wrap">
    <div id="board-outer">
      <div id="board"></div>
      <div id="pieces-layer"></div>
      <div id="hint-overlay"></div>
      <svg id="mark-overlay" aria-hidden="true"></svg>
    </div>
  </div>

  <p class="hint-caption" id="hint-caption" hidden></p>
</main>

<!-- [CONTENT] Shown when the puzzle is solved -->
<div class="popup-backdrop" id="solved-popup" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-label="Solved">
    <!-- The win animation + jingle (celebrate.js, solvedCelebration) -->
    <div class="solved-win" id="solved-win"></div>
    <!-- After Easy: "Play Medium"; after Medium: "Play Hard" (set in onSolved) -->
    <a class="next-level-btn" id="solved-next" hidden></a>
    <!-- Share your result: the day, level (with its colored circle) and
         time, never the answer. Phones: the share sheet; laptops: copied. -->
    <button type="button" class="share-btn" id="solved-share">Share</button>
    <div class="popup-buttons">
      <a href="index.html">Menu</a>
      <button type="button" class="secondary" id="solved-close">Close</button>
    </div>
  </div>
</div>

<!-- The interactive tutorial (tutorial.html) appears in this popup the first
     time someone opens a puzzle, and from the Rules popup's button -->
<div class="tutorial-overlay" id="tutorial-overlay" hidden>
  <iframe id="tutorial-frame" title="Tutorial"></iframe>
</div>

<!-- After Clear: a few seconds to take it back (2026-11-17) -->
<div class="undo-bar" id="undo-bar" role="status" hidden>
  <span>Board cleared</span>
  <button type="button" id="undo-btn">Undo</button>
</div>

<!-- [CONTENT] "Play again?" before a SOLVED board is cleared (and its timer restarted) -->
<div class="popup-backdrop" id="reset-popup" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="reset-title">
    <h2 id="reset-title">Play again?</h2>
    <p id="reset-text">This clears the board so you can solve it again. Your star stays in the Archive.</p>
    <div class="popup-buttons">
      <button type="button" class="secondary" id="reset-cancel">Keep playing</button>
      <button type="button" id="reset-confirm">Reset</button>
    </div>
  </div>
</div>

<!-- [CONTENT] Shown if the link points at a puzzle that doesn't exist -->
<div class="popup-backdrop" id="missing-popup" hidden>
  <div class="popup" role="dialog" aria-modal="true">
    <h2>Puzzle not found</h2>
    <p>This puzzle link isn't valid.</p>
    <div class="popup-buttons"><a href="index.html">Back to menu</a></div>
  </div>
</div>

<script src="puzzles.js"></script>
<script src="shapes.js"></script>
<!-- Rules popup (opens from the Rules button; first-time players get the tutorial instead) -->
<script src="scroll-hint.js"></script>   <!-- (phones: a ▾ when the rules go on below) -->
<script src="rules.js"></script>
<script src="published.js"></script>
<script src="progress.js"></script>
<script src="game.js"></script>
<script src="celebrate.js"></script>
<script>
/* Which puzzle to play comes from the URL:
     play.html?level=easy|medium|hard   whatever is published for that
                                        difficulty (published.js; the
                                        splash buttons use this)
     play.html?puzzle=<id>              a specific puzzle from puzzles.js
     play.html?playtest=<id>            a puzzle uploaded from the sandbox
                                        for testing (playtest.json; the
                                        playtest.html page links here) */
const params = new URLSearchParams(location.search);
const level = params.get('level');
const playtestId = params.get('playtest');
const wantedPuzzle = level ? (PUBLISHED[level] && PUBLISHED[level].puzzle) : PUZZLES[params.get('puzzle')];

/* ── Tutorial popup ──
   (Until 2026-11-18 it opened by itself on a first visit; now the rules do,
   see startPuzzle.) 'pb_tutorialSeen' is set when it's closed or finished.
   rules.js shows a "Play the tutorial" button whenever window.openTutorial exists. */
const TUTORIAL_SEEN_KEY = 'pb_tutorialSeen';
const tutorialOverlay = document.getElementById('tutorial-overlay');
const tutorialFrame = document.getElementById('tutorial-frame');
window.openTutorial = ()=>{
  tutorialFrame.src = ParityTheme.withTheme('tutorial.html');   // (carries light / dark: theme.js)
  tutorialOverlay.hidden = false;
  timerTick();                       // (the timer pauses while it's open)
  tutorialFrame.focus();
};
// The tutorial asks to be closed (X button, Esc, or Finish)
window.addEventListener('message', e=>{
  if(e.source !== tutorialFrame.contentWindow || !e.data || e.data.type !== 'pb-tutorial-close') return;
  tutorialOverlay.hidden = true;
  timerTick();                       // (and starts again)
  tutorialFrame.src = 'about:blank';
  try { localStorage.setItem(TUTORIAL_SEEN_KEY, '1'); } catch(err){}
  // (slide 2's "Rules" button: read the rules instead of the tutorial)
  if(e.data.openRules && window.ParityRules) ParityRules.open();
});
let tutorialSeen = false, tutorialInProgress = false;
try { tutorialSeen = localStorage.getItem(TUTORIAL_SEEN_KEY) === '1'; } catch(err){}
// The page was refreshed while the tutorial was open: reopen it (it comes back to the same slide).
// Only on a refresh, so arriving here from elsewhere never pops it up uninvited.
const wasRefreshed = (performance.getEntriesByType('navigation')[0] || {}).type === 'reload';
try { tutorialInProgress = wasRefreshed && sessionStorage.getItem('pb_tutorialSlide') !== null; } catch(err){}

/* Clear (2026-11-17, a tester: "I just needed a way to reset the board",
   and the timer restarting got in the way). Takes every piece off the
   board at once: no question, the timer keeps going, highlights stay (they
   are the player's notes). "Undo" puts the pieces back for a few seconds,
   until a piece is placed again. On a SOLVED puzzle it's still "Play
   again?", which clears the board and restarts the timer. */
const UNDO_MS = 6000;
let clearedPieces = null, undoTimer = 0;
const undoBar = document.getElementById('undo-bar');
function dropUndo(){ clearedPieces = null; clearTimeout(undoTimer); undoBar.hidden = true; }
document.getElementById('reset-btn').onclick = ()=>{
  if(solved){
    document.getElementById('reset-popup').hidden = false;
    return;
  }
  const mine = placedPieces.filter(p=>!p.locked);
  if(!mine.length) return;
  placedPieces = placedPieces.filter(p=>p.locked);
  renderAll();                                   // (saves the empty board)
  clearedPieces = mine;
  undoBar.hidden = false;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(dropUndo, UNDO_MS);
};
document.getElementById('undo-btn').onclick = ()=>{
  if(!clearedPieces) return;
  const back = clearedPieces;
  dropUndo();
  placedPieces = placedPieces.concat(back);
  renderAll();
};
document.getElementById('reset-cancel').onclick = ()=>{ document.getElementById('reset-popup').hidden = true; };
document.getElementById('reset-confirm').onclick = ()=>{
  document.getElementById('reset-popup').hidden = true;
  clearSavedBoard(saveKey);
  loadPuzzle(puzzle);
};
gameSettings.explain = false;        // a wrong board just glows red; no "Uneven rows…" message
gameSettings.showCaption = false;    // no caption under the board (e.g. "No piece crosses the dotted line.")
gameSettings.lockWhenSolved = true;  // a solved board stays as it is (Reset to play again)

/* ── Saving progress (progress.js; this browser only) ──
   The board is saved as you play (pieces on it, how the ones at the top
   are turned, and the time so far), and comes back when you return.
   Time away from the page doesn't count. Reset clears it.
   A solved board is saved too, marked solved, so coming back shows the
   finished puzzle and its time instead of an empty board.
   Solving an Easy / Medium / Hard puzzle is recorded for the Archive
   calendar on the splash screen: one star per puzzle, so solving the same
   puzzle again (after Reset, or on another day) doesn't add another. */
let saveKey = level ? 'level:' + level + ':' + ((PUBLISHED[level] || {}).publishedAt || '')
                    : 'puzzle:' + params.get('puzzle');      // (a playtest puzzle's key is set once it's loaded)
const myPieces = ()=>placedPieces.filter(p=>!p.locked).map(p=>({ name:p.name, cells:p.cells, row:p.row, col:p.col }));
function saveBoard(){
  if(!puzzle || gameMode !== 'play' || solved) return;   // (a solved board was saved when it was solved)
  timerTick();
  saveBoardState(saveKey, { placed: myPieces(), tray: trayCells, marks: getMarks(), elapsedMs: Date.now() - startTime, savedAt: new Date().toISOString() });
}
let restoring = false;     // true while a saved board is being put back
function restoreBoard(){
  const saved = loadSavedBoard(saveKey);
  if(!saved) return;
  const names = new Set(puzzle.pieces.map(d=>d.name));
  Object.keys(saved.tray || {}).forEach(n=>{ if(names.has(n)) trayCells[n] = saved.tray[n]; });
  (saved.placed || []).filter(p=>names.has(p.name)).forEach(p=>{
    placedPieces.push({ id: 'p' + (placedIdCounter++), name: p.name, color: puzzle.pieces.find(d=>d.name===p.name).color,
                        cells: p.cells, row: p.row, col: p.col });
  });
  setMarks(saved.marks);     // (the highlighted squares)
  startTime = Date.now() - (saved.elapsedMs || 0);
  restoring = true;         // (a saved solved board "solves" again here: no popup, no new star)
  renderAll();
  restoring = false;
}
/* ── The timer only counts time spent looking at the puzzle ──
   game.js times a solve as "now - startTime". Every second, any time that
   shouldn't count is added to startTime, which takes it off the clock:
     - the tab was in the background or the window minimised
     - the tutorial was open over the puzzle
     - a jump of more than 5 seconds between ticks (the computer slept;
       the timer can't tick while it's asleep) */
let lastTick = Date.now(), wasCounting = true;
function timerTick(){
  const now = Date.now(), gap = now - lastTick;
  lastTick = now;
  if(!wasCounting) startTime += gap;               // paused the whole time since the last tick
  else if(gap > 5000) startTime += gap - 1000;     // asleep: count just one second of it
  // (paused while the tutorial or the rules are open: 2026-11-18, the rules
  // open by themselves on a first visit)
  const rules = document.querySelector('.rules-backdrop');
  wasCounting = !document.hidden && tutorialOverlay.hidden && (!rules || rules.hidden);
}
setInterval(timerTick, 1000);
document.addEventListener('visibilitychange', timerTick);

/* ── Share (the Solved popup) ──
   [CONTENT] What gets shared, e.g.
       Parity Blocks 🟨 Medium
       Mon, Nov 2 · 3:41
       https://parity-blocks.vercel.app
   The square matches the level's color on the start screen (teal, gold,
   vermilion; user, 2026-11-02), so it's easy to see which puzzle someone
   means. Only the day, level and time: nothing that gives the answer away. */
const LEVEL_ICON = { easy: '🟦', medium: '🟨', hard: '🟥' };
let solvedTime = '';
function shareText(){
  const day = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const head = level && LEVEL_ICON[level]
    ? 'Parity Blocks ' + LEVEL_ICON[level] + ' ' + level[0].toUpperCase() + level.slice(1)
    : 'Parity Blocks: ' + puzzle.title;
  const link = /^https?:/.test(location.protocol) ? '\n' + location.origin : '';
  return head + '\n' + day + ' · ' + solvedTime + link;
}
const shareBtn = document.getElementById('solved-share');
shareBtn.onclick = async ()=>{
  const text = shareText();
  const touch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if(touch && navigator.share){
    try { await navigator.share({ text }); } catch(e){}    // (closing the share sheet is fine)
    return;
  }
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch(e){}
  shareBtn.textContent = copied ? 'Copied!' : 'Couldn’t copy';
  shareBtn.classList.toggle('done', copied);
  setTimeout(()=>{ shareBtn.textContent = 'Share'; shareBtn.classList.remove('done'); }, 2000);
};

enableSolvedSound();         // the jingle plays when a puzzle is solved (celebrate.js)
gameHooks.onSolved = time=>{
  solvedTime = time;
  saveBoardState(saveKey, { placed: myPieces(), marks: getMarks(), solved: true, elapsedMs: Date.now() - startTime, savedAt: new Date().toISOString() });
  if(restoring) return;
  // The win animation, in the popup (celebrate.js): the solved board, its
  // rows and columns counted on the jingle's notes, then it turns green
  // with a check mark; then "Solved!" and the time
  document.getElementById('solved-win').replaceChildren(solvedCelebration({
    puzzle, time, sound: true, level,          // (level: "Medium" etc. above "Solved!")
    pieces: placedPieces.map(q=>({ cells:q.cells, color:q.color, row:q.row, col:q.col })),
  }));
  // The next level up, if it's published: a "Play Medium" / "Play Hard" button
  const next = { easy: 'medium', medium: 'hard' }[level];
  const nextBtn = document.getElementById('solved-next');
  nextBtn.hidden = !(next && PUBLISHED[next]);
  if(!nextBtn.hidden){
    nextBtn.textContent = 'Play ' + next[0].toUpperCase() + next.slice(1) + ' →';
    nextBtn.href = 'play.html?level=' + next;
    nextBtn.className = 'next-level-btn ' + next;      // (its color: the start screen's button for that level)
  }  document.getElementById('solved-popup').hidden = false;
  if(level && PUBLISHED[level]) recordSolve(level, puzzle.title, Date.now() - startTime, saveKey);
};

/* The tab only ever says the level ("Parity Blocks: Easy"), never the
   puzzle's own name: those are internal (user, 2026-11-05). They'd also
   show up in the address bar's suggestions, which come from page titles. */
function startPuzzle(p, tabName){
  document.title = 'Parity Blocks: ' + tabName;
  loadPuzzle(p);
  restoreBoard();
  // (set after restoring, so loading doesn't overwrite the save. A piece
  // placed after Clear ends the chance to Undo it)
  gameHooks.onChange = ()=>{ saveBoard(); if(clearedPieces && myPieces().length) dropUndo(); };
  window.addEventListener('pagehide', saveBoard);      // keep the time right if they leave without moving anything
  // (2026-11-18, user: the tutorial isn't forced. First visit: the RULES open
  // by themselves (they end with a pointer to the tutorial); a refresh in the
  // middle of the tutorial still comes back to it)
  if(tutorialInProgress) window.openTutorial();
  else if(!tutorialSeen && !rulesSeen() && window.ParityRules) ParityRules.open();
}
function rulesSeen(){ try { return localStorage.getItem('pb_rulesSeen') === '1'; } catch(e){ return false; }
}
function puzzleMissing(){
  document.querySelector('.game').hidden = true;
  document.getElementById('missing-popup').hidden = false;
}
if(playtestId){
  // A playtest puzzle (uploaded from the sandbox): read playtest.json first.
  // The back button returns to the playtest page.
  document.querySelector('.back-btn').href = 'playtest.html';
  // A puzzle uploaded in the last minute isn't in the site's copy yet, so
  // then the server's fresh copy is asked (/api/playtest, 2026-11-20)
  const findIn = data=>data && (data.puzzles || []).find(e=>e.id === playtestId);
  const getJSON = url=>fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r=>r.ok ? r.json() : null).catch(()=>null);
  getJSON('playtest.json')
    .then(data=>findIn(data) || getJSON('/api/playtest').then(findIn))
    .then(entry=>{
      if(!entry) return puzzleMissing();
      saveKey = 'playtest:' + entry.id + ':' + entry.uploadedAt;    // (a re-upload starts fresh)
      startPuzzle(entry.puzzle, 'Playtest');
    })
    .catch(puzzleMissing);
} else if(wantedPuzzle){
  startPuzzle(wantedPuzzle, level ? level[0].toUpperCase() + level.slice(1) : 'Practice');
} else {
  puzzleMissing();
}
</script>
</body>
</html>
