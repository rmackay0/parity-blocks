<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  PARITY BLOCKS: GAME PAGE
  ═══════════════════════════════════════════════════════════════════════

  Opened from the splash screen as play.html?puzzle=<puzzle-key>. The
  puzzles themselves (board size, blocked cells, pieces) live in
  puzzles.js, shared with the sandbox.

  Layout, top to bottom: back button, available pieces, board, Reflect /
  Rotate buttons.

  How to play on this page:
    • Drag a piece from the top onto the board.
    • Click a piece (on the board or at the top) to rotate it clockwise;
      double-click to reflect it. Reflect / Rotate buttons and the R / F
      keys work on the last piece clicked. Esc = deselect.
    • Drag a placed piece off the board (or back up to the top) to remove it.

  EDIT GUIDE: search this file for these tags:
    [FONTS]  [COLORS]  [POSITIONING]  [CONTENT]  [BEHAVIOR]
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parity Blocks</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">

<!-- [FONTS] Same font as the splash screen's buttons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geo&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rules.css">

<link rel="stylesheet" href="game.css">
</head>
<body>

<main class="game">
  <div class="top-row">
    <!-- (A drawn chevron, not the ‹ character, so it sits dead centre in the circle) -->
    <a class="back-btn" href="index.html" aria-label="Back to menu"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M13 4 L7 10 L13 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <div class="top-right">
      <!-- Clears the board (asks first). Tucked in the corner on purpose. -->
      <button type="button" class="reset-btn" id="reset-btn" aria-label="Reset puzzle">Reset</button>
      <!-- Opens the rules popup (rules.js); styled by rules.css -->
      <button type="button" class="rules-btn" data-open-rules>Rules</button>
    </div>
  </div>

  <!-- The pieces to place. Once solved (every piece is on the board, so
       this space is empty) it says "Solved in 2:31" instead -->
  <div class="tray-area">
    <div class="tray" id="tray" aria-label="Available pieces"></div>
    <p class="solved-badge" id="solved-badge" hidden></p>
  </div>

  <!-- Mistakes only glow red here (no written explanation; see
       gameSettings.explain below), so the message area is hidden and the
       board gets its space -->
  <p class="status" id="status" role="status" aria-live="polite" hidden></p>

  <div class="board-wrap" id="board-wrap">
    <div id="board-outer">
      <div id="board"></div>
      <div id="pieces-layer"></div>
      <div id="hint-overlay"></div>
      <svg id="mark-overlay" aria-hidden="true"></svg>
    </div>
  </div>

  <p class="hint-caption" id="hint-caption" hidden></p>
</main>

<!-- [CONTENT] Shown when the puzzle is solved -->
<div class="popup-backdrop" id="solved-popup" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-label="Solved">
    <!-- The solved badge: checkmark animation + jingle (celebrate.js) -->
    <div class="solved-win" id="solved-win"></div>
    <!-- After Easy: "Play Medium"; after Medium: "Play Hard" (set in onSolved) -->
    <a class="next-level-btn" id="solved-next" hidden></a>
    <div class="popup-buttons">
      <a href="index.html">Menu</a>
      <button type="button" class="secondary" id="solved-close">Close</button>
    </div>
  </div>
</div>

<!-- The interactive tutorial (tutorial.html) appears in this popup the first
     time someone opens a puzzle, and from the Rules popup's button -->
<div class="tutorial-overlay" id="tutorial-overlay" hidden>
  <iframe id="tutorial-frame" title="Tutorial"></iframe>
</div>

<!-- [CONTENT] "Are you sure?" before Reset clears the board -->
<div class="popup-backdrop" id="reset-popup" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="reset-title">
    <h2 id="reset-title">Start over?</h2>
    <p id="reset-text">This takes every piece off the board and restarts the timer.</p>
    <div class="popup-buttons">
      <button type="button" class="secondary" id="reset-cancel">Keep playing</button>
      <button type="button" id="reset-confirm">Reset</button>
    </div>
  </div>
</div>

<!-- [CONTENT] Shown if the link points at a puzzle that doesn't exist -->
<div class="popup-backdrop" id="missing-popup" hidden>
  <div class="popup" role="dialog" aria-modal="true">
    <h2>Puzzle not found</h2>
    <p>This puzzle link isn't valid.</p>
    <div class="popup-buttons"><a href="index.html">Back to menu</a></div>
  </div>
</div>

<script src="puzzles.js"></script>
<script src="shapes.js"></script>
<!-- Rules popup (opens from the Rules button; first-time players get the tutorial instead) -->
<script src="rules.js"></script>
<script src="published.js"></script>
<script src="progress.js"></script>
<script src="game.js"></script>
<script src="celebrate.js"></script>
<script>
/* Which puzzle to play comes from the URL:
     play.html?level=easy|medium|hard   whatever is published for that
                                        difficulty (published.js; the
                                        splash buttons use this)
     play.html?puzzle=<id>              a specific puzzle from puzzles.js */
const params = new URLSearchParams(location.search);
const level = params.get('level');
const wantedPuzzle = level ? (PUBLISHED[level] && PUBLISHED[level].puzzle) : PUZZLES[params.get('puzzle')];

/* ── Tutorial popup ──
   Opens automatically once per browser (remembered in localStorage as
   'pb_tutorialSeen' when it's closed or finished). rules.js shows a
   "Play the tutorial" button whenever window.openTutorial exists. */
const TUTORIAL_SEEN_KEY = 'pb_tutorialSeen';
const tutorialOverlay = document.getElementById('tutorial-overlay');
const tutorialFrame = document.getElementById('tutorial-frame');
window.openTutorial = ()=>{
  tutorialFrame.src = 'tutorial.html';
  tutorialOverlay.hidden = false;
  tutorialFrame.focus();
};
// The tutorial asks to be closed (X button, Esc, or Finish)
window.addEventListener('message', e=>{
  if(e.source !== tutorialFrame.contentWindow || !e.data || e.data.type !== 'pb-tutorial-close') return;
  tutorialOverlay.hidden = true;
  tutorialFrame.src = 'about:blank';
  try { localStorage.setItem(TUTORIAL_SEEN_KEY, '1'); } catch(err){}
});
let tutorialSeen = false, tutorialInProgress = false;
try { tutorialSeen = localStorage.getItem(TUTORIAL_SEEN_KEY) === '1'; } catch(err){}
// The page was refreshed while the tutorial was open: reopen it (it comes back to the same slide).
// Only on a refresh, so arriving here from elsewhere never pops it up uninvited.
const wasRefreshed = (performance.getEntriesByType('navigation')[0] || {}).type === 'reload';
try { tutorialInProgress = wasRefreshed && sessionStorage.getItem('pb_tutorialSlide') !== null; } catch(err){}

// Reset: asks first, then clears the board and restarts the timer. On a
// solved puzzle it's the way to play it again.
document.getElementById('reset-btn').onclick = ()=>{
  document.getElementById('reset-title').textContent = solved ? 'Play again?' : 'Start over?';
  document.getElementById('reset-text').textContent = solved
    ? 'This clears the board so you can solve it again. Your star stays in the Archive.'
    : 'This takes every piece off the board and restarts the timer.';
  document.getElementById('reset-popup').hidden = false;
};
document.getElementById('reset-cancel').onclick = ()=>{ document.getElementById('reset-popup').hidden = true; };
document.getElementById('reset-confirm').onclick = ()=>{
  document.getElementById('reset-popup').hidden = true;
  clearSavedBoard(saveKey);
  document.getElementById('solved-badge').hidden = true;
  loadPuzzle(puzzle);
};
gameSettings.explain = false;        // a wrong board just glows red; no "Uneven rows…" message
gameSettings.showCaption = false;    // no caption under the board (e.g. "No piece crosses the dotted line.")
gameSettings.lockWhenSolved = true;  // a solved board stays as it is (Reset to play again)

/* ── Saving progress (progress.js; this browser only) ──
   The board is saved as you play (pieces on it, how the ones at the top
   are turned, and the time so far), and comes back when you return.
   Time away from the page doesn't count. Reset clears it.
   A solved board is saved too, marked solved, so coming back shows the
   finished puzzle and its time instead of an empty board.
   Solving an Easy / Medium / Hard puzzle is recorded for the Archive
   calendar on the splash screen: one star per puzzle, so solving the same
   puzzle again (after Reset, or on another day) doesn't add another. */
const saveKey = level ? 'level:' + level + ':' + ((PUBLISHED[level] || {}).publishedAt || '')
                      : 'puzzle:' + params.get('puzzle');
const myPieces = ()=>placedPieces.filter(p=>!p.locked).map(p=>({ name:p.name, cells:p.cells, row:p.row, col:p.col }));
function saveBoard(){
  if(!puzzle || gameMode !== 'play' || solved) return;   // (a solved board was saved when it was solved)
  saveBoardState(saveKey, { placed: myPieces(), tray: trayCells, elapsedMs: Date.now() - startTime, savedAt: new Date().toISOString() });
}
let restoring = false;     // true while a saved board is being put back
function restoreBoard(){
  const saved = loadSavedBoard(saveKey);
  if(!saved) return;
  const names = new Set(puzzle.pieces.map(d=>d.name));
  Object.keys(saved.tray || {}).forEach(n=>{ if(names.has(n)) trayCells[n] = saved.tray[n]; });
  (saved.placed || []).filter(p=>names.has(p.name)).forEach(p=>{
    placedPieces.push({ id: 'p' + (placedIdCounter++), name: p.name, color: puzzle.pieces.find(d=>d.name===p.name).color,
                        cells: p.cells, row: p.row, col: p.col });
  });
  startTime = Date.now() - (saved.elapsedMs || 0);
  restoring = true;          // (a saved solved board "solves" again here: no popup, no new star)
  renderAll();
  restoring = false;
}
enableSolvedSound();         // the jingle plays when a puzzle is solved (celebrate.js)
gameHooks.onSolved = time=>{
  const badge = document.getElementById('solved-badge');
  badge.replaceChildren(solvedBadge('Solved in ' + time));
  badge.hidden = false;
  saveBoardState(saveKey, { placed: myPieces(), solved: true, elapsedMs: Date.now() - startTime, savedAt: new Date().toISOString() });
  if(restoring) return;
  document.getElementById('solved-win').replaceChildren(solvedBadge('Solved!', 'Your time: ' + time, { animate: true, sound: true, stack: true }));
  // The next level up, if it's published: a "Play Medium" / "Play Hard" button
  const next = { easy: 'medium', medium: 'hard' }[level];
  const nextBtn = document.getElementById('solved-next');
  nextBtn.hidden = !(next && PUBLISHED[next]);
  if(!nextBtn.hidden){
    nextBtn.textContent = 'Play ' + next[0].toUpperCase() + next.slice(1) + ' →';
    nextBtn.href = 'play.html?level=' + next;
    nextBtn.className = 'next-level-btn ' + next;      // (its color: the start screen's button for that level)
  }
  document.getElementById('solved-popup').classList.toggle('has-next', !nextBtn.hidden);
  document.getElementById('solved-popup').hidden = false;
  if(level && PUBLISHED[level]) recordSolve(level, puzzle.title, Date.now() - startTime, saveKey);
};

if(wantedPuzzle){
  document.title = 'Parity Blocks: ' + wantedPuzzle.title;
  loadPuzzle(wantedPuzzle);
  restoreBoard();
  gameHooks.onChange = saveBoard;                      // (set after restoring, so loading doesn't overwrite the save)
  window.addEventListener('pagehide', saveBoard);      // keep the time right if they leave without moving anything
  if(!tutorialSeen || tutorialInProgress) window.openTutorial();
} else {
  document.querySelector('.game').hidden = true;
  document.getElementById('missing-popup').hidden = false;
}
</script>
</body>
</html>
