/* ── Slide 3's sum, animated (user, 2026-11-13) ──
   1  the highlights clear one at a time
   2  every piece slides up off the grid into the row above it
   3  each row, then each column, of the empty grid is counted: 6 each;
      "This grid has 36 squares." (Got it)
   4  the grid goes dark, the pieces stay lit and bump one at a time:
      "6 pentominoes × 5 blocks = 30 blocks" (Got it)
   5  the pieces fly back into place; "36 − 30 = 6 empty squares" shows
      above the grid, and each empty square is highlighted and numbered 1–6
   The pieces' row above the grid is the size of all six pieces from the
   start of the slide, so the grid never moves. */
const EX = {                     // [BEHAVIOR] timings (ms)
  unmarkEach: 90,                // the highlights clearing
  toTray: 450, toTrayStagger: 300,   // one by one, quickly; each one starts as the last lands
  countStep: 380,                // counting the empty grid's rows and columns
  bumpEach: 320,                 // the pieces bumping one at a time
  back: 600, backStagger: 140,
  numberEach: 650,               // each empty square numbered
};
let explainerSaved = null;       // the fixed pieces while they're up in the row above
function pieceDefs(){ return puzzle.fixedPieces.map(f=>({ name: f.name, color: f.color, cells: f.cells.map(c=>c.slice()) })); }
function reserveTrayRoom(){
  const defs = pieceDefs(), tray = $('tray');
  defs.forEach(d=>{ trayCells[d.name] = d.cells.map(c=>c.slice()); });
  puzzle.pieces = defs; renderTray();
  const h = tray.offsetHeight;
  puzzle.pieces = []; renderTray();
  tray.style.minHeight = h + 'px';
  placeHighlighterTool();
}
/* Moving a piece between the grid and the row above it (user, 2026-11-13:
   the pieces must look exactly like the game's while they move). The two
   places draw a piece at different sizes (the row above has smaller
   squares and thinner gaps), so what moves is always a COPY OF THE GRID'S
   DRAWING: going up it starts identical to the piece on the grid and
   shrinks into the slot above; coming down it grows from the slot and
   lands identical. The real piece at the far end stays hidden until its
   copy arrives, then the copy goes.
     big    the piece's .piece-box on the grid (copied) and where it is
     small  where the piece is (or will be) in the row above
     up     true = grid → row above; false = row above → grid
     target the element to reveal when the copy arrives */
function glidePiece(big, bigRect, smallRect, up, target, ms, delay){
  if(REDUCED_MOTION){ return; }
  const ghost = big.cloneNode(true);
  Object.assign(ghost.style, { position: 'fixed', left: bigRect.left + 'px', top: bigRect.top + 'px', margin: '0',
                               zIndex: 70, pointerEvents: 'none', transformOrigin: '0 0' });
  document.body.appendChild(ghost);
  target.style.visibility = 'hidden';
  const s = smallRect.width / bigRect.width;
  const atGrid = 'translate(0px, 0px) scale(1)';
  const lifted = `translate(${-bigRect.width * 0.03}px, ${-bigRect.height * 0.03}px) scale(1.06)`;
  const atTop = `translate(${smallRect.left - bigRect.left}px, ${smallRect.top - bigRect.top}px) scale(${s})`;
  const flat = 'drop-shadow(0 0 0 rgba(0,0,0,0))', held = 'drop-shadow(0 8px 8px rgba(0,0,0,0.25))';
  // up: picked up off the grid, then dragged to the top; down: dragged
  // down, then set onto the grid
  const frames = up
    ? [ { transform: atGrid, filter: flat }, { transform: lifted, filter: held, offset: 0.2 }, { transform: atTop, filter: flat } ]
    : [ { transform: atTop, filter: flat }, { transform: lifted, filter: held, offset: 0.8 }, { transform: atGrid, filter: flat } ];
  const anim = ghost.animate(frames, { duration: ms, delay, easing: 'ease-in-out', fill: 'both' });
  const land = ()=>{ target.style.visibility = ''; ghost.remove(); };
  anim.onfinish = land;
  anim.oncancel = land;
  // (leaving the slide mid-move: no copy is left behind)
  const run = animRun;
  const sweep = setInterval(()=>{ if(run !== animRun || !document.body.contains(ghost)){ clearInterval(sweep); if(document.body.contains(ghost)) land(); } }, 200);
}
const boardBoxOf = name=>{ const p = placedPieces.find(q=>q.name === name); const el = p && boardPieceEl(p.id); return el && el.querySelector('.piece-box'); };
function runExplainer(onDone){
  $('hl-tool').classList.add('fading');
  // 1: the highlights clear, last first
  const keys = Object.keys(getMarks());
  keys.slice().reverse().forEach((k, i)=>later(i * EX.unmarkEach, ()=>{ const m = getMarks(); delete m[k]; setMarks(m); }));
  let t = keys.length * EX.unmarkEach + 350;
  // 2: the pieces go up into the row above
  later(t, ()=>{
    // (copies of the grid's drawings, taken before the grid is cleared)
    const from = puzzle.fixedPieces.map(f=>{ const el = boardBoxOf(f.name); return el && { name: f.name, el, rect: el.getBoundingClientRect() }; }).filter(Boolean);
    explainerSaved = placedPieces;
    pieceDefs().forEach(d=>{ trayCells[d.name] = d.cells; });
    puzzle.pieces = pieceDefs();
    placedPieces = [];
    renderAll();
    from.forEach((p, i)=>{ const top = trayPieceEl(p.name);
      if(top) glidePiece(p.el, p.rect, top.getBoundingClientRect(), true, top, EX.toTray, i * EX.toTrayStagger); });
  });
  t += EX.toTray + 5 * EX.toTrayStagger + 400;
  // 3: count the empty grid: 6 in every row and column
  later(t, ()=>{
    const all = new Set();
    for(let r=0; r<puzzle.rows; r++) for(let c=0; c<puzzle.cols; c++) all.add(r + ',' + c);
    showBanner('Counting the squares', 'counts', true);
    // (user, 2026-11-13: measuring lines, not each row and column lit)
    // (the label goes first, then the popup: nothing left over from the
    // step before a popup, user 2026-11-13)
    drawDimensions(()=>{
      $('eq-banner').classList.add('gone');
      later(CLEAR_MS, ()=>showHint([{ lit: 'board', over: true, keepDark: true,
        html: '<p class="ex-big">This grid is 6 &times; 6 squares, so it has <b>36 squares</b>.</p>' }], 0, explainPieces));
    });
  });
  // 4: the pieces lit, the grid dark
  function explainPieces(){
    clearLeftovers();
    later(CLEAR_MS, ()=>{
      showHint([{ lit: 'tray', over: true,
        html: '<p class="ex-big">There are <b>6 pentominoes</b>, with 5 blocks per piece.</p><p class="ex-big">That&rsquo;s <b>30 blocks</b> total.</p>' }], 0, retile);
      puzzle.pieces.forEach((d, i)=>later(400 + i * EX.bumpEach, ()=>{
        const el = trayPieceEl(d.name);
        if(el && !REDUCED_MOTION) el.animate([{ transform: 'none' }, { transform: 'scale(1.18)' }, { transform: 'none' }], { duration: 300, easing: 'ease-out' });
      }));
    });
  }
  // 5: back into place, then 36 − 30 = 6, each empty square numbered
  function retile(){
    const from = puzzle.pieces.map(d=>{ const el = trayPieceEl(d.name); return el && { name: d.name, rect: el.getBoundingClientRect() }; }).filter(Boolean);
    puzzle.pieces = [];
    placedPieces = explainerSaved;
    renderAll();
    from.forEach((p, i)=>{ const el = boardBoxOf(p.name);
      if(el) glidePiece(el, el.getBoundingClientRect(), p.rect, false, el, EX.back, i * EX.backStagger); });
    const empties = emptyOf(puzzle);
    let u = EX.back + 5 * EX.backStagger + 400;
    later(u, ()=>showBanner(EQUATION_HTML, 'tray', true));
    u += 900;
    empties.forEach((k, i)=>later(u + i * EX.numberEach, ()=>{
      const m = getMarks(); m[k] = 0; setMarks(m);
      drawNumbers([k], true, i + 1);
    }));
    // (the numbers and the sum stay; Next lights up: user, 2026-11-13)
    later(u + empties.length * EX.numberEach + 600, onDone);
  }
}
const EQUATION_HTML = '36 &minus; 30 = <b>6</b> empty squares';
/* RULE (user, 2026-11-13): before a popup or the Next button comes, the
   text and labels from the step before are gone. clearLeftovers fades
   them (the label above the grid, the numbers on squares, the measuring
   lines); wait CLEAR_MS before showing the next thing. */
const CLEAR_MS = 400;
function clearLeftovers(){
  $('eq-banner').classList.add('gone');
  const svg = $('tut-overlay');
  svg.querySelectorAll('.sq-num').forEach(el=>el.classList.add('gone'));
  svg.querySelectorAll('.dim-line').forEach(el=>{ el.style.transition = 'opacity 0.35s'; el.style.opacity = '0'; });
  later(CLEAR_MS, ()=>svg.querySelectorAll('.sq-num, .dim-line').forEach(el=>el.remove()));

/* Measuring lines (user, 2026-11-13): one along the bottom of the grid,
   one up its left side. Each grows out from its middle to the grid's ends,
   with a short line across each end (like a measurement on a drawing),
   then the number of squares (6) pops into a gap in its middle. The
   bottom one first, then the side one. */
const DIM = { growMs: 650, gapMs: 350, holdMs: 900, tick: 12, off: 16 };   // [BEHAVIOR]
function drawDimensions(onDone){
  const svg = $('tut-overlay');
  const w = puzzle.cols*CELL + (puzzle.cols-1)*GAP, h = puzzle.rows*CELL + (puzzle.rows-1)*GAP;
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  const pad = cssPx('--board-pad');
  // one measuring line: across (x from 0 to len at y = at) or down
  const one = (across, len, at, n, delay)=>{
    const g = svgEl('g', { class: 'dim-line' }, svg);
    const P = (a, b)=>across ? [a, b] : [b, a];          // (along, across) → (x, y)
    const mid = len / 2, t = DIM.tick / 2;
    const [x1, y1] = P(0, at), [x2, y2] = P(len, at);
    const line = svgEl('line', { x1, y1, x2, y2, class: 'dim-stroke' }, g);
    const ends = [0, len].map(a=>{ const [ax, ay] = P(a, at - t), [bx, by] = P(a, at + t);
      return svgEl('line', { x1: ax, y1: ay, x2: bx, y2: by, class: 'dim-stroke' }, g); });
    // the number, on a patch of the page's color so the line breaks round it
    const [cx, cy] = P(mid, at), r = 13;
    const label = svgEl('g', { class: 'dim-label' }, g);
    svgEl('rect', { x: cx - r, y: cy - r, width: 2*r, height: 2*r, rx: r, class: 'dim-patch' }, label);
    const txt = svgEl('text', { x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'dim-num' }, label);
    txt.textContent = n;
    label.style.opacity = '0';
    g.style.opacity = '0';
    later(delay, ()=>{
      g.style.opacity = '';
      if(REDUCED_MOTION){ label.style.opacity = ''; return; }
      const axis = across ? 'X' : 'Y';
      line.style.transformOrigin = `${cx}px ${cy}px`;     // (grows out from its middle)
      line.animate([{ transform: `scale${axis}(0)` }, { transform: 'none' }], { duration: DIM.growMs, easing: 'cubic-bezier(.3,.8,.35,1)' });
      ends.forEach((e, i)=>{
        const d = (i ? -1 : 1) * mid, [dx, dy] = P(d, 0);
        e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: DIM.growMs, easing: 'cubic-bezier(.3,.8,.35,1)' });
      });
      later(DIM.growMs, ()=>{ label.style.opacity = ''; label.classList.add('pop'); });
    });
  };
  // (left side and bottom, user 2026-11-13: the counts use the top and right)
  one(true, w, h + pad + DIM.off, puzzle.cols, 0);                    // along the bottom
  one(false, h, -pad - DIM.off, puzzle.rows, DIM.growMs + DIM.gapMs); // up the left side
  later(2 * DIM.growMs + DIM.gapMs + 400 + DIM.holdMs, onDone);
}
// The label above the grid: 'tray' = centred in the (empty) row above the
// grid; 'counts' = just above the column counts, while counting
function showBanner(html, where, animate){
  const b = $('eq-banner'), play = $('play').getBoundingClientRect();
  b.innerHTML = html;
  b.classList.remove('gone');
  b.classList.toggle('still', !animate);
  b.classList.toggle('small', where === 'counts');
  b.hidden = false;
  if(where === 'counts'){
    const board = $('board-outer').getBoundingClientRect();
    b.style.top = (board.top - COUNT_ROOM - b.offsetHeight - 2 - play.top) + 'px';
  } else {
    const tray = $('tray').getBoundingClientRect();
    b.style.top = (tray.top - play.top + (tray.height - b.offsetHeight) / 2) + 'px';
  }
}
// Numbers on empty squares: keys in order, numbered from `first` (default 1)
function drawNumbers(keys, animate, first){
  const svg = $('tut-overlay');
  const w = puzzle.cols*CELL + (puzzle.cols-1)*GAP, h = puzzle.rows*CELL + (puzzle.rows-1)*GAP;
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  keys.forEach((k, i)=>{
    const [r, c] = k.split(',').map(Number);
    const n = svgEl('text', { x: pxPos(c) + CELL/2, y: pxPos(r) + CELL/2, 'text-anchor':'middle', 'dominant-baseline':'central',
                              class: 'sq-num' + (animate ? '' : ' still'), style: `font-size:${Math.round(CELL * 0.5)}px` }, svg);
    n.textContent = (first || 1) + i;
  });
}
function checkAllEmptyFound(){
  if(findStage !== 'find') return;
  const m = getMarks();
  if(!emptyOf(puzzle).every(k=>m[k] !== undefined)) return;
  findStage = 'explain';
  stepEvent('allEmpty');
  later(500, ()=>{ setHighlighting(false); runFindPopups(SLIDES[current].findEmpty.popups, 0); });
}
function runFindPopups(list, i){
  if(i >= list.length){ markDone(); return; }
  const p = list[i];
  if(p.explainer){ runExplainer(()=>runFindPopups(list, i + 1)); return; }
  // countAfter: OK first, then the empty squares are counted
  if(p.countAfter){
    // (the sum and the numbers from the slide before fade first: user, 2026-11-13)
    clearLeftovers();
    later(CLEAR_MS, ()=>showHint([{ lit: 'board', ok: 'OK', html: p.html }], 0, ()=>{
      later(300, ()=>drawCounts(true, ()=>runFindPopups(list, i + 1), { squares: emptyNow(), step: 650 }));
    }));
    return;
  }
  const show = ()=>showHint([{ lit: 'board', ok: p.ok || 'OK', glow: p.glow, html: p.html }], 0, ()=>later(250, ()=>runFindPopups(list, i + 1)));
  if(p.countBefore) drawCounts(true, ()=>later(400, show), { squares: emptyNow(), step: 650 });
  else later(300, show);
}

/* ── "Don't place a piece over" slide ──
   Plays each picture's animation in turn with a highlighted square behind
   it; after the last one, Next lights up (straight away if you've been
   here before, but the animations still replay). */
function showDontSlide(){
  const box = $('dont');
  box.innerHTML = '';
  const figs = DONT_ITEMS.map(([kind, label])=>{
    const f = document.createElement('figure');
    f.appendChild(dontPicture(kind, true));
    const c = document.createElement('figcaption'); c.textContent = label; f.appendChild(c);
    box.appendChild(f);
    return f;
  });
  // The heading glows just long enough to read, fades (0.7 s, see .callout),
  // and only then do the pictures start animating
  const heading = $('dont-slide').querySelector('h2');
  heading.className = 'callout lit';
  const READ = 1070;            // ms the heading stays lit
  const START = READ + 200;     // first animation starts as the heading's glow fades
  later(READ, ()=>heading.classList.remove('lit'));
  const STEP = 2000;   // ms per picture (time to read each one)
  figs.forEach((f, i)=>{
    later(START + i*STEP,        ()=>{ f.classList.add('active'); playDont(f.querySelector('svg')); });
    later(START + i*STEP + 1800, ()=>f.classList.remove('active'));
  });
  later(START + figs.length*STEP, markDone);
}

/* ── Counting: the blocks in every row, then every column ──
   (Slides 2, 4 and 6 once solved; slide 5 counts the empty squares instead.)
   Each line's squares flash green one line at a time; its count appears
   (right of rows, above columns) and stays. Then Next lights up. With
   animate = false, just draw all the counts. */
function countedSquares(){
  const set = new Set();
  solvedView[current].pieces.forEach(p=>p.cells.forEach(([r,c])=>set.add((p.row+r)+','+(p.col+c))));
  return set;
}
// The squares no piece covers right now (2026-11-12: slides 3–5 count these)
function emptyNow(){
  const pieces = (gameMode === 'view' && solvedView[current]) ? solvedView[current].pieces : placedPieces;
  return new Set(emptyOf(puzzle, pieces));
}
// onDone: what happens after the last count (default: the solved note, then Next lights up)
// opts (2026-11-12): { squares: a Set of "r,c" to count instead of the
// blocks (e.g. the empty squares), step: ms per line }. Odd counts are red.
function drawCounts(animate, onDone, opts){
  opts = opts || {};
  const svg = $('tut-overlay');
  svg.querySelectorAll('.count, .row-glow').forEach(el=>el.remove());   // (keeps slide 5's highlights)
  const w = puzzle.cols*CELL + (puzzle.cols-1)*GAP, h = puzzle.rows*CELL + (puzzle.rows-1)*GAP;
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  const pad = cssPx('--board-pad');
  const filled = opts.squares || (SLIDES[current].countEmpty ? emptyNow() : countedSquares());
  const lines = [];
  for(let r=0; r<puzzle.rows; r++){
    const cells = []; for(let c=0; c<puzzle.cols; c++) if(filled.has(r+','+c)) cells.push([r,c]);
    lines.push({ cells, x: w + pad + 14, y: pxPos(r) + CELL/2 });   // count to the right of the row
  }
  for(let c=0; c<puzzle.cols; c++){
    const cells = []; for(let r=0; r<puzzle.rows; r++) if(filled.has(r+','+c)) cells.push([r,c]);
    lines.push({ cells, x: pxPos(c) + CELL/2, y: -pad - 14 });     // count above the column
  }
  const addCount = line=>{
    const t = svgEl('text', { x: line.x, y: line.y, 'text-anchor':'middle', 'dominant-baseline':'central',
                              class:'count' + (line.cells.length % 2 ? ' odd' : '') }, svg);
    t.textContent = line.cells.length;
  };
  if(!animate){ lines.forEach(addCount); return; }
  const STEP = opts.step || 490;    // ms per row/column: slow enough to follow each one
  const PAUSE = 375;   // extra pause between the rows and the columns
  const at = i => 300 + i*STEP + (i >= puzzle.rows ? PAUSE : 0);
  lines.forEach((line, i)=>{
    later(at(i), ()=>{
      const glows = line.cells.map(([r,c])=>svgEl('rect', { x: pxPos(c), y: pxPos(r), width: CELL, height: CELL, rx: 4,
                                                             class:'row-glow' + (line.cells.length % 2 ? ' odd' : '') }, svg));
      requestAnimationFrame(()=>glows.forEach(g=>g.classList.add('on')));   // fade in
      addCount(line);                                                        // the number pops in and stays
      later(STEP * 0.8, ()=>glows.forEach(g=>g.classList.remove('on')));   // fade out
      later(STEP * 0.8 + 200, ()=>glows.forEach(g=>g.remove()));
    });
  });
  later(at(lines.length) + 150, onDone || (()=>{ addSolvedNote(); markDone(); }));
}

function closeTutorial(finished){
  try { sessionStorage.removeItem(SLIDE_KEY); } catch(e){}   // next time starts from slide 1
  // Inside the popup on a puzzle page: ask that page to close it
  if(window.parent !== window) window.parent.postMessage({ type:'pb-tutorial-close', finished: !!finished }, '*');
  else {
    // Opened as its own page (the splash screen's Tutorial button): remember
    // it's been seen, so it won't pop up again on the first puzzle, then go back
    try { localStorage.setItem('pb_tutorialSeen', '1'); } catch(e){}
    location.href = 'index.html';
  }
}

/* ── Large text button (top left) ──
   Same setting as the rules popup's button ('pb_largeText' in localStorage). */
function isLargeText(){ try { return localStorage.getItem('pb_largeText') === '1'; } catch(e){ return false; } }
function showLargeText(){
  const on = isLargeText(), btn = $('text-size-btn');
  document.documentElement.classList.toggle('large-text', on);
  btn.textContent = on ? 'Standard text' : 'Large text';
  btn.classList.toggle('is-large-label', !on);      // "Large text" shows in bold
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
}
$('text-size-btn').onclick = ()=>{
  try { localStorage.setItem('pb_largeText', isLargeText() ? '0' : '1'); } catch(e){}
  showLargeText();
  if(!$('play').hidden){
    setupBoard(); renderAll();                       // re-fit the board to the new space
    const s = SLIDES[current];
    if(gameMode === 'view' && s.countAnimation && done[current]) drawCounts(false);   // re-place the counts
    placeBubble();                                   // (slide 5's popup, if it's showing)
  }
};
showLargeText();

$('next-btn').onclick = ()=>{
  if(!done[current]) return;
  if(current === SLIDES.length - 1) closeTutorial(true);
  else showSlide(current + 1);
};
$('back-btn').onclick = ()=>{ if(current > 0) showSlide(current - 1); };
$('close-x').onclick = ()=>closeTutorial(false);
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(!$('spot').hidden) closeHint();     // Esc closes the hint first
  else closeTutorial(false);
});

// Start where they were if the page was refreshed mid-tutorial (the slides
// before it count as done), otherwise at slide 1
let startAt = 0;
try { startAt = parseInt(sessionStorage.getItem(SLIDE_KEY), 10) || 0; } catch(e){}
if(!(startAt > 0 && startAt < SLIDES.length)) startAt = 0;
for(let i = 0; i < startAt; i++) done[i] = true;
showSlide(startAt);
attachScrollHint(document.querySelector('.tut-body'));   // (phones: a ▾ while the slide goes on below)
</script>
