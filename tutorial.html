<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  PARITY BLOCKS: INTERACTIVE TUTORIAL
  ═══════════════════════════════════════════════════════════════════════
  Shown in a popup (an <iframe>) the first time someone opens a puzzle,
  and from "Play the tutorial" in the Rules popup. It can also be opened
  on its own: tutorial.html.

  Six slides:
    1  Game objectives and the 12 pentominoes   (no task: Next is ready)
    2  Rotate (click / tap, or R), then drag onto the grid: a two-step
       note, each step glowing in turn. On solving, "Solved!"
    3  Empty spaces: slide 2's solved board comes back, dims, and a
       highlighted note appears under it line by line (empty spaces,
       permanent empty spaces, count them the same), while the squares
       each line is about glow on the board
    4  "Don't place a piece over…": four pictures animate one at a time
    5  Reflect (double-click / tap twice, or E), then drag: same two-step
       note, plus "you can also rotate and reflect pieces on the grid"
    6  Make every row and column even (the parity puzzle). If they put W
       and P in the outlined area (always wrong), a glowing Hint button
       appears: it darkens the page, spotlights the permanent empty
       space and explains. On solving, each row then column flashes
       green and its count appears. Last button says "Finish"
  Slides 2, 5 and 6 are real mini puzzles running on the game's own code
  (game.js / game.css), with some pieces fixed in place. Next turns green
  only once the slide's task (and any animation) is finished.
  Refreshing the page comes back to the same slide (sessionStorage
  'pb_tutorialSlide'; cleared when the tutorial is closed or finished).

  Top left: a "Large text" button (shared setting with the rules popup)
  that makes the reading text much bigger; it then says "Standard text".

  Words used everywhere (see HANDOFF.md):
    block                  one square of a piece      piece  a pentomino
    permanent empty space  a square with a red X
    empty space            an empty square left between pieces

  [CONTENT] All wording is in SLIDES below. "Tap" vs "Click" is chosen
  automatically (touchscreen vs mouse).
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parity Blocks: Tutorial</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geo&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rules.css">
<link rel="stylesheet" href="game.css">
<style>
  :root {
    --color-next-ready: #6fae5a;     /* [COLORS] Next / Finish once the slide is done */
    --color-close:      #c94a4a;     /* [COLORS] the X button */
    --color-tut-title:  #6fb5b0;     /* [COLORS] the "Tutorial" title (teal, like the logo / Easy button) */
    --tut-board:        min(360px, 40vh, 86vw);   /* [POSITIONING] board area size */
  }
  body { overflow: hidden; }
  .tut {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--color-panel);
  }

  /* ── Header: title, progress dots, close X ── */
  .tut-head { position: relative; flex: 0 0 auto; padding: 14px 60px 8px; text-align: center; }
  .tut-head h1 { font-family: var(--font-display); font-size: 1.9rem; font-weight: 400; color: var(--color-tut-title); line-height: 1; }
  .dots { display: flex; justify-content: center; gap: 9px; margin-top: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--color-cell-border); transition: background 0.2s, transform 0.2s; }
  .dot.done { background: var(--color-text-dim); }
  .dot.now  { background: var(--color-accent); transform: scale(1.25); }
  .close-x {
    position: absolute; top: 12px; right: 14px;
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--color-close); color: #fff;
    font: 700 1.3rem/1 system-ui, sans-serif; cursor: pointer;
  }
  .close-x:hover { filter: brightness(1.15); }

  /* ── Slide area ── */
  .tut-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 20px 12px; }
  .note { font-size: 1.1rem; line-height: 1.45; color: var(--color-text); }
  .note b { color: var(--color-accent); font-weight: 400; }

  /* Slide 1 */
  .intro { max-width: 640px; margin: 0 auto; padding-top: 6px; }
  .intro h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 400; color: var(--color-accent); margin-bottom: 8px; }
  .intro ol { padding-left: 26px; margin-bottom: 14px; }
  .intro li { font-size: 1.15rem; line-height: 1.45; margin-bottom: 4px; }
  .intro p { font-size: 1.05rem; line-height: 1.5; color: var(--color-text); margin-bottom: 14px; }
  .intro .fun { color: var(--color-text-dim); }
  .twelve { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 10px; justify-items: center; align-items: center;
            background: var(--color-board-bg); border-radius: 14px; padding: 16px 10px; }
  @media (max-width: 520px) { .twelve { grid-template-columns: repeat(4, 1fr); } }

  /* Slides 2-4: notes sit beside the parts they describe */
  .play {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-areas:
      "trayl tray  trayr"
      ".     stat  ."
      "boardl board boardr"
      "below below below";
    align-items: center;
    column-gap: 22px;
    row-gap: 8px;
  }
  .play .tray { grid-area: tray; max-width: 460px; min-height: 60px; }
  /* The message above the board is exactly as wide as the board, so a long
     message wraps instead of widening the middle column (which would shift
     the board sideways) */
  .play .status { grid-area: stat; width: var(--tut-board); max-width: none; justify-self: center; }
  .play .board-wrap { grid-area: board; width: var(--tut-board); height: var(--tut-board); justify-self: center; }
  .n-trayl  { grid-area: trayl;  justify-self: end; text-align: right; display: flex; align-items: center; max-width: 320px; }
  /* (Never taller than the board, so a long note can't make the row grow
     and shift the board; extra text just runs on below) */
  .n-boardr { grid-area: boardr; justify-self: start; max-width: 300px; max-height: var(--tut-board); }
  .n-boardl { grid-area: boardl; justify-self: end; max-width: 270px; font-size: 1rem; }
  .n-boardl:empty { display: none; }
  /* (Empty, it must take no part in the layout: on phones its "trayr" spot
     doesn't exist and would add a hidden extra column that pushes the board off-centre) */
  .n-trayr:empty { display: none; }
  /* Two-step note ("Rotate a piece" → "Then drag it onto the grid"): each
     step glows in turn, until the player has done it */
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .nobr { white-space: nowrap; }     /* keeps e.g. "rotate it. ➤" together when a step wraps */
  .step { margin: 0; }
  /* A key on the keyboard, e.g. R */
  .note kbd {
    font-family: var(--font-text); font-weight: 700; font-size: 0.85em;
    padding: 1px 6px; border-radius: 5px; border: 1px solid var(--color-cell-border);
    background: var(--color-bg); color: var(--color-text);
  }
  .n-below  { grid-area: below; justify-self: center; text-align: center; max-width: 720px; }
  .arrow { display: inline-block; color: var(--color-accent); font-size: 1.6rem; margin-left: 6px; vertical-align: -2px; }
  .big-note { font-size: 1.4rem; font-weight: 700; line-height: 1.3; color: var(--color-accent); border-left: 4px solid var(--color-accent); padding-left: 14px; }
  .hint { font-size: 1rem; line-height: 1.5; color: var(--color-text-dim); margin-top: 6px; }
  .solved-note { font-size: 1.05rem; font-weight: 600; line-height: 1.45; color: var(--color-valid); margin-top: 10px; }
  .dont { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; margin-top: 8px; }
  .dont figure { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0; }
  .dont figcaption { font-size: 0.9rem; color: var(--color-text-dim); }
  .play .hint-caption { display: none; }   /* not used in the tutorial */

  /* [COLORS] A note that glows until the player does what it says
     ("Drag these pieces…" fades once a piece is dragged, etc.) */
  .callout { border-radius: 12px; padding: 8px 12px; transition: background 0.7s, box-shadow 0.7s; }
  .callout.lit {
    background: rgba(217, 154, 78, 0.16);
    box-shadow: 0 0 0 2px rgba(217, 154, 78, 0.7), 0 0 20px rgba(217, 154, 78, 0.35);
  }
  /* The most important message (make every row and column even) glows harder */
  .callout.strong.lit {
    background: rgba(217, 154, 78, 0.24);
    box-shadow: 0 0 0 3px rgba(240, 170, 90, 0.95), 0 0 30px rgba(240, 170, 90, 0.6);
  }
  .big-note.callout { padding: 10px 14px; }
  /* Things that fade in later (the final slide's Hint button). They keep
     their space while hidden, so nothing moves when they appear. */
  .reveal-later { opacity: 0; visibility: hidden; transition: opacity 0.8s, visibility 0.8s; }
  .reveal-later.shown { opacity: 1; visibility: visible; }
  /* Slide 3's heading: glows just long enough to read, then fades */
  .dont-slide h2.callout { display: inline-block; padding: 6px 16px; }

  /* Pop-in animation used by the pictures */
  @keyframes popIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw  { to { stroke-dashoffset: 0; } }
  .anim-in { animation: popIn 0.45s cubic-bezier(.3,1.4,.5,1) both; }
  .draw { stroke-dasharray: 100; stroke-dashoffset: 100; }
  .anim-in .draw { animation: draw 0.6s 0.2s ease forwards; }   /* traces itself once its picture pops in */

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ── Slide 3: empty spaces (slide 2's solved board, dimmed, with a note under it) ── */
  .play.recap .n-trayl, .play.recap .tray, .play.recap .status { display: none; }
  .play.recap #board-outer > * { transition: opacity 1s, filter 1s; }
  /* [COLORS] how much the board fades and darkens (the glowing squares stay bright) */
  #board-outer.dim > :not(#tut-overlay) { opacity: 0.45; filter: brightness(0.7); }
  .sq-ring { fill: rgba(240, 170, 90, 0.15); stroke: var(--color-accent); stroke-width: 3;
             filter: drop-shadow(0 0 6px rgba(240, 170, 90, 0.85)); opacity: 0; transition: opacity 0.5s; }
  .sq-ring.on { opacity: 1; }
  /* The note: always gently highlighted; glows harder while its lines appear */
  .recap-card {
    max-width: 600px; margin-top: 10px; padding: 14px 18px; text-align: left;
    border: 2px solid rgba(217, 154, 78, 0.55); border-radius: 14px; background: rgba(217, 154, 78, 0.08);
    opacity: 0; transition: opacity 0.6s, box-shadow 0.7s, background 0.7s;
  }
  .recap-card.shown { opacity: 1; }
  .recap-card b { color: var(--color-accent); font-weight: 700; }
  /* Each line keeps its space while hidden, so nothing moves when it appears */
  .recap-item { display: flex; align-items: center; gap: 14px; margin: 0 0 10px;
                opacity: 0; transform: translateY(6px); transition: opacity 0.6s, transform 0.6s; }
  .recap-item.shown { opacity: 1; transform: none; }
  .recap-item svg { flex: 0 0 auto; }
  .recap-item p, p.recap-item { font-size: 1.05rem; line-height: 1.45; color: var(--color-text); margin: 0; }
  .recap-tip { display: block; margin: 4px 0 0; padding-top: 10px; border-top: 1px solid var(--color-cell-border); }
  @media (max-width: 760px) {
    .play.recap { --tut-board: min(360px, 38vh, 86vw); }   /* [POSITIONING] a bit smaller, so the note fits under it */
    .recap-card { margin-top: 6px; padding: 10px 12px; }
    .recap-item { gap: 10px; margin-bottom: 8px; }
    .recap-item svg { width: 34px; height: 34px; }
    .recap-item p, p.recap-item { font-size: 1rem; }
  }

  /* ── Final slide: the Hint button and the spotlight it opens ── */
  .hint-btn {
    display: block; margin-top: 14px; height: 44px; padding: 0 22px; border: none; border-radius: 12px;
    font-family: var(--font-display); font-size: 1.3rem; letter-spacing: 0.04em; cursor: pointer;
    background: var(--color-accent); color: #2a211b;
  }
  .hint-btn.lit { animation: hintGlow 1.2s ease-in-out infinite alternate; }
  @keyframes hintGlow { from { box-shadow: 0 0 0 3px rgba(240,170,90,0.5), 0 0 10px rgba(240,170,90,0.35); }
                        to   { box-shadow: 0 0 0 5px rgba(240,170,90,0.9), 0 0 28px rgba(240,170,90,0.7); } }
  @media (max-width: 760px) { .hint-btn { margin-left: auto; margin-right: auto; } }
  .spot { position: fixed; inset: 0; z-index: 90; animation: fadeIn 0.4s ease both; }
  .spot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot-ring { fill: none; stroke: var(--color-accent); stroke-width: 3; filter: drop-shadow(0 0 8px rgba(240,170,90,0.9)); }
  .spot-card {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: min(520px, calc(100vw - 32px)); padding: 16px 18px;
    background: var(--color-panel); border: 2px solid var(--color-accent); border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
  }
  .spot-card p { font-size: 1.1rem; line-height: 1.5; color: var(--color-text); margin-bottom: 12px; }
  .ok-btn {
    display: block; width: 100%; height: 42px; border: none; border-radius: 10px;
    font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.04em;
    background: var(--color-cell-border); color: var(--color-text-dim); cursor: default;
    transition: background 0.3s, color 0.3s, box-shadow 0.3s;
  }
  .ok-btn.ready { background: var(--color-next-ready); color: #fff; cursor: pointer; box-shadow: 0 0 0 4px rgba(111, 174, 90, 0.25); }

  /* ── "Don't place a piece over" slide ── */
  .dont-slide { max-width: 820px; margin: 0 auto; text-align: center; padding-top: 10px; }
  .dont-slide h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 400; color: var(--color-accent); margin-bottom: 18px; }
  .dont-slide .dont { display: grid; grid-template-columns: repeat(2, auto); justify-content: center; gap: 18px 28px; }   /* 2 × 2 */
  .dont-slide figure {
    padding: 14px 16px 10px; border-radius: 14px;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .dont-slide figure.active {     /* [COLORS] the square behind the picture that's animating */
    background: rgba(217, 154, 78, 0.14);
    box-shadow: 0 0 0 2px rgba(217, 154, 78, 0.6);
  }
  .dont-slide figcaption { font-size: 1rem; color: var(--color-text); margin-top: 6px; }
  .mover { transition: transform 0.7s cubic-bezier(.3,.9,.4,1), opacity 0.3s; }
  .rb-nomark { transition: opacity 0.25s, transform 0.3s cubic-bezier(.3,1.5,.5,1); transform-box: fill-box; transform-origin: center; }
  .rb-nomark.hide { opacity: 0; transform: scale(0.3); }
  /* Phones: the 2 × 2 pictures shrink to fit the screen instead of running off its side */
  @media (max-width: 520px) {
    .dont-slide .dont { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
    .dont-slide figure { padding: 10px 6px 8px; min-width: 0; }
    .dont-slide figure svg { width: 100%; height: auto; }
  }

  /* ── Final slide: counting the blocks in each row and column ── */
  #tut-overlay { position: absolute; left: var(--board-pad); top: var(--board-pad); overflow: visible; pointer-events: none; z-index: 7; }
  .row-glow { fill: var(--color-valid); opacity: 0; transition: opacity 0.12s; }
  .row-glow.on { opacity: 0.6; }
  .count { font-family: var(--font-text); font-weight: 700; font-size: 18px; fill: var(--color-valid);
           transform-box: fill-box; transform-origin: center; animation: popIn 0.4s cubic-bezier(.3,1.6,.5,1) both; }

  @media (max-width: 760px) {
    .play {
      grid-template-columns: 1fr;
      grid-template-areas: "trayl" "tray" "stat" "board" "boardr" "boardl" "below";
      justify-items: center;
    }
    .n-trayl, .n-boardr, .n-boardl { justify-self: center; text-align: center; max-width: none; }
    .arrow { transform: rotate(90deg); }
    .big-note { border-left: none; padding-left: 0; font-size: 1.2rem; }
    /* [POSITIONING] Phones: tighter spacing so more fits on the screen */
    .play { row-gap: 4px; }
    .steps { gap: 2px; }
    .tut-head { padding: 8px 56px 4px; }
    .tut-head h1 { font-size: 1.6rem; }
    .dots { margin-top: 6px; }
    .close-x { top: 8px; width: 36px; height: 36px; font-size: 1.15rem; }
    .tut-body { padding-top: 2px; padding-bottom: 6px; }
    .tut-foot { padding: 6px 14px 10px; }
    .foot-btn { height: 44px; min-width: 116px; font-size: 1.25rem; }
  }

  /* ── Footer: Back, Next/Finish ── */
  .tut-foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 16px; }
  .foot-btn {
    height: 50px; min-width: 130px; padding: 0 22px; border: none; border-radius: 14px;
    font-family: var(--font-display); font-size: 1.4rem; letter-spacing: 0.04em; cursor: pointer;
    background: var(--color-cell-border); color: var(--color-text-dim);
    transition: background 0.2s, color 0.2s, transform 0.1s, box-shadow 0.2s;
  }
  .foot-btn.back { min-width: 0; background: transparent; }
  .foot-btn.back:hover { color: var(--color-text); }
  .foot-btn.next[aria-disabled="true"] { cursor: default; }
  .foot-btn.next.ready { background: var(--color-next-ready); color: #fff; box-shadow: 0 0 0 4px rgba(111, 174, 90, 0.25), 0 4px 0 rgba(0,0,0,0.35); }
  .foot-btn.next.ready:hover { filter: brightness(1.08); transform: translateY(-1px); }
  /* ── Large text (the button at the top left) ──
     Only reading text grows; titles, buttons and the board stay the same. */
  html.large-text .note { font-size: 1.8rem; }
  html.large-text .n-trayl { max-width: 460px; }
  html.large-text .n-boardr { max-width: 420px; }
  html.large-text .n-boardl { font-size: 1.65rem; max-width: 400px; }
  html.large-text .big-note { font-size: 2.15rem; }
  html.large-text .hint { font-size: 1.65rem; }
  html.large-text .solved-note { font-size: 1.75rem; }
  html.large-text .recap-item p, html.large-text p.recap-item { font-size: 1.7rem; }
  html.large-text .spot-card p { font-size: 1.7rem; }
  html.large-text .hint-btn { font-size: 1.6rem; height: 52px; }
  html.large-text .intro li { font-size: 1.85rem; }
  html.large-text .intro p { font-size: 1.75rem; }
  html.large-text .dont-slide figcaption { font-size: 1.65rem; }
  html.large-text .status { font-size: 1.75rem; --status-line: 2.25rem; }
  .one-line { white-space: nowrap; }   /* laptops: keep this note on one line */
  @media (max-width: 600px) {
    .one-line { white-space: normal; }   /* phones: wrap so it never runs off the screen */
    .text-size-btn { top: 9px; height: 34px; padding: 0 10px; font-size: 0.9rem; }
    html.large-text .spot-card p { font-size: 1.4rem; }
    .text-size-btn.is-large-label { font-size: 0.95rem; }
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tut">
  <header class="tut-head">
    <!-- Large text / Standard text (styled in rules.css; shared with the rules popup) -->
    <button type="button" class="text-size-btn" id="text-size-btn"></button>
    <h1>Tutorial</h1>
    <div class="dots" id="dots"></div>
    <button class="close-x" id="close-x" aria-label="Close tutorial" title="Close">&#10005;</button>
  </header>

  <main class="tut-body">
    <!-- Slide 1 -->
    <section class="intro" id="intro"></section>

    <!-- Slide 3: "Don't place a piece over…" (animated pictures) -->
    <section class="dont-slide" id="dont-slide" hidden>
      <h2>Don&rsquo;t place a piece over:</h2>
      <div class="dont" id="dont"></div>
    </section>

    <!-- Slides 2, 4, 5: the game, with notes placed around it -->
    <section class="play" id="play" hidden>
      <div class="note n-trayl" id="n-trayl"></div>
      <div class="tray" id="tray" aria-label="Pieces to place"></div>
      <div class="note n-trayr" id="n-trayr" style="grid-area:trayr"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="board-wrap" id="board-wrap">
        <div id="board-outer">
          <div id="board"></div>
          <div id="pieces-layer"></div>
          <div id="hint-overlay"></div>
          <svg id="mark-overlay" aria-hidden="true"></svg>
          <svg id="tut-overlay" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="note n-boardr" id="n-boardr"></div>
      <div class="note n-boardl" id="n-boardl"></div>
      <div class="n-below" id="n-below"></div>
      <p class="hint-caption" id="hint-caption" hidden></p>
    </section>
  </main>

  <footer class="tut-foot">
    <button class="foot-btn back" id="back-btn">&larr; Back</button>
    <button class="foot-btn next" id="next-btn" aria-disabled="true">Next</button>
  </footer>
</div>

<!-- The final slide's hint: darkens the page except the permanent empty
     spaces, with an explanation (drawn by showHint) -->
<div class="spot" id="spot" hidden role="dialog" aria-label="Hint">
  <svg id="spot-svg" aria-hidden="true"></svg>
  <div class="spot-card" id="spot-card">
    <p>Every row and every column in this grid is even (6 squares long), so each one needs an even number of empty spaces. Before continuing, visualize where else empty spaces can go, and then try to fit the pieces to account for that.</p>
    <button class="ok-btn ready" id="spot-ok">Got it</button>
  </div>
</div>

<script src="shapes.js"></script>
<script src="game.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   WORDING HELPERS
═══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const TOUCH = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

/* ═══════════════════════════════════════════════════════════════════
   PIECES AND PUZZLES
   Fixed pieces are written with their real board squares and converted
   to the game's {cells, row, col} form. Each puzzle was checked with
   solver.js: slides 2 and 3 have one way to fit the pieces; slide 4 has
   6 ways but only one with every row and column even.
═══════════════════════════════════════════════════════════════════ */
const COLOR = { I:'#5f9e8f', F:'#a8714a', W:'#a44e6b', N:'#7d6aa8', P:'#b8923f', Y:'#8c6a4a', U:'#a85c4a', V:'#8a9c5a' };
function fixedPiece(name, absCells, color){
  const r0 = Math.min(...absCells.map(c=>c[0])), c0 = Math.min(...absCells.map(c=>c[1]));
  return { name, color: color || COLOR[name], row: r0, col: c0, cells: absCells.map(([r,c])=>[r-r0, c-c0]) };
}
const trayPiece = (name, cells) => ({ name, color: COLOR[name], cells });

/* ═══════════════════════════════════════════════════════════════════
   LITTLE PICTURES
═══════════════════════════════════════════════════════════════════ */
// The 12 pentominoes (slide 1)
const TWELVE = [
  ['#9c7350', [[0,1],[0,2],[1,0],[1,1],[2,1]]], ['#5f9e8f', [[0,0],[1,0],[2,0],[3,0],[4,0]]],
  ['#c9a877', [[0,0],[1,0],[2,0],[3,0],[3,1]]], ['#7d6aa8', [[0,1],[1,1],[2,0],[2,1],[3,0]]],
  ['#b8923f', [[0,0],[0,1],[1,0],[1,1],[2,0]]], ['#6b8a9c', [[0,0],[0,1],[0,2],[1,1],[2,1]]],
  ['#a85c4a', [[0,0],[0,2],[1,0],[1,1],[1,2]]], ['#8a9c5a', [[0,0],[1,0],[2,0],[2,1],[2,2]]],
  ['#a44e6b', [[0,0],[1,0],[1,1],[2,1],[2,2]]], ['#4f8a7a', [[0,1],[1,0],[1,1],[1,2],[2,1]]],
  ['#8c6a4a', [[0,1],[1,0],[1,1],[2,1],[3,1]]], ['#8a5a7a', [[0,0],[0,1],[1,1],[2,1],[2,2]]],
];
function pieceSvg(cells, color, cell){
  const gap = 2, b = bounds(cells);
  const w = b.cols*cell + (b.cols-1)*gap, h = b.rows*cell + (b.rows-1)*gap;
  const svg = svgEl('svg', { width:w+4, height:h+4, viewBox:`-2 -2 ${w+4} ${h+4}`, 'aria-hidden':'true' });
  drawPiece(svg, cells, color, 0, 0, cell, gap);
  return svg;
}

// "Don't place a piece over…" pictures: a small 3×4 board, a piece in the
// wrong place, and the red not-allowed sign. With animated = true the
// piece starts off to one side (invisible) and the sign starts hidden;
// playDont() then slides the piece in and pops the sign up.
function dontPicture(kind, animated){
  const cell = 26, gap = 2, pad = 6, rows = 3, cols = 4, step = cell + gap, m = 24;
  const W = cols*cell + (cols-1)*gap + 2*pad, H = rows*cell + (rows-1)*gap + 2*pad;
  const svg = svgEl('svg', { width: W + 2*m, height: H + 2*m, viewBox:`${-m} ${-m} ${W + 2*m} ${H + 2*m}`, 'aria-hidden':'true' });
  svgEl('rect', { x:0, y:0, width:W, height:H, rx:6, class:'rb-frame' }, svg);
  const xAt = c => pad + c*step, yAt = r => pad + r*step;
  const fixedGapAt = [1,1];
  for(let r=0; r<rows; r++) for(let c=0; c<cols; c++){
    if(kind === 'gap' && r === fixedGapAt[0] && c === fixedGapAt[1]){
      svgEl('rect', { x:xAt(c)+0.5, y:yAt(r)+0.5, width:cell-1, height:cell-1, rx:2, class:'rb-gap' }, svg);
    } else svgEl('rect', { x:xAt(c), y:yAt(r), width:cell, height:cell, rx:2, class:'rb-cell' }, svg);
  }
  const X = (r,c)=>{ const k = cell*0.28, cx = xAt(c)+cell/2, cy = yAt(r)+cell/2;
    svgEl('path', { d:`M${cx-k},${cy-k} L${cx+k},${cy+k} M${cx+k},${cy-k} L${cx-k},${cy+k}`, class:'rb-gap-x' }, svg); };
  // The piece that moves into the wrong spot lives in a "mover" group, so
  // it can start shifted by (dx, dy) and slide into place
  const mover = svgEl('g', { class:'mover' });
  let dx = 0, dy = 0;
  if(kind === 'dotted'){
    svgEl('path', { d: buildOutlinePath([[0,0],[0,1],[1,0],[1,1]], cell, gap), class:'rb-dotted', transform:`translate(${pad},${pad})` }, svg);
    svg.appendChild(mover);
    drawPiece(mover, [[0,0],[0,1],[0,2]], COLOR.I, xAt(1), yAt(1), cell, gap);
    dx = 2*step;                                          // slides in from the right
  } else if(kind === 'edge'){
    svg.appendChild(mover);
    drawPiece(mover, [[0,1],[1,0],[1,1]], COLOR.P, xAt(-1), yAt(1), cell, gap);
    dx = 2*step;                                          // slides left, off the left edge
  } else if(kind === 'piece'){
    drawPiece(svg, [[0,0],[0,1],[0,2]], COLOR.N, xAt(0), yAt(1), cell, gap);
    svg.appendChild(mover);
    drawPiece(mover, [[0,0],[1,0],[2,0]], COLOR.U, xAt(1), yAt(0), cell, gap).setAttribute('opacity', '0.85');
    dy = -2*step;                                         // drops in from above
  } else if(kind === 'gap'){
    X(1,1);                                               // the permanent empty space, under the piece
    svg.appendChild(mover);
    // see-through, so you can tell it's sitting on the X
    drawPiece(mover, [[0,0],[0,1],[0,2]], COLOR.V, xAt(0), yAt(1), cell, gap).setAttribute('opacity', '0.55');
    dy = 2*step;                                          // rises from below
  }
  // The sign covers the whole picture, so it never seems to point at one
  // square (e.g. crossing out the X of the permanent empty space)
  const sign = drawNoMark(svg, W/2, H/2, Math.max(W, H)/2);
  if(animated){
    mover.style.transform = `translate(${dx}px, ${dy}px)`;
    mover.style.opacity = '0';
    sign.classList.add('hide');
  }
  return svg;
}

// One board square as a picture: an empty space, or (withX) a permanent one
function squareSvg(withX, size){
  size = size || 44;
  const svg = svgEl('svg', { width:size, height:size, viewBox:'0 0 44 44', 'aria-hidden':'true' });
  svgEl('rect', { x:2.5, y:2.5, width:39, height:39, rx:5, class:'rb-gap' }, svg);
  if(withX) svgEl('path', { d:'M13,13 L31,31 M31,13 L13,31', class:'rb-gap-x' }, svg);
  return svg;
}

// Play one picture's animation: slide the piece in, then pop up the sign
function playDont(svg){
  const mover = svg.querySelector('.mover');
  mover.style.transform = 'translate(0px, 0px)';
  mover.style.opacity = '1';
  setTimeout(()=>svg.querySelector('.rb-nomark').classList.remove('hide'), 650);
}

/* ═══════════════════════════════════════════════════════════════════
   [CONTENT] THE SLIDES
═══════════════════════════════════════════════════════════════════ */
/* Options for 'play' slides:
     steps             a note beside the pieces with steps done in order, e.g.
                       "Rotate a piece" then "Drag it onto the grid": the first
                       step not yet done glows. Each is { html, until } with
                       until = 'rotate' | 'reflect' | 'place'
     boardRight        a note beside the board (no glow)
     bigNoteGlow       the orange "Make sure…" note glows extra-strongly for a
                       few seconds as soon as the slide opens
     hintWhenInside    piece names: once ALL of them are placed inside the
                       dotted outline (a wrong guess), a glowing Hint button
                       appears under the orange note (see showHint)
     countAnimation    on solving, count each row and column; Next waits for it
     solvedNote        a line added beside the board once it's solved      */
const SLIDES = [
  { kind: 'intro' },
  { kind: 'play', puzzle: PUZZLE_2,
    steps: [
      { html: (TOUCH ? 'Tap a piece to ' : 'Click a piece or press <kbd>R</kbd> to ')
              + '<span class="nobr"><b>rotate</b> it.<span class="arrow">&#10148;</span></span>', until: 'rotate' },
      { html: 'Then drag it onto the grid.', until: 'place' },
    ] },
  // Slide 2's solved board again, dimmed, with a note about empty spaces
  { kind: 'recap', puzzle: PUZZLE_2, tiling: PUZZLE_2_SOLVED },
  { kind: 'dont' },
  { kind: 'play', puzzle: PUZZLE_3,
    steps: [
      { html: (TOUCH ? 'Tap a piece twice to ' : 'Double-click a piece or press <kbd>E</kbd> to ')
              + '<span class="nobr"><b>reflect</b> it.<span class="arrow">&#10148;</span></span>', until: 'reflect' },
      { html: 'Then drag it onto the grid.', until: 'place' },
    ],
    boardRight: 'You can also rotate and reflect pieces once they&rsquo;re on the grid.' },
  { kind: 'play', puzzle: PUZZLE_4,
    // The Hint button sits under the orange note, hidden until it's needed
    boardRight: `<div class="big-note" id="big-note">Make sure there is an even number of blocks in each row AND column.</div>
      <button type="button" class="hint-btn reveal-later" id="hint-btn">Hint</button>`,
    bigNoteGlow: true,
    // Every way to fit these pieces with W and P inside the outline fails
    // (checked with solver.js), so that's when the hint is offered
    hintWhenInside: ['W', 'P'],
    countAnimation: true,
    solvedNote: 'Every row and column is even. You’re ready to play!' },
];
const DONT_ITEMS = [['dotted','a dotted line'], ['edge','the edge of the grid'], ['piece','another piece'], ['gap','a permanent empty space']];

function renderIntro(){
  const box = $('intro');
  box.innerHTML = `
    <h2>Game objectives</h2>
    <ol>
      <li>Fit all of the pieces onto the grid.</li>
      <li>Every row and column contains an even (parity) number of blocks.</li>
    </ol>
    <p class="fun">Fun fact: these pieces are called <b style="color:var(--color-accent);font-weight:400">pentominoes</b> because they&rsquo;re made of five blocks. Dominoes are made of two, triominoes of three, and tetrominoes of four (the origin of the name Tetris).</p>
    <div class="twelve" id="twelve" aria-label="The 12 pentominoes"></div>`;
  TWELVE.forEach(([color, cells])=>$('twelve').appendChild(pieceSvg(cells, color, 15)));
}

/* ═══════════════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════════════ */
let current = 0;
const SLIDE_KEY = 'pb_tutorialSlide';             // sessionStorage: the slide to come back to after a refresh
const done = SLIDES.map(s=>s.kind === 'intro');   // slide 1 has no task
const solvedView = {};                            // slide index → what the solved board looked like

function renderDots(){
  const dots = $('dots');
  dots.innerHTML = '';
  SLIDES.forEach((s,i)=>{
    const d = document.createElement('span');
    d.className = 'dot' + (i === current ? ' now' : done[i] ? ' done' : '');
    d.setAttribute('aria-label', `Step ${i+1} of ${SLIDES.length}` + (i === current ? ' (current)' : ''));
    dots.appendChild(d);
  });
}

function updateNext(){
  const last = current === SLIDES.length - 1;
  const btn = $('next-btn');
  btn.textContent = last ? 'Finish ✓' : 'Next →';
  btn.classList.toggle('ready', done[current]);
  btn.setAttribute('aria-disabled', done[current] ? 'false' : 'true');
  $('back-btn').style.visibility = current === 0 ? 'hidden' : 'visible';
}

/* Animations are timed with setTimeout. Each slide change bumps animRun,
   and every timed step checks it first, so leaving a slide mid-animation
   stops that animation. */
let animRun = 0;
function later(ms, fn){ const run = animRun; setTimeout(()=>{ if(run === animRun) fn(); }, ms); }

function markDone(){ done[current] = true; renderDots(); updateNext(); }

function showSlide(i){
  current = i;
  animRun++;
  const s = SLIDES[i];
  $('intro').hidden = s.kind !== 'intro';
  $('dont-slide').hidden = s.kind !== 'dont';
  const onBoard = s.kind === 'play' || s.kind === 'recap';   // slides that show the game's board
  $('play').hidden = !onBoard;
  $('play').classList.toggle('recap', s.kind === 'recap');
  $('board-outer').classList.remove('dim');
  hideHint();
  $('tut-overlay').innerHTML = '';
  try { sessionStorage.setItem(SLIDE_KEY, String(i)); } catch(e){}   // so a refresh comes back here
  if(s.kind === 'intro') renderIntro();
  if(s.kind === 'dont') showDontSlide();
  // Every slide starts fresh, even when you come Back to it (Next stays
  // green if you've already finished it once)
  if(onBoard){
    bigNoteGlowed = false;
    hintOffered = false;
    renderSteps(s);
    $('n-trayr').innerHTML = '';
    $('n-boardr').innerHTML = s.boardRight || '';
    $('n-boardl').innerHTML = '';
    $('n-below').innerHTML = '';
    if(s.bigNoteGlow){ $('big-note').classList.add('callout', 'strong'); later(BIG_GLOW_DELAY_MS, glowBigNote); }
    if(s.tiling) setViewTiling(s.tiling);          // (a finished board to look at, not play)
    setGameMode(s.tiling ? 'view' : 'play');
    loadPuzzle(s.puzzle);
    lightSteps();             // (now that it's in play mode, the first step glows)
  }
  if(s.kind === 'recap') showRecap();
  renderDots();
  updateNext();
  $('play').parentElement.scrollTop = 0;
}

/* ── Step notes ("Rotate a piece" → "Then drag it onto the grid") ──
   The first step not done yet glows; doing a step (in any order) ticks it off. */
let stepDone = [];
function renderSteps(s){
  $('n-trayl').className = 'note n-trayl';
  $('n-trayl').innerHTML = s.steps
    ? `<div class="steps">${s.steps.map((st, i)=>`<p class="step callout" id="step${i}">${st.html}</p>`).join('')}</div>` : '';
  stepDone = (s.steps || []).map(()=>false);
  lightSteps();
}
function lightSteps(){
  const steps = SLIDES[current].steps || [];
  const next = gameMode === 'view' ? -1 : stepDone.indexOf(false);
  steps.forEach((st, i)=>$('step' + i).classList.toggle('lit', i === next));
}
function stepEvent(kind){
  (SLIDES[current].steps || []).forEach((st, i)=>{ if(st.until === kind) stepDone[i] = true; });
  lightSteps();
}
gameHooks.onPlace = ()=>stepEvent('place');
gameHooks.onTransform = kind=>stepEvent(kind);
gameHooks.onChange = ()=>checkHint();

/* Final slide: the orange "Make sure…" note glows strongly for a few
   seconds as soon as the slide opens. Once per visit to the slide. */
const BIG_GLOW_DELAY_MS = 300; // just after the slide appears
const BIG_GLOW_MS = 2500;      // how long the orange note glows
let bigNoteGlowed = false;
function glowBigNote(){
  if(bigNoteGlowed || gameMode === 'view') return;
  bigNoteGlowed = true;
  $('big-note').classList.add('lit');
  later(BIG_GLOW_MS, ()=>$('big-note').classList.remove('lit'));
}

/* ── Final slide: the Hint ──
   Once every piece in hintWhenInside sits inside the dotted outline (the
   wrong guess most people make), a glowing Hint button fades in under the
   orange note. It opens a spotlight: the page goes dark except the
   permanent empty spaces, with an explanation. */
let hintOffered = false;
function checkHint(){
  const s = SLIDES[current];
  if(!s.hintWhenInside || hintOffered || gameMode !== 'play' || !puzzle) return;
  const outline = new Set((puzzle.hintOutline || []).map(([r,c])=>r+','+c));
  const allInside = s.hintWhenInside.every(name=>{
    const p = placedPieces.find(q=>q.name === name && !q.locked);
    return p && p.cells.every(([r,c])=>outline.has((p.row+r)+','+(p.col+c)));
  });
  if(!allInside) return;
  hintOffered = true;
  $('hint-btn').classList.add('shown', 'lit');
}
function showHint(){
  $('hint-btn').classList.remove('lit');
  $('spot').hidden = false;
  const W = innerWidth, H = innerHeight, pad = 5;
  const holes = puzzle.blocked.map(([r,c])=>boardEl.querySelector(`.board-cell[data-r="${r}"][data-c="${c}"]`))
    .filter(Boolean).map(el=>el.getBoundingClientRect());
  const box = (b, extra)=>`x="${b.left - pad}" y="${b.top - pad}" width="${b.width + 2*pad}" height="${b.height + 2*pad}" rx="8" ${extra}`;
  const svg = $('spot-svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs><mask id="spot-mask"><rect width="${W}" height="${H}" fill="white"/>`
    + holes.map(b=>`<rect ${box(b, 'fill="black"')}/>`).join('') + `</mask></defs>`
    + `<rect width="${W}" height="${H}" fill="rgba(0,0,0,0.75)" mask="url(#spot-mask)"/>`
    + holes.map(b=>`<rect ${box(b, 'class="spot-ring"')}/>`).join('');
  // The explanation goes on whichever side of the squares has more room,
  // never over them (if it's too tall for that room, it scrolls inside)
  const card = $('spot-card'), gapPx = 16;
  const top = holes.length ? Math.min(...holes.map(b=>b.top)) - pad : H/2;
  const bottom = holes.length ? Math.max(...holes.map(b=>b.bottom)) + pad : H/2;
  const below = H - bottom > top;      // more room under the squares than above them?
  card.style.top    = below ? (bottom + gapPx) + 'px' : '';
  card.style.bottom = below ? '' : (H - top + gapPx) + 'px';
  card.style.maxHeight = ((below ? H - bottom : top) - 2*gapPx) + 'px';
  card.style.overflowY = 'auto';
  card.scrollTop = 0;                               // start at the first sentence
  $('spot-ok').focus({ preventScroll: true });
}
function hideHint(){ $('spot').hidden = true; }
// (The Hint button is created with its slide, so listen on the page)
document.addEventListener('click', e=>{ if(e.target.closest('#hint-btn')) showHint(); });
$('spot-ok').onclick = hideHint;
$('spot').onclick = e=>{ if(!$('spot-card').contains(e.target)) hideHint(); };   // tapping the dark area closes it too

// A tutorial puzzle got solved: freeze it and darken the empty spaces;
// then show the empty-space note, run the counting animation, or light up Next
gameHooks.onSolved = ()=>{
  const covered = new Set();
  placedPieces.forEach(p=>p.cells.forEach(([r,c])=>covered.add((p.row+r)+','+(p.col+c))));
  const empty = [];
  for(let r=0; r<puzzle.rows; r++) for(let c=0; c<puzzle.cols; c++)
    if(!covered.has(r+','+c) && !isBlocked(r,c) && inBounds(r,c)) empty.push([r,c]);
  const s = SLIDES[current];
  // On the counting slide the column counts sit above the board, so no "Solved!" there
  solvedView[current] = { pieces: placedPieces.map(p=>({ name:p.name, color:p.color, cells:p.cells, row:p.row, col:p.col })),
                          oddRows: [], oddCols: [], empty, rings: false,
                          status: s.countAnimation ? '' : 'Solved!', good: true };
  setViewTiling(solvedView[current]);
  setGameMode('view');
  lightSteps();                                         // (no step glows once it's solved)
  if($('big-note')) $('big-note').classList.remove('lit');
  hideHint();
  // (On the counting slide, the solved note waits until the counting is done)
  if(s.solvedNote && !s.countAnimation) $('n-boardr').insertAdjacentHTML('beforeend', `<p class="solved-note">${s.solvedNote}</p>`);
  if(s.countAnimation) drawCounts(true);
  else markDone();
};

/* ── Slide 3: empty spaces ──
   Slide 2's solved board is back. It dims, then a highlighted note appears
   under it one line at a time, and the squares each line is about glow on
   the board: first the empty spaces, then the permanent ones, then both
   together (they count the same). Then Next lights up. */
const RECAP_DIM_MS = 400;      // the board starts to dim
const RECAP_LINE_MS = [1000, 2600, 4200];   // when each line of the note appears
function showRecap(){
  const card = document.createElement('div');
  card.className = 'recap-card callout';
  card.innerHTML = `
    <div class="recap-item"><p>The squares left over are <b>empty spaces</b>. They turn dark once all of the pieces are on the grid.</p></div>
    <div class="recap-item"><p><b>Permanent empty spaces</b> are marked with a red X. They can&rsquo;t be moved, and pieces can&rsquo;t be placed on them.</p></div>
    <p class="recap-item recap-tip">When you check rows and columns for an even number of empty spaces (often a good strategy), count both kinds exactly the same. The only difference is that you find empty spaces, and permanent ones come with the puzzle.</p>`;
  const [one, two, tip] = card.querySelectorAll('.recap-item');
  one.prepend(squareSvg(false));
  two.prepend(squareSvg(true));
  $('n-below').appendChild(card);
  const emptyRings = squareRings(SLIDES[current].tiling.empty), permRings = squareRings(puzzle.blocked);
  const glow = (rings, on)=>rings.forEach(el=>el.classList.toggle('on', on));
  later(RECAP_DIM_MS, ()=>$('board-outer').classList.add('dim'));
  later(RECAP_LINE_MS[0], ()=>{ card.classList.add('shown', 'lit'); one.classList.add('shown'); glow(emptyRings, true); });
  later(RECAP_LINE_MS[1], ()=>{ two.classList.add('shown'); glow(emptyRings, false); glow(permRings, true); });
  later(RECAP_LINE_MS[2], ()=>{ tip.classList.add('shown'); glow(emptyRings, true); card.classList.remove('lit'); markDone(); });
}
// A glowing outline around each of these board squares (hidden until .on)
function squareRings(cells){
  const svg = $('tut-overlay');
  svg.setAttribute('width', puzzle.cols*CELL + (puzzle.cols-1)*GAP);
  svg.setAttribute('height', puzzle.rows*CELL + (puzzle.rows-1)*GAP);
  return cells.map(([r,c])=>svgEl('rect', { x: pxPos(c) - 2, y: pxPos(r) - 2, width: CELL + 4, height: CELL + 4, rx: 6, class:'sq-ring' }, svg));
}

/* ── "Don't place a piece over" slide ──
   Plays each picture's animation in turn with a highlighted square behind
   it; after the last one, Next lights up (straight away if you've been
   here before, but the animations still replay). */
function showDontSlide(){
  const box = $('dont');
  box.innerHTML = '';
  const figs = DONT_ITEMS.map(([kind, label])=>{
    const f = document.createElement('figure');
    f.appendChild(dontPicture(kind, true));
    const c = document.createElement('figcaption'); c.textContent = label; f.appendChild(c);
    box.appendChild(f);
    return f;
  });
  // The heading glows just long enough to read, fades (0.7 s, see .callout),
  // and only then do the pictures start animating
  const heading = $('dont-slide').querySelector('h2');
  heading.className = 'callout lit';
  const READ = 1600;            // ms the heading stays lit
  const START = READ + 300;     // first animation starts as the heading's glow fades
  later(READ, ()=>heading.classList.remove('lit'));
  const STEP = 2000;   // ms per picture (time to read each one)
  figs.forEach((f, i)=>{
    later(START + i*STEP,        ()=>{ f.classList.add('active'); playDont(f.querySelector('svg')); });
    later(START + i*STEP + 1800, ()=>f.classList.remove('active'));
  });
  later(START + figs.length*STEP, markDone);
}

/* ── Final slide: count the blocks in every row, then every column ──
   Each line's blocks flash green one line at a time; its count appears
   (right of rows, above columns) and stays. Then Finish lights up. With
   animate = false, just draw all the counts. */
function drawCounts(animate){
  const svg = $('tut-overlay');
  svg.innerHTML = '';
  const w = puzzle.cols*CELL + (puzzle.cols-1)*GAP, h = puzzle.rows*CELL + (puzzle.rows-1)*GAP;
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  const pad = cssPx('--board-pad');
  const filled = new Set();
  solvedView[current].pieces.forEach(p=>p.cells.forEach(([r,c])=>filled.add((p.row+r)+','+(p.col+c))));
  const lines = [];
  for(let r=0; r<puzzle.rows; r++){
    const cells = []; for(let c=0; c<puzzle.cols; c++) if(filled.has(r+','+c)) cells.push([r,c]);
    lines.push({ cells, x: w + pad + 14, y: pxPos(r) + CELL/2 });   // count to the right of the row
  }
  for(let c=0; c<puzzle.cols; c++){
    const cells = []; for(let r=0; r<puzzle.rows; r++) if(filled.has(r+','+c)) cells.push([r,c]);
    lines.push({ cells, x: pxPos(c) + CELL/2, y: -pad - 14 });     // count above the column
  }
  const addCount = line=>{
    const t = svgEl('text', { x: line.x, y: line.y, 'text-anchor':'middle', 'dominant-baseline':'central', class:'count' }, svg);
    t.textContent = line.cells.length;
  };
  if(!animate){ lines.forEach(addCount); return; }
  const STEP = 650;    // ms per row/column: slow enough to follow each one
  const PAUSE = 500;   // extra pause between the rows and the columns
  const at = i => 400 + i*STEP + (i >= puzzle.rows ? PAUSE : 0);
  lines.forEach((line, i)=>{
    later(at(i), ()=>{
      const glows = line.cells.map(([r,c])=>svgEl('rect', { x: pxPos(c), y: pxPos(r), width: CELL, height: CELL, rx: 4, class:'row-glow' }, svg));
      requestAnimationFrame(()=>glows.forEach(g=>g.classList.add('on')));   // fade in
      addCount(line);                                                        // the number pops in and stays
      later(STEP * 0.8, ()=>glows.forEach(g=>g.classList.remove('on')));   // fade out
      later(STEP * 0.8 + 200, ()=>glows.forEach(g=>g.remove()));
    });
  });
  later(at(lines.length) + 150, ()=>{
    const note = SLIDES[current].solvedNote;
    if(note) $('n-boardr').insertAdjacentHTML('beforeend', `<p class="solved-note">${note}</p>`);
    markDone();
  });
}

function closeTutorial(finished){
  try { sessionStorage.removeItem(SLIDE_KEY); } catch(e){}   // next time starts from slide 1
  // Inside the popup on a puzzle page: ask that page to close it
  if(window.parent !== window) window.parent.postMessage({ type:'pb-tutorial-close', finished: !!finished }, '*');
  else {
    // Opened as its own page (the splash screen's Tutorial button): remember
    // it's been seen, so it won't pop up again on the first puzzle, then go back
    try { localStorage.setItem('pb_tutorialSeen', '1'); } catch(e){}
    location.href = 'index.html';
  }
}

/* ── Large text button (top left) ──
   Same setting as the rules popup's button ('pb_largeText' in localStorage). */
function isLargeText(){ try { return localStorage.getItem('pb_largeText') === '1'; } catch(e){ return false; } }
function showLargeText(){
  const on = isLargeText(), btn = $('text-size-btn');
  document.documentElement.classList.toggle('large-text', on);
  btn.textContent = on ? 'Standard text' : 'Large text';
  btn.classList.toggle('is-large-label', !on);      // "Large text" shows in bold
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
}
$('text-size-btn').onclick = ()=>{
  try { localStorage.setItem('pb_largeText', isLargeText() ? '0' : '1'); } catch(e){}
  showLargeText();
  if(!$('play').hidden){
    setupBoard(); renderAll();                       // re-fit the board to the new space
    if(gameMode === 'view' && SLIDES[current].countAnimation && done[current]) drawCounts(false);   // re-place the counts
  }
};
showLargeText();

$('next-btn').onclick = ()=>{
  if(!done[current]) return;
  if(current === SLIDES.length - 1) closeTutorial(true);
  else showSlide(current + 1);
};
$('back-btn').onclick = ()=>{ if(current > 0) showSlide(current - 1); };
$('close-x').onclick = ()=>closeTutorial(false);
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(!$('spot').hidden) hideHint();      // Esc closes the hint first
  else closeTutorial(false);
});

// Start where they were if the page was refreshed mid-tutorial (the slides
// before it count as done), otherwise at slide 1
let startAt = 0;
try { startAt = parseInt(sessionStorage.getItem(SLIDE_KEY), 10) || 0; } catch(e){}
if(!(startAt > 0 && startAt < SLIDES.length)) startAt = 0;
for(let i = 0; i < startAt; i++) done[i] = true;
showSlide(startAt);
</script>
