<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
  PARITY BLOCKS: INTERACTIVE TUTORIAL
  ═══════════════════════════════════════════════════════════════════════
  Shown in a popup (an <iframe>) the first time someone opens a puzzle,
  and from "Play the tutorial" in the Rules popup. It can also be opened
  on its own: tutorial.html.

  2026-11-12 REVAMP (user: players new to puzzles don't grasp parity, so
  drill it in BEFORE rotating, reflecting or tiling). Nine slides now:
    1  Two objectives: Tiling (+ the 12 pentominoes), Solving for Parity
    2  Pick the grid (PAIR_BAD / PAIR_GOOD, two tilings of the same six
       pieces): tap the one where every row and column is even. A slow
       count follows: right → all green + a solved note; wrong → stops
       red on the first odd line ("There are 5 blocks in row 4…"), then
       the right one is counted
    3  The right grid again: turn on the highlighter, highlight every
       empty square; a glowing "Next, we'll examine this grid further."
       (Got it), then Next lights up (2026-11-13)
    3b Identical; the left text fades, then the animated sum plays
       (runExplainer: 36 squares − 30 blocks = 6 empty squares); Next
    3c Identical again; "Since this grid is 6 × 6 squares…" (OK), then
       the empty squares are counted; Next
    (so there are 11 slides; the numbers below are from before 3b / 3c)
    4  (2026-11-13: replaced) Slide 2 again with a new pair (EMPTY_BAD /
       EMPTY_GOOD), but the EMPTY squares are counted (countEmpty)
    5  The old slide 6 board: highlight all SIX empty squares (none given,
       pieces locked); once right, N and P turn and drop in by themselves
       and the empty squares are counted
    6–9 the old slides 2, 3, 4 and 7 (rotate, don't place over, reflect,
       the final puzzle). The old "meet the highlighter" slide is out of
       SLIDES (its code, showHighlighterIntro, is still here, unused).
  The old list, slides numbered as they were before the revamp:
    1  Game objectives and the 12 pentominoes   (no task: Next is ready)
    2  Rotate (click / tap, or R), then drag onto the grid: a two-step
       note, each step glowing in turn. On solving, the other text fades,
       each row then column flashes green and its count of blocks
       appears, then a "Solved!" badge (celebrate.js; no sound here)
    3  "Don't place a piece over…": three pictures animate one at a time
       (a dotted line, the edge of the grid, another piece)
    4  Reflect (double-click / tap twice, or E), then drag: same two-step
       note. On solving, the blocks are counted
    5  Meet the highlighter (shortened 2026-11-11): one message under it,
       "Use the highlighter to mark empty squares. Tap it to turn it on.";
       the empty grid (no pieces) shows from the start; once it's on, the
       message goes and the grid glows once; after the first highlight, "Tap a highlighted square again to
       clear it."; Next lights up once they clear one.
    6  Use it (the user's board, 2026-11-11): four pieces fixed and four of
       its six empty squares highlighted (those can't be cleared). It opens
       dark with a popup in two parts, one "Got it" each: "Find the empty
       spaces first." + the even rule for a 6×6 grid; then "1st: Highlight
       the two missing empty squares. 2nd: Fit the pieces onto the grid."
       After that a short reminder of both fades in beside the board and the
       highlighter glows until it's tapped (2026-11-11). The answers: (3,5) and (5,5).
       Once both are highlighted, the 1st step gets a ✓ and the squares
       left for the pieces glow twice. Pieces can be moved at any time.
       After 90 s without both, a hint (phones: a popup over the grid
       with "Got it", then a small Hint button brings it back). On
       solving, the blocks are counted.
    7  Make every row and column even (the parity puzzle). If they place
       every piece but the rows/columns aren't all even, a glowing Hint
       button appears: it darkens the page, spotlights the dotted area
       and explains. (This puzzle has no dotted squares.) On solving, the
       blocks are counted. Last button says "Finish". Phones: the "Make
       sure…" note is a popup closed with "Got it", so the slide is clean.
  Phones, on solving (user, 2026-11-06): nothing on the slide moves; the
  solved note floats just above the grid (the last slide: below it, the
  grid moving up first on small phones if needed). See planPhoneWin.
  (2026-10-27: the old empty-space slides and the red X squares were
  removed; X squares became dotted squares. Slide 5 was then added back
  in a new form at the user's request, and on 2026-11-05 replaced by the
  two highlighter slides.) The highlighter shows on slides 5–7.
  Slides 2 and 4–7 run on the game's own code
  (game.js / game.css), with some pieces fixed in place. Next turns green
  only once the slide's task (and any animation) is finished.
  Refreshing the page comes back to the same slide (sessionStorage
  'pb_tutorialSlide'; cleared when the tutorial is closed or finished).

  Top left: a "Large text" button (shared setting with the rules popup)
  that makes the reading text much bigger; it then says "Standard text".

  Words used everywhere (see HANDOFF.md):
    block          one square of a piece      piece  a pentomino
    dotted square  a square with a dotted line around it (no piece can go on it)
    empty square    (slide 5 only) a square no piece covers

  [CONTENT] All wording is in SLIDES below. "Tap" vs "Click" is chosen
  automatically (touchscreen vs mouse).
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parity Blocks: Tutorial</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<!-- Light / dark mode: first, so the page never flashes the wrong colors -->
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geo&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rules.css">
<link rel="stylesheet" href="game.css">
<style>
  :root {
    --color-next-ready: #5E8A3E;     /* [COLORS] Next / Finish once the slide is done (deep moss) */
    --color-tut-title:  #1F2330;     /* [COLORS] the "Tutorial" title (ink) */
    --glow:             43, 76, 126; /* [COLORS] glowing notes and squares (red, green, blue: indigo, the accent) */
    --tut-board:        min(360px, 40vh, 86vw);   /* [POSITIONING] board area size */
  }
  html.dark {                        /* [COLORS] dark mode (theme.js) */
    --color-next-ready: #6E9A4C;
    --color-tut-title:  #EDEAE3;
    --glow:             143, 169, 214;
  }
  body { overflow: hidden; }
  .tut {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--color-panel);
  }

  /* ── Header: title, progress dots, close X ── */
  .tut-head { position: relative; flex: 0 0 auto; padding: 14px 60px 8px; text-align: center; }
  .tut-head h1 { font-family: var(--font-display); font-size: 1.9rem; font-weight: 400; color: var(--color-tut-title); line-height: 1; }
  .dots { display: flex; justify-content: center; gap: 9px; margin-top: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--color-cell-border); transition: background 0.2s, transform 0.2s; }
  .dot.done { background: var(--color-text-dim); }
  .dot.now  { background: var(--color-accent); transform: scale(1.25); }
  .close-x {
    position: absolute; top: 12px; right: 14px;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: var(--color-soft); color: var(--color-soft-ink);
    font: 700 1.1rem/1 system-ui, sans-serif; cursor: pointer;
  }
  .close-x:hover { filter: brightness(0.94); }

  /* ── Slide area ── */
  /* (A scrolling area cuts off anything poking out past its edges, like a
     glow (user, 2026-11-06: the highlighter's glow was cut off at the top).
     So the slide area reaches --edge-room further up behind the header and
     down behind the Back / Next bar, padded by the same amount: nothing
     moves, but glows have room. The header and bar stay on top so their
     buttons still work. tests/browser/glow_clip_test.js checks every glow.) */
  /* (never sideways: the grid's invisible drawing layers are wider than
     the grid and could make an iPhone SE's slide wobble sideways) */
  .tut-body { --edge-room: 24px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
              margin: calc(-1 * var(--edge-room)) 0;
              padding: calc(4px + var(--edge-room)) 20px calc(12px + var(--edge-room)); }
  .tut-head, .tut-foot { position: relative; z-index: 2; }
  .note { font-size: 1.1rem; line-height: 1.45; color: var(--color-text); }
  .note b { color: var(--color-accent); font-weight: 400; }

  /* Slide 1 */
  .intro { max-width: 640px; margin: 0 auto; padding-top: 6px; }
  .intro h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 400; color: var(--color-accent); margin-bottom: 8px; }
  .intro ol { padding-left: 26px; margin-bottom: 14px; }
  .intro li .twelve { margin: 6px 0 12px; }
  .intro li { font-size: 1.15rem; line-height: 1.45; margin-bottom: 4px; }
  .intro p { font-size: 1.05rem; line-height: 1.5; color: var(--color-text); margin-bottom: 14px; }
  .intro .fun { color: var(--color-text-dim); }
  /* (2026-11-12) the two defined terms are always underlined; "two" in color */
  /* (one unbroken line: by default the line skips round letters that dip
     below it, like the g in "Tiling": user, 2026-11-13) */
  .tut u { text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-skip-ink: none; -webkit-text-decoration-skip: none; }
  .intro .two { color: var(--color-accent); font-weight: 700; }
  .intro li .sub { font-size: 1rem; color: var(--color-text-dim); margin: 4px 0 8px; }
  .intro .ominoes { display: block; margin-top: 4px; }

  /* ── Slide 2: pick the grid with parity (2026-11-12) ── */
  .pick { max-width: 760px; margin: 0 auto; text-align: center; }
  .pick p { font-size: 1.1rem; line-height: 1.45; color: var(--color-text); margin: 0 0 8px; }
  .pick .pick-ask { display: inline-block; margin: 2px 0 10px; }
  .pick-boards { display: flex; justify-content: center; gap: 18px; flex-wrap: nowrap; }
  .pick-btn { border: none; background: transparent; padding: 8px 8px 6px; border-radius: 14px; cursor: pointer;
              display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--color-text);
              transition: opacity 0.5s, box-shadow 0.3s, background 0.3s; }
  .pick-btn:hover:not(:disabled) { background: rgba(var(--glow), 0.1); box-shadow: 0 0 0 2px rgba(var(--glow), 0.5); }
  .pick-btn:disabled { cursor: default; }
  .pick-btn.picked { background: rgba(var(--glow), 0.12); box-shadow: 0 0 0 2px rgba(var(--glow), 0.7); }
  .pick-btn.dim { opacity: 0.3; }
  .pick-btn .pick-label { font-family: var(--font-display); font-size: 1.3rem; }
  .pick-btn svg { max-width: 100%; height: auto; }
  .pick-msg { min-height: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 6px; }
  .pick-msg .bad { color: var(--color-status); font-weight: 700; animation: fadeIn 0.4s ease both; }
  .pick-msg .next-up { color: var(--color-text); animation: fadeIn 0.4s ease both; }
  /* counts on the two little boards (and the game board's counts when odd) */
  .pc-count { font-family: var(--font-text); font-weight: 700; font-size: 15px; fill: var(--color-valid);
              transform-box: fill-box; transform-origin: center; animation: popIn 0.4s cubic-bezier(.3,1.6,.5,1) both; }
  .pc-count.odd, .count.odd { fill: var(--color-status); }
  .pc-glow { fill: var(--color-valid); opacity: 0; transition: opacity 0.15s; }
  .pc-glow.on { opacity: 0.55; }
  .pc-glow.odd, .row-glow.odd { fill: var(--color-status); }
  .pc-glow.stay { opacity: 0.55; }
  @media (max-width: 760px) {
    .pick p { font-size: 1rem; margin-bottom: 6px; }
    .pick-boards { gap: 6px; }
    .pick-btn { padding: 4px 2px; }
    .pick-msg { min-height: 64px; }
  }
  .twelve { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 10px; justify-items: center; align-items: center;
            background: rgba(128, 128, 128, 0.08); border-radius: 14px; padding: 16px 10px; }
  /* (phones: two rows of six, see "Phones: less scrolling" at the end) */

  /* Slides 2-4: notes sit beside the parts they describe */
  .play {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    grid-template-areas:
      "trayl tray  trayr"
      ".     stat  ."
      "boardl board boardr"
      "below below below";
    align-items: center;
    column-gap: 22px;
    row-gap: 8px;
  }
  .play .tray { grid-area: tray; max-width: 460px; min-height: 60px; }
  /* The message above the board is exactly as wide as the board, so a long
     message wraps instead of widening the middle column (which would shift
     the board sideways) */
  .play .status { grid-area: stat; width: var(--tut-board); max-width: none; justify-self: center; }
  .play .board-wrap { grid-area: board; width: var(--tut-board); height: var(--tut-board); justify-self: center; }
  .n-trayl  { grid-area: trayl;  justify-self: end; text-align: right; display: flex; align-items: center; max-width: 320px; }
  /* (Never taller than the board, so a long note can't make the row grow
     and shift the board; extra text just runs on below) */
  .n-boardr { grid-area: boardr; justify-self: start; max-width: 300px; max-height: var(--tut-board); }
  .n-boardl { grid-area: boardl; justify-self: end; max-width: 270px; font-size: 1rem; }
  .n-boardl:empty { display: none; }
  /* (Empty, it must take no part in the layout: on phones its "trayr" spot
     doesn't exist and would add a hidden extra column that pushes the board off-centre) */
  .n-trayr:empty { display: none; }
  /* Two-step note ("Rotate a piece" → "Then drag it onto the grid"): each
     step glows in turn, until the player has done it */
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .nobr { white-space: nowrap; }     /* keeps e.g. "rotate it. ➤" together when a step wraps */
  .step { margin: 0; }
  /* A key on the keyboard, e.g. R */
  .note kbd {
    font-family: var(--font-text); font-weight: 700; font-size: 0.85em;
    padding: 1px 6px; border-radius: 5px; border: 1px solid var(--color-cell-border);
    background: var(--color-bg); color: var(--color-text);
  }
  .n-below  { grid-area: below; justify-self: center; text-align: center; max-width: 720px; }
  .arrow { display: inline-block; color: var(--color-accent); font-size: 1.6rem; margin-left: 6px; vertical-align: -2px; }
  .big-note { font-size: 1.4rem; font-weight: 700; line-height: 1.3; color: var(--color-accent); border-left: 4px solid var(--color-accent); padding-left: 14px; }
  .hint { font-size: 1rem; line-height: 1.5; color: var(--color-text-dim); margin-top: 6px; }
  .dont { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; margin-top: 8px; }
  .dont figure { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0; }
  .dont figcaption { font-size: 0.9rem; color: var(--color-text-dim); }
  .play .hint-caption { display: none; }   /* not used in the tutorial */

  /* [COLORS] A note that glows until the player does what it says
     ("Drag these pieces…" fades once a piece is dragged, etc.) */
  .callout { border-radius: 12px; padding: 8px 12px; transition: background 0.7s, box-shadow 0.7s; }
  .callout.lit {
    background: rgba(var(--glow), 0.16);
    box-shadow: 0 0 0 2px rgba(var(--glow), 0.7), 0 0 20px rgba(var(--glow), 0.35);
  }
  /* The most important message (make every row and column even) glows harder */
  .callout.strong.lit {
    background: rgba(var(--glow), 0.24);
    box-shadow: 0 0 0 3px rgba(var(--glow), 0.95), 0 0 30px rgba(var(--glow), 0.6);
  }
  .big-note.callout { padding: 10px 14px; }
  /* Things that fade in later (the final slide's Hint button). They keep
     their space while hidden, so nothing moves when they appear. */
  .reveal-later { opacity: 0; visibility: hidden; transition: opacity 0.8s, visibility 0.8s; }
  .reveal-later.shown { opacity: 1; visibility: visible; }
  /* Slide 3's heading: glows just long enough to read, then fades */
  .dont-slide h2.callout { display: inline-block; padding: 6px 16px; }

  /* Pop-in animation used by the pictures */
  @keyframes popIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw  { to { stroke-dashoffset: 0; } }
  .anim-in { animation: popIn 0.45s cubic-bezier(.3,1.4,.5,1) both; }
  .draw { stroke-dasharray: 100; stroke-dashoffset: 100; }
  .anim-in .draw { animation: draw 0.6s 0.2s ease forwards; }   /* traces itself once its picture pops in */

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ── Slides 5–7: the highlighter (game.js builds and places it) ──
     Room above the pieces for it */
  .play { position: relative; }
  .play.with-hl .tray { margin-top: 56px; }   /* (it sits 16px higher here than in the game: hlOffset; 10px clear of the pieces) */
  /* Slide 5: the grid comes in after the highlighter's popup. Hidden things
     keep their space. Hiding is instant (no fade), so the grid never shows
     for a moment before the text; only coming in fades. */
  .play .later-in:not(.shown) { opacity: 0; visibility: hidden; transition: none; }
  .play .later-in.shown { opacity: 1; visibility: visible; transition: opacity 0.7s, visibility 0.7s; }
  /* [COLORS] The highlighter glowing: steadily while slide 5's popup points
     at it, or twice (slide 6) to say "use me now" */
  @keyframes hlGlow { from { box-shadow: 0 0 0 3px rgba(var(--glow),0.45), 0 0 10px rgba(var(--glow),0.35); }
                      to   { box-shadow: 0 0 0 6px rgba(var(--glow),0.9),  0 0 30px rgba(var(--glow),0.75); } }
  .hl-tool.glowing .hl-pencil   { animation: hlGlow 1.1s ease-in-out infinite alternate; }
  .hl-tool.glow-twice .hl-pencil { animation: hlGlow 0.55s ease-in-out 4 alternate; }
  .hl-tool.glow-color .hl-color  { border-radius: 8px; animation: hlGlow 1.1s ease-in-out infinite alternate; }
  /* slide 5: the grid's glow, once (same glow as the highlighter's) */
  @keyframes gridInvite { 0%, 100% { box-shadow: var(--color-board-shadow); }
                          45% { box-shadow: 0 0 0 5px rgba(var(--glow),0.85), 0 0 30px rgba(var(--glow),0.7); } }
  #board-outer.invite { animation: gridInvite 1.4s ease-in-out 1; }
  /* Slide 5's popup, just under the highlighter (its little arrow points
     up at it). game.js / showHighlighterIntro place it. */
  /* (z-index under the highlighter's, so its color menu opens over the popup) */
  .hl-bubble {
    position: absolute; z-index: 55; width: min(320px, calc(100% - 8px)); padding: 12px 16px;
    display: flex; align-items: center; transition: opacity 0.4s;
    background: var(--color-panel); border: 2px solid rgba(var(--glow), 0.8); border-radius: 14px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18); text-align: left;
  }
  .hl-bubble[hidden] { display: none; }
  .hl-bubble.gone { opacity: 0; pointer-events: none; }        /* (faded away; keeps its place) */
  .hl-bubble.no-arrow::before { display: none; }
  .hl-bubble::before {    /* the arrow */
    content: ''; position: absolute; top: -9px; right: var(--arrow-right, 20px); width: 14px; height: 14px;
    background: var(--color-panel); border-left: 2px solid rgba(var(--glow), 0.8); border-top: 2px solid rgba(var(--glow), 0.8);
    transform: rotate(45deg);
  }
  .hl-bubble p { margin: 0; }
  .hl-bubble b { color: var(--color-accent); font-weight: 700; }
  /* Slide 6 opens with a popup that's dark straight away (no fade in) */
  .spot.instant { animation: none; }
  .spot-card .hl-pop b { color: var(--color-accent); font-weight: 700; }
  .scroll-hint { z-index: 80; }   /* (the ▾ for more below: under the dark screens and the hint) */
  /* [COLORS] Slide 6's hint, when it pops in: a soft glow for a few seconds */
  @keyframes hintIn { 0% { box-shadow: 0 0 0 0 rgba(var(--glow), 0); } 30% { box-shadow: 0 0 0 4px rgba(var(--glow), 0.6), 0 0 18px rgba(var(--glow), 0.5); }
                      100% { box-shadow: 0 0 0 0 rgba(var(--glow), 0); } }
  .empty-card p.hl-hint { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(var(--glow), 0.1); }
  .empty-card p.hl-hint.shown { animation: hintIn 2.4s ease-out 2; }
  /* [COLORS] Slide 6: once both empty squares are found, the squares left
     for the pieces glow twice (the payoff: the pieces' spots stand out) */
  @keyframes openFlash { 0%, 100% { box-shadow: none; }
                         50% { box-shadow: inset 0 0 0 3px rgba(var(--glow), 0.9), 0 0 12px rgba(var(--glow), 0.6); } }
  #board .board-cell.open-flash { animation: openFlash 0.9s ease-in-out 2; }
  /* (2026-11-12) slide 5: all six empty squares found → they flash green */
  @keyframes foundFlash { 0%, 100% { box-shadow: none; }
                          50% { box-shadow: inset 0 0 0 3px var(--color-valid), 0 0 14px var(--color-valid); } }
  #board .board-cell.found-flash { animation: foundFlash 0.7s ease-in-out 2; }
  /* a plain line above a slide's steps (slides 3, 4, 6) */
  .lead { margin: 0 0 6px; }
  .n-trayl.has-lead { flex-direction: column; align-items: stretch; }
  /* ── Slide 3's animated sum (2026-11-13) ── */
  /* the six pieces fit in one row above the grid on laptops */
  .play.explainer .tray { max-width: 620px; }
  /* (the pieces' row in front of the grid, so a piece dragged up from the
     grid is seen the whole way, not behind the grid: user, 2026-11-13) */
  .play.explainer .tray { position: relative; z-index: 20; }
  /* Phones (2026-11-13): the room for the six pieces pushed the grid under
     the Back / Next bar, so on these slides the pieces are smaller
     (html.compact-tray, set by showFindEmpty: the game reads --tray-cell
     from the page) and the grid a little smaller, leaving room under it
     for the measuring line */
  html.compact-tray { --tray-cell: 9px; }
  @media (max-width: 760px) { .play.explainer { --tut-board: min(360px, 34vh, 80vw); } }
  /* the short messages over the middle of the grid: smaller and centred */
  .spot-card:has(.ex-big) { width: min(360px, calc(100vw - 32px)); text-align: center; }
  .spot-card p.ex-big { font-size: 1.3rem; margin-bottom: 10px; }
  /* a popup that glows (slide 3's "Next, we'll examine this grid further.") */
  .spot-card.glow { animation: hintGlow 1.2s ease-in-out infinite alternate; }
  .spot-card p.ex-big b { color: var(--color-accent); }
  html.large-text .spot-card p.ex-big { font-size: 1.7rem; }
  /* each empty square's number, 1 to 6 */
  .sq-num { font-family: var(--font-display); fill: var(--color-text); transform-box: fill-box; transform-origin: center;
            animation: popIn 0.4s cubic-bezier(.3,1.6,.5,1) both; }
  /* "36 − 30 = 6 empty squares" */
  .eq-banner { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; z-index: 40; white-space: nowrap;
               padding: 10px 22px; border-radius: 14px; font-family: var(--font-display); font-size: 1.8rem;
               color: var(--color-text); background: var(--color-panel);
               border: 2px solid rgba(var(--glow), 0.7); box-shadow: 0 0 20px rgba(var(--glow), 0.3);
               animation: popIn 0.45s cubic-bezier(.3,1.4,.5,1) both; transition: opacity 0.5s; }
  .eq-banner b { color: var(--color-accent); font-weight: 400; }
  /* (its pop-in animation holds it visible, so going away is an animation
     too: a plain opacity change was overridden and the label stayed) */
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  .eq-banner.gone, .sq-num.gone { animation: fadeOut 0.35s ease forwards; pointer-events: none; }
  .eq-banner.still:not(.gone), .sq-num.still:not(.gone) { animation: none; }
  /* the measuring lines (drawDimensions) */
  .dim-stroke { stroke: var(--color-accent); stroke-width: 2.5; stroke-linecap: round; }
  .dim-patch { fill: var(--color-panel); }
  .dim-num { font-family: var(--font-display); font-size: 20px; fill: var(--color-accent); }
  .dim-label.pop { transform-box: fill-box; transform-origin: center; animation: popIn 0.4s cubic-bezier(.3,1.6,.5,1) both; }
  /* "Counting the squares": smaller, just above the column counts */
  .eq-banner.small { font-size: 1.15rem; padding: 4px 14px; border-width: 1.5px; }
  @media (max-width: 760px) { .eq-banner { font-size: 1.35rem; padding: 6px 14px; } }
  /* the first step gets a check once it's done */
  .empty-card p.step-done::after { content: ' \2713'; color: var(--color-valid); font-weight: 700; }
  /* Phones: on slide 6 the note comes first (it's read before anything
     else), then the pieces and the board */
  @media (max-width: 760px) {
    .play.hl-lesson { grid-template-areas: "boardr" "trayl" "tray" "stat" "board" "boardl" "below"; }
    .play.hl-lesson .empty-card { margin: 0 0 4px; }
    .play.hl-lesson .status, .play.hl-intro .status { display: none; }   /* (always empty in the tutorial; its room goes to the board) */
  }
  /* The note beside the board: its lines appear one at a time (each keeps
     its space while hidden, so nothing moves) */
  .empty-card { max-width: 340px; padding: 14px 18px; text-align: left;
                border: 2px solid rgba(var(--glow), 0.55); border-radius: 14px; background: rgba(var(--glow), 0.08); }
  .empty-card { transition: opacity 0.5s; }
  .empty-card.waiting { opacity: 0; }   /* (slide 6: until its popup is closed) */
  .empty-card p { margin: 0 0 10px; opacity: 0; transform: translateY(6px); transition: opacity 0.6s, transform 0.6s; }
  .empty-card p:last-child { margin-bottom: 0; }
  .empty-card p.shown { opacity: 1; transform: none; }
  .empty-card b { color: var(--color-accent); font-weight: 700; }
  @media (min-width: 761px) { .n-boardr .empty-card { margin-left: 16px; } }   /* clear of the row counts */
  @media (max-width: 760px) { .empty-card { margin-top: 6px; padding: 10px 12px; max-width: none; } }
  /* While a solved board's rows and columns are counted, the other text fades */
  .play.counting .n-trayl, .play.counting .status, .play.counting .n-boardl, .play.counting .n-below { opacity: 0; transition: opacity 0.5s; }
  .fading { opacity: 0; transition: opacity 0.5s; }
  .gone-now { visibility: hidden; }   /* (slide 3c: the left text already gone; keeps its room) */
  /* The solved badge beside the board (celebrate.js; styled in game.css),
     clear of the row counts */
  .n-boardr .win-badge { margin: 14px 0 0 12px; }
  .n-boardr .win-badge:first-child { margin-top: 0; }

  /* ── Final slide: the Hint button and the spotlight it opens ── */
  .hint-btn {
    display: block; margin-top: 14px; height: 44px; padding: 0 22px; border: none; border-radius: 12px;
    font-family: var(--font-display); font-size: 1.3rem; letter-spacing: 0.04em; cursor: pointer;
    background: var(--color-accent); color: #fff;
  }
  .hint-btn.lit { animation: hintGlow 1.2s ease-in-out infinite alternate; }
  /* (an invisible strip under it: when it's the last thing on a slide that
     scrolls, there's room under it for its glow at the bottom) */
  .hint-btn { position: relative; }
  .hint-btn::after { content: ''; position: absolute; left: 0; top: 100%; width: 1px; height: var(--edge-room, 24px); pointer-events: none; }
  @keyframes hintGlow { from { box-shadow: 0 0 0 3px rgba(var(--glow),0.5), 0 0 10px rgba(var(--glow),0.35); }
                        to   { box-shadow: 0 0 0 5px rgba(var(--glow),0.9), 0 0 28px rgba(var(--glow),0.7); } }
  @media (max-width: 760px) { .hint-btn { margin-left: auto; margin-right: auto; } }
  .spot { position: fixed; inset: 0; z-index: 90; animation: fadeIn 0.4s ease both; }
  .spot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot-ring { fill: none; stroke: var(--color-accent); stroke-width: 3; filter: drop-shadow(0 0 8px rgba(var(--glow),0.9)); }
  .spot-card {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: min(520px, calc(100vw - 32px)); padding: 16px 18px;
    background: var(--color-panel); border: 2px solid var(--color-accent); border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
  }
  .spot-card p, .spot-card li { font-size: 1.1rem; line-height: 1.5; color: var(--color-text); margin-bottom: 12px; }
  .spot-card ol { padding-left: 24px; }
  .ok-btn {
    display: block; width: 100%; height: 42px; border: none; border-radius: 12px;
    font-family: var(--font-display); font-size: 1.25rem; letter-spacing: 0.04em;
    background: var(--color-cell-border); color: var(--color-text-dim); cursor: default;
    transition: background 0.3s, color 0.3s, box-shadow 0.3s;
  }
  .ok-btn.ready { background: var(--color-next-ready); color: #fff; cursor: pointer; box-shadow: 0 0 0 4px rgba(123, 160, 91, 0.25); }

  /* ── "Don't place a piece over" slide ── */
  .dont-slide { max-width: 820px; margin: 0 auto; text-align: center; padding-top: 10px; }
  .dont-slide h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 400; color: var(--color-accent); margin-bottom: 18px; }
  .dont-slide .dont { display: grid; grid-template-columns: repeat(3, auto); justify-content: center; gap: 18px 28px; }   /* one row of 3 */
  .dont-slide figure {
    padding: 14px 16px 10px; border-radius: 14px;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .dont-slide figure.active {     /* [COLORS] the square behind the picture that's animating */
    background: rgba(var(--glow), 0.14);
    box-shadow: 0 0 0 2px rgba(var(--glow), 0.6);
  }
  .dont-slide figcaption { font-size: 1rem; color: var(--color-text); margin-top: 6px; }
  .mover { transition: transform 0.7s cubic-bezier(.3,.9,.4,1), opacity 0.3s; }
  .rb-nomark { transition: opacity 0.25s, transform 0.3s cubic-bezier(.3,1.5,.5,1); transform-box: fill-box; transform-origin: center; }
  .rb-nomark.hide { opacity: 0; transform: scale(0.3); }
  /* Phones: two pictures side by side (shrinking to fit the screen instead
     of running off its side), the third centred under them */
  @media (max-width: 520px) {
    .dont-slide .dont { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
    .dont-slide figure:last-child { grid-column: 1 / -1; justify-self: center; width: 50%; }
    .dont-slide figure { padding: 10px 6px 8px; min-width: 0; }
    .dont-slide figure svg { width: 100%; height: auto; }
  }

  /* ── Final slide: counting the blocks in each row and column ── */
  #tut-overlay { position: absolute; left: var(--board-pad); top: var(--board-pad); overflow: visible; pointer-events: none; z-index: 7; }
  .row-glow { fill: var(--color-valid); opacity: 0; transition: opacity 0.12s; }
  .row-glow.on { opacity: 0.6; }
  .count { font-family: var(--font-text); font-weight: 700; font-size: 18px; fill: var(--color-valid);
           transform-box: fill-box; transform-origin: center; animation: popIn 0.4s cubic-bezier(.3,1.6,.5,1) both; }

  @media (max-width: 760px) {
    .play {
      grid-template-columns: 1fr;
      grid-template-areas: "trayl" "tray" "stat" "board" "boardr" "boardl" "below";
      justify-items: center;
    }
    .n-trayl, .n-boardr, .n-boardl { justify-self: center; text-align: center; max-width: none; }
    .n-boardr .win-badge { margin: 10px auto 0; width: fit-content; }
    .arrow { transform: rotate(90deg); }
    .big-note { border-left: none; padding-left: 0; font-size: 1.2rem; }
    /* [POSITIONING] Phones: tighter spacing so more fits on the screen */
    .play { row-gap: 4px; }
    .steps { gap: 2px; }
    .tut-head { padding: 8px 56px 4px; }
    .tut-head h1 { font-size: 1.6rem; }
    .dots { margin-top: 6px; }
    .close-x { top: 8px; width: 36px; height: 36px; font-size: 1.15rem; }
    .tut-body { padding-top: calc(2px + var(--edge-room)); padding-bottom: calc(6px + var(--edge-room)); }
    .tut-foot { padding: 6px 14px 10px; }
    .foot-btn { height: 44px; min-width: 116px; font-size: 1.25rem; }
  }

  /* ── Footer: Back, Next/Finish ── */
  .tut-foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 16px; }
  .foot-btn {
    height: 50px; min-width: 130px; padding: 0 22px; border: none; border-radius: 12px;
    font-family: var(--font-display); font-size: 1.4rem; letter-spacing: 0.04em; cursor: pointer;
    background: var(--color-cell-border); color: var(--color-text-dim);
    transition: background 0.2s, color 0.2s, transform 0.1s, box-shadow 0.2s;
  }
  .foot-btn.back { min-width: 0; background: transparent; }
  .foot-btn.back:hover { color: var(--color-text); }
  .foot-btn.next[aria-disabled="true"] { cursor: default; }
  .foot-btn.next.ready { background: var(--color-next-ready); color: #fff; box-shadow: 0 0 0 4px rgba(123, 160, 91, 0.25), inset 0 -3px 0 rgba(0,0,0,0.15); }
  .foot-btn.next.ready:hover { filter: brightness(1.08); transform: translateY(-1px); }
  /* ── Large text (the button at the top left) ──
     Only reading text grows; titles, buttons and the board stay the same. */
  html.large-text .note { font-size: 1.8rem; }
  html.large-text .n-trayl { max-width: 460px; }
  html.large-text .n-boardr { max-width: 420px; }
  html.large-text .n-boardl { font-size: 1.65rem; max-width: 400px; }
  html.large-text .big-note { font-size: 2.15rem; }
  html.large-text .hint { font-size: 1.65rem; }
  html.large-text .win-text span { font-size: 1.65rem; }
  html.large-text .win-text strong { font-size: 2rem; }
  html.large-text .spot-card p, html.large-text .spot-card li { font-size: 1.7rem; }
  html.large-text .hint-btn { font-size: 1.6rem; height: 52px; }
  html.large-text .intro li { font-size: 1.85rem; }
  html.large-text .intro p { font-size: 1.75rem; }
  html.large-text .dont-slide figcaption { font-size: 1.65rem; }
  html.large-text .status { font-size: 1.75rem; --status-line: 2.25rem; }
  .one-line { white-space: nowrap; }   /* laptops: keep this note on one line */
  @media (max-width: 600px) {
    .one-line { white-space: normal; }   /* phones: wrap so it never runs off the screen */
    /* (the header is one row on phones: see "Phones: less scrolling" at the end) */
    .text-size-btn { height: 32px; padding: 0 10px; font-size: 0.9rem; }
    html.large-text .spot-card p, html.large-text .spot-card li { font-size: 1.4rem; }
    .text-size-btn.is-large-label { font-size: 0.95rem; }
  }

  /* ── Phones: less scrolling (user, 2026-11-05) ──
     Last in this file on purpose, so these win over the rules above
     (the footer's phone sizes used to come too early and were ignored). */
  @media (max-width: 760px) {
    /* the message line above the board: always empty in the tutorial */
    .play .status { display: none; }
    /* one-row header: moon / sun, Large text, the title, ✕; dots under it */
    .tut-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; padding: 8px 12px 2px; }
    .tut-head .view-btns { position: static; margin: 0; order: 1; }
    .tut-head h1 { order: 2; flex: 1 1 auto; font-size: 1.45rem; text-align: center; }
    .close-x { position: static; order: 3; flex: 0 0 auto; }
    .dots { order: 4; flex: 0 0 100%; margin-top: 4px; }
    /* a slimmer Back / Next bar */
    .tut-foot { padding: 4px 12px 8px; }
    .foot-btn { height: 40px; min-width: 104px; padding: 0 18px; font-size: 1.2rem; }
    /* the highlighter sits at the right end of the pieces' row, not above
       it (game.js gameSettings.hlBeside): no row of its own */
    .play.with-hl .tray { margin-top: 0; padding-right: 76px; }   /* (the highlighter + its color dot: 68px, plus a gap) */
    /* slide 1: the 12 pieces in two rows of six */
    .twelve { grid-template-columns: repeat(6, 1fr); gap: 10px 4px; padding: 10px 6px; }
    .intro h2 { margin-bottom: 4px; }
    .intro ol { margin-bottom: 8px; }
    .intro p { margin-bottom: 10px; }
    /* slides 2 and 4 (user, 2026-11-06): shorter step boxes, closer
       together, a little further from the dots, with a tighter glow */
    .tut-body { padding-top: calc(6px + var(--edge-room)); }
    .play .step.callout { padding: 3px 10px; line-height: 1.35; }
    .play .step.callout.lit { box-shadow: 0 0 0 2px rgba(var(--glow), 0.7), 0 0 10px rgba(var(--glow), 0.3); }
    .steps { gap: 1px; }
    /* slide 6: a little tighter, so the whole grid shows on small phones */
    .play.hl-lesson .empty-card { margin: 0; padding: 8px 12px; }
    .play.hl-lesson .empty-card p { margin-bottom: 4px; }
    .play.hl-lesson .empty-card p:last-child { margin-bottom: 0; }
    /* slide 6: room for its Hint button at the left end of the pieces' row */
    .play.hl-lesson.with-hl .tray { padding-left: 76px; }
  }
  /* Phones: the solved note floats just above the grid (or below it, on
     the last slide), on its own background, over the faded text */
  .win-float { position: absolute; left: 0; right: 0; z-index: 60; display: flex; justify-content: center; pointer-events: none; }
  .win-float .win-badge { margin: 0; max-width: calc(100% - 8px);
    background: linear-gradient(rgba(111, 174, 90, 0.12), rgba(111, 174, 90, 0.12)), var(--color-panel); }
  #board-wrap { transition: transform 0.5s ease; }   /* (last slide, small phones: moves up for the solved note) */
  .hl-tool.fading { pointer-events: none; }
  /* Phones, slide 6: the small Hint button that brings the hint back */
  .hint-btn.lesson-hint { position: absolute; z-index: 50; margin: 0; height: 36px; padding: 0 12px; font-size: 1.1rem;
                          animation: fadeIn 0.6s ease both; }
  html.large-text .hint-btn.lesson-hint { font-size: 1.1rem; height: 36px; }
  /* A popup's text in the big orange style (the last slide's "Make sure…" on phones) */
  .spot-card .big-note { border-left: none; padding-left: 0; margin-bottom: 12px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tut">
  <header class="tut-head">
    <!-- Large text / Standard text and Dark mode / Light mode (styled in
         rules.css; shared with the rules popup; dark mode is theme.js) -->
    <div class="view-btns">
      <!-- moon / sun (dark mode, theme.js) at the far left, then Large text -->
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode"></button>
      <button type="button" class="text-size-btn" id="text-size-btn"></button>
    </div>
    <h1>Tutorial</h1>
    <div class="dots" id="dots"></div>
    <button class="close-x" id="close-x" aria-label="Close tutorial" title="Close">&#10005;</button>
  </header>

  <main class="tut-body">
    <!-- Slide 1 -->
    <section class="intro" id="intro"></section>

    <!-- Slide 2: pick the grid with parity (2026-11-12) -->
    <section class="pick" id="pick" hidden>
      <!-- (the slide's text comes from SLIDES: pickIntro + pickAsk) -->
      <div id="pick-intro"></div>
      <p class="pick-ask note callout" id="pick-ask"></p>
      <div class="pick-boards" id="pick-boards"></div>
      <div class="pick-msg" id="pick-msg" aria-live="polite"></div>
    </section>

    <!-- Slide 3: "Don't place a piece over…" (animated pictures) -->
    <section class="dont-slide" id="dont-slide" hidden>
      <h2>Don&rsquo;t place a piece over:</h2>
      <div class="dont" id="dont"></div>
    </section>

    <!-- Slides 2, 4–6: the game, with notes placed around it -->
    <section class="play" id="play" hidden>
      <div class="note n-trayl" id="n-trayl"></div>
      <div class="tray" id="tray" aria-label="Pieces to place"></div>
      <!-- The highlighter (slides 5–7), built and placed by game.js -->
      <div class="hl-tool" id="hl-tool" hidden></div>
      <!-- Slide 5: the popup under the highlighter saying what it does -->
      <div class="hl-bubble note" id="hl-bubble" hidden></div>
      <div class="note n-trayr" id="n-trayr" style="grid-area:trayr"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="board-wrap" id="board-wrap">
        <div id="board-outer">
          <div id="board"></div>
          <div id="pieces-layer"></div>
          <div id="hint-overlay"></div>
          <svg id="mark-overlay" aria-hidden="true"></svg>
          <svg id="tut-overlay" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="note n-boardr" id="n-boardr"></div>
      <div class="note n-boardl" id="n-boardl"></div>
      <div class="n-below" id="n-below"></div>
      <p class="hint-caption" id="hint-caption" hidden></p>
      <!-- Phones: the solved note, floating just above (or below) the grid,
           so nothing moves when it comes (placed by planPhoneWin) -->
      <div class="win-float" id="win-float" hidden></div>
      <!-- Slide 3: "36 − 30 = 6 empty squares" above the grid (showEquation) -->
      <div class="eq-banner" id="eq-banner" hidden>36 &minus; 30 = <b>6</b> empty squares</div>
      <!-- Phones, slide 6: brings its hint back (left end of the pieces' row) -->
      <button type="button" class="hint-btn lesson-hint" id="hl-hint-btn" hidden>Hint</button>
    </section>
  </main>

  <footer class="tut-foot">
    <button class="foot-btn back" id="back-btn">&larr; Back</button>
    <button class="foot-btn next" id="next-btn" aria-disabled="true">Next</button>
  </footer>
</div>

<!-- The final slide's hint: darkens the page except the dotted area,
     with an explanation (drawn by showHint; wording in SLIDES) -->
<div class="spot" id="spot" hidden role="dialog" aria-label="Hint">
  <svg id="spot-svg" aria-hidden="true"></svg>
  <div class="spot-card" id="spot-card">
    <div id="spot-text"></div>
    <button class="ok-btn ready" id="spot-ok">Got it</button>
  </div>
</div>

<script src="shapes.js"></script>
<script src="game.js"></script>
<script src="celebrate.js"></script>
<script src="scroll-hint.js"></script>   <!-- (phones: a ▾ while a slide goes on below the screen) -->
<script>
/* ═══════════════════════════════════════════════════════════════════
   WORDING HELPERS
═══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const TOUCH = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

/* ═══════════════════════════════════════════════════════════════════
   PIECES AND PUZZLES
   Fixed pieces are written with their real board squares and converted
   to the game's {cells, row, col} form. Each puzzle was checked with
   solver.js: slides 2 and 3 have one way to fit the pieces; slide 4 has
   6 ways but only one with every row and column even.
═══════════════════════════════════════════════════════════════════ */
// The Woodblock colors (INKS in shapes.js), one per piece, so every slide's
// pieces look different: the first six for the pieces of slides 2–3
const COLOR = { I:INKS.indigo, F:INKS.gold, W:INKS.vermilion, N:INKS.moss, P:INKS.sakura, Y:INKS.asagi,
                U:INKS.wisteria, V:INKS.persimmon };
gameSettings.distinctColors = false;     // (use these colors, not the game's own palette)
gameSettings.explain = false;            // mistakes only glow red; no message saying what's wrong
gameSettings.hlOffset = { x: 26, y: -16 };   // the highlighter a little higher and further right (user, 2026-11-05)
// Phones: the highlighter at the right end of the pieces' row instead of
// above it, so it doesn't take a row of the screen (user, 2026-11-05)
const PHONE_LAYOUT = window.matchMedia('(max-width: 760px)');
gameSettings.hlBeside = PHONE_LAYOUT.matches;
PHONE_LAYOUT.addEventListener('change', ()=>{ gameSettings.hlBeside = PHONE_LAYOUT.matches; });
function fixedPiece(name, absCells, color){
  const r0 = Math.min(...absCells.map(c=>c[0])), c0 = Math.min(...absCells.map(c=>c[1]));
  return { name, color: color || COLOR[name], row: r0, col: c0, cells: absCells.map(([r,c])=>[r-r0, c-c0]) };
}
const trayPiece = (name, cells) => ({ name, color: COLOR[name], cells });

const PUZZLE_2 = {
  title: 'Tutorial 1', rows: 6, cols: 6,
  blocked: [[0,0],[0,4],[3,0],[4,4]],
  hintOutline: [[1,2],[2,1],[2,2],[2,3],[3,3]],
  fixedPieces: [
    fixedPiece('W', [[0,1],[0,2],[1,0],[1,1],[2,0]]),
    fixedPiece('N', [[0,3],[1,3],[1,4],[2,4],[3,4]]),
    fixedPiece('P', [[3,1],[4,0],[4,1],[5,0],[5,1]]),
    fixedPiece('Y', [[4,3],[5,2],[5,3],[5,4],[5,5]]),
  ],
  pieces: [ trayPiece('I', [[0,0],[0,1],[0,2],[0,3],[0,4]]), trayPiece('F', [[0,1],[0,2],[1,0],[1,1],[2,1]]) ],
};
const PUZZLE_3 = {
  title: 'Tutorial 2', rows: 6, cols: 6,
  blocked: [[0,5],[3,5]],   // ((3,3) and (4,3) removed 2026-10-27; still exactly one solution)

// The squares a puzzle's pieces cover, and the ones they leave empty
function coveredBy(pieces){
  const set = new Set();
  pieces.forEach(p=>p.cells.forEach(([r,c])=>set.add((p.row+r) + ',' + (p.col+c))));
  return set;
}
function emptyOf(p, pieces){
  const covered = coveredBy(pieces || p.fixedPieces), out = [];
  for(let r=0; r<p.rows; r++) for(let c=0; c<p.cols; c++) if(!covered.has(r + ',' + c)) out.push(r + ',' + c);
  return out;
}

function pieceSvg(cells, color, cell){
  const gap = 2, b = bounds(cells);
  const w = b.cols*cell + (b.cols-1)*gap, h = b.rows*cell + (b.rows-1)*gap;
  const svg = svgEl('svg', { width:w+4, height:h+4, viewBox:`-2 -2 ${w+4} ${h+4}`, 'aria-hidden':'true' });
  drawPiece(svg, cells, color, 0, 0, cell, gap);
  return svg;
}

// "Don't place a piece over…" pictures: a small 3×4 board, a piece in the
// wrong place, and the red not-allowed sign. With animated = true the
// piece starts off to one side (invisible) and the sign starts hidden;
// playDont() then slides the piece in and pops the sign up.
function dontPicture(kind, animated){
  const cell = 26, gap = 3, pad = 6, rows = 3, cols = 4, step = cell + gap, m = 24;
  const W = cols*cell + (cols-1)*gap + 2*pad, H = rows*cell + (rows-1)*gap + 2*pad;
  const svg = svgEl('svg', { width: W + 2*m, height: H + 2*m, viewBox:`${-m} ${-m} ${W + 2*m} ${H + 2*m}`, 'aria-hidden':'true' });
  svgEl('rect', { x:0, y:0, width:W, height:H, rx:6, class:'rb-frame' }, svg);
  const xAt = c => pad + c*step, yAt = r => pad + r*step;
  for(let r=0; r<rows; r++) for(let c=0; c<cols; c++)
    svgEl('rect', { x:xAt(c), y:yAt(r), width:cell, height:cell, rx:2, class:'rb-cell' }, svg);
  // The piece that moves into the wrong spot lives in a "mover" group, so
  // it can start shifted by (dx, dy) and slide into place
  const mover = svgEl('g', { class:'mover' });
  let dx = 0, dy = 0;
  if(kind === 'dotted'){
    drawDottedLines(svg, [[[0,0],[0,1],[1,0],[1,1]]], step, gap, pad, pad,
      Object.assign({ onBoard: (r,c)=>r>=0 && c>=0 && r<rows && c<cols }, PICTURE_DOTTED));
    svg.appendChild(mover);
    drawPiece(mover, [[0,0],[0,1],[0,2]], COLOR.I, xAt(1), yAt(1), cell, gap);
    dx = 2*step;                                          // slides in from the right
  } else if(kind === 'edge'){
    svg.appendChild(mover);
    drawPiece(mover, [[0,1],[1,0],[1,1]], COLOR.P, xAt(-1), yAt(1), cell, gap);
    dx = 2*step;                                          // slides left, off the left edge
  } else if(kind === 'piece'){
    drawPiece(svg, [[0,0],[0,1],[0,2]], COLOR.N, xAt(0), yAt(1), cell, gap);
    svg.appendChild(mover);
    drawPiece(mover, [[0,0],[1,0],[2,0]], COLOR.U, xAt(1), yAt(0), cell, gap).setAttribute('opacity', '0.85');
    dy = -2*step;                                         // drops in from above
  }
  // The sign covers the whole picture, so it never seems to point at one
  // square in particular
  const sign = drawNoMark(svg, W/2, H/2, Math.max(W, H)/2);
  if(animated){
    mover.style.transform = `translate(${dx}px, ${dy}px)`;
    mover.style.opacity = '0';
    sign.classList.add('hide');
  }
  return svg;
}

// Play one picture's animation: slide the piece in, then pop up the sign
function playDont(svg){
  const mover = svg.querySelector('.mover');
  mover.style.transform = 'translate(0px, 0px)';
  mover.style.opacity = '1';
  setTimeout(()=>svg.querySelector('.rb-nomark').classList.remove('hide'), 650);
}

let current = 0;
const SLIDE_KEY = 'pb_tutorialSlide';             // sessionStorage: the slide to come back to after a refresh
const done = SLIDES.map(s=>s.kind === 'intro');   // slide 1 has no task
const solvedView = {};                            // slide index → what the solved board looked like

function renderDots(){
  const dots = $('dots');
  dots.innerHTML = '';
  SLIDES.forEach((s,i)=>{
    const d = document.createElement('span');
    d.className = 'dot' + (i === current ? ' now' : done[i] ? ' done' : '');
    d.setAttribute('aria-label', `Step ${i+1} of ${SLIDES.length}` + (i === current ? ' (current)' : ''));
    dots.appendChild(d);
  });
}

function updateNext(){
  const last = current === SLIDES.length - 1;
  const btn = $('next-btn');
  btn.textContent = last ? 'Finish ✓' : 'Next →';
  btn.classList.toggle('ready', done[current]);
  btn.setAttribute('aria-disabled', done[current] ? 'false' : 'true');
  $('back-btn').style.visibility = current === 0 ? 'hidden' : 'visible';
}

/* Animations are timed with setTimeout. Each slide change bumps animRun,
   and every timed step checks it first, so leaving a slide mid-animation
   stops that animation. */
let animRun = 0;
function later(ms, fn){ const run = animRun; setTimeout(()=>{ if(run === animRun) fn(); }, ms); }

function markDone(){ done[current] = true; renderDots(); updateNext(); }

function showSlide(i){
  current = i;
  animRun++;
  const s = SLIDES[i];
  $('intro').hidden = s.kind !== 'intro';
  $('dont-slide').hidden = s.kind !== 'dont';
  $('pick').hidden = s.kind !== 'pick';
  findStage = null;
  $('play').classList.remove('explainer');
  document.documentElement.classList.remove('compact-tray');
  $('eq-banner').hidden = true;
  const onBoard = s.kind === 'play';   // slides that show the game's board
  // (Slide 5 hides its grid BEFORE anything is shown, so it never flashes
  // up ahead of the popup: the glitch the user saw, 2026-11-05)
  LATER_IN.forEach(id=>{ $(id).classList.toggle('later-in', !!s.highlighterIntro); $(id).classList.remove('shown'); });
  $('play').hidden = !onBoard;
  $('play').classList.remove('counting');
  $('play').classList.toggle('with-hl', !!s.highlighter);
  $('play').classList.toggle('hl-intro', !!s.highlighterIntro);
  $('play').classList.toggle('hl-lesson', !!s.highlighterLesson);

  $('board-outer').classList.remove('invite');
  $('hl-tool').classList.remove('glow-color');
  $('tray').style.minHeight = '';
  setHighlighting(false);                    // (the highlighter starts off on every slide)
  setMarkColor(0);
  showColorMenu(false);
  hideHint();
  hintOnClose = null;
  $('win-float').hidden = true;
  $('win-float').innerHTML = '';
  $('board-wrap').style.transform = '';
  $('hl-hint-btn').hidden = true;
  $('tut-overlay').innerHTML = '';
  ['tut-overlay', 'n-boardr', 'hl-tool'].forEach(id=>$(id).classList.remove('fading'));
  try { sessionStorage.setItem(SLIDE_KEY, String(i)); } catch(e){}   // so a refresh comes back here
  if(s.kind === 'intro') renderIntro();
  if(s.kind === 'dont') showDontSlide();
  if(s.kind === 'pick') showPickSlide();
  // Every slide starts fresh, even when you come Back to it (Next stays
  // green if you've already finished it once)
  if(onBoard){
    bigNoteGlowed = false;
    hintOffered = false;
    renderSteps(s);
    $('n-trayr').innerHTML = '';
    $('n-boardr').innerHTML = s.boardRight || '';
    $('n-boardl').innerHTML = '';
    $('n-below').innerHTML = '';
    // Phones: the last slide's "Make sure…" is a popup they close with
    // "Got it", so the slide itself is just the pieces and the grid (and
    // there's room under the grid for the hint): user, 2026-11-06
    const notePopup = s.bigNoteGlow && PHONE_LAYOUT.matches;
    if(notePopup) $('big-note').hidden = true;
    else if(s.bigNoteGlow){ $('big-note').classList.add('callout', 'strong'); later(BIG_GLOW_DELAY_MS, glowBigNote); }
    setGameMode('play');
    loadPuzzle(s.puzzle);
    lightSteps();             // (now that it's in play mode, the first step glows)
    if(notePopup) later(BIG_GLOW_DELAY_MS, ()=>showHint([{ over: true, html: `<div class="big-note">${$('big-note').innerHTML}</div>` }]));
  }
  if(s.highlighterIntro) showHighlighterIntro();

  if(s.findEmpty) showFindEmpty();
  renderDots();
  updateNext();
  $('play').parentElement.scrollTop = 0;
}

/* ── Step notes ("Rotate a piece" → "Then drag it onto the grid") ──
   The first step not done yet glows; doing a step (in any order) ticks it off. */
let stepDone = [];
function renderSteps(s){
  $('n-trayl').className = 'note n-trayl';
  $('n-trayl').innerHTML = (s.lead ? `<p class="lead">${s.lead}</p>` : '') + (s.steps
    ? `<div class="steps">${s.steps.map((st, i)=>`<p class="step callout" id="step${i}">${st.html}</p>`).join('')}</div>` : '');
  $('n-trayl').classList.toggle('has-lead', !!s.lead);
  stepDone = (s.steps || []).map(()=>false);
  lightSteps();
}
function lightSteps(){
  const steps = SLIDES[current].steps || [];
  const next = gameMode === 'view' ? -1 : stepDone.indexOf(false);
  steps.forEach((st, i)=>$('step' + i).classList.toggle('lit', i === next));
}
function stepEvent(kind){
  (SLIDES[current].steps || []).forEach((st, i)=>{ if(st.until === kind) stepDone[i] = true; });
  lightSteps();
}
gameHooks.onPlace = ()=>stepEvent('place');
gameHooks.onTransform = kind=>stepEvent(kind);
gameHooks.onChange = ()=>checkHint();

/* Final slide: the orange "Make sure…" note glows strongly for a few
   seconds as soon as the slide opens. Once per visit to the slide. */
const BIG_GLOW_DELAY_MS = 300; // just after the slide appears
const BIG_GLOW_MS = 2500;      // how long the orange note glows
let bigNoteGlowed = false;
function glowBigNote(){
  if(bigNoteGlowed || gameMode === 'view') return;
  bigNoteGlowed = true;
  $('big-note').classList.add('lit');
  // (it's gone if the puzzle was solved meanwhile)

}

/* ── Final slide: the Hint ──
   A glowing Hint button fades in under the orange note once every piece
   is placed with no rule broken but the rows/columns aren't all even
   (hintWhenUneven). It opens a spotlight: the page goes dark except the
   squares each of its steps lights up, with that step's text; "Got it"
   moves on to the next step (hintSteps). */
let hintOffered = false;
function checkHint(){
  // (game.js gives the board's frame the 'uneven' glow exactly then)
  if(SLIDES[current].hintWhenUneven && puzzle && boardFull() && $('board-outer').classList.contains('uneven')) offerHint();
}
function offerHint(){
  if(hintOffered || gameMode !== 'play') return;
  hintOffered = true;
  $('hint-btn').classList.add('shown', 'lit');
}
/* A popup comes in steps, one "Got it" each (the final slide's Hint: its
   hintSteps). Each step is
   { lit: 'area' (the dotted squares, or else the dotted area) or a list
     of squares (none: everything dark), mark: a square to highlight for
     good, text (or html), over: true to sit over the middle of the grid }
   Phones also use it for slide 6's hint and the last slide's "Make sure…"
   note. onClose runs after the last "Got it". */
let hintStep = 0, hintList = [], hintOnClose = null;
function showHint(steps, step, onClose){
  hintList = steps;
  hintStep = step || 0;
  if(!step) hintOnClose = onClose || null;
  const s = hintList[hintStep];
  if($('hint-btn')) $('hint-btn').classList.remove('lit');
  $('spot-text').innerHTML = s.html || `<p>${s.text}</p>`;
  $('spot').hidden = false;
  const W = innerWidth, H = innerHeight, pad = 5;
  // A square this step highlights (in the highlighter's first color) and
  // that can't be un-highlighted
  if(s.mark){
    const k = s.mark[0] + ',' + s.mark[1], m = getMarks();
    m[k] = 0; setMarks(m);
    setLockedMarks([k]);
  }
  // The squares left lit
  const lit = s.lit === 'area' ? (puzzle.blocked.length ? puzzle.blocked : (puzzle.hintOutline || [])) : (s.lit || []);
  const cellAt = ([r,c])=>boardEl.querySelector(`.board-cell[data-r="${r}"][data-c="${c}"]`);
  let holes = (s.lit === 'board' || s.lit === 'tray') ? [] : lit.map(cellAt).filter(Boolean).map(el=>el.getBoundingClientRect());
  // (2026-11-13) 'tray': only the pieces above the grid stay lit
  if(s.lit === 'tray'){
    const slots = [...$('tray').querySelectorAll('.tray-slot')].map(el=>el.getBoundingClientRect());
    if(slots.length){
      const l = Math.min(...slots.map(b=>b.left)), t = Math.min(...slots.map(b=>b.top));
      const r = Math.max(...slots.map(b=>b.right)), btm = Math.max(...slots.map(b=>b.bottom));
      holes = [{ left: l, top: t, width: r - l, height: btm - t, right: r, bottom: btm }];
    }
  }
  // (2026-11-12) 'board': the whole board, plus room on every side for the
  // counts (top, right) and the measuring lines (bottom, left)
  if(s.lit === 'board'){
    const b = $('board-outer').getBoundingClientRect();
    holes = [{ left: b.left - COUNT_ROOM, top: b.top - COUNT_ROOM, width: b.width + 2*COUNT_ROOM, height: b.height + 2*COUNT_ROOM }];
    holes[0].right = holes[0].left + holes[0].width;
    holes[0].bottom = holes[0].top + holes[0].height;
  }
  const box = (b, extra)=>`x="${b.left - pad}" y="${b.top - pad}" width="${b.width + 2*pad}" height="${b.height + 2*pad}" rx="8" ${extra}`;
  const svg = $('spot-svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs><mask id="spot-mask"><rect width="${W}" height="${H}" fill="white"/>`
    + holes.map(b=>`<rect ${box(b, 'fill="black"')}/>`).join('') + `</mask></defs>`
    + `<rect width="${W}" height="${H}" fill="rgba(0,0,0,0.75)" mask="url(#spot-mask)"/>`
    // (a glowing ring round each dotted square, when the area is made of
    // them; never round an area or the highlighted square: user, 2026-11-05)
    + (s.lit === 'area' && puzzle.blocked.length ? holes.map(b=>`<rect ${box(b, 'class="spot-ring"')}/>`).join('') : '');
  $('spot-ok').textContent = s.ok || 'Got it';
  $('spot-card').style.visibility = '';
  $('spot-card').classList.toggle('glow', !!s.glow);
  // The explanation goes above or below the whole board, whichever has
  // more room, never over it: the hint asks them to look at rows and
  // columns (if it's too tall for that room, it scrolls inside)
  const card = $('spot-card'), gapPx = 16;
  const boardBox = $('board-outer').getBoundingClientRect();
  const top = boardBox.top - (s.lit === 'board' ? COUNT_ROOM : 0), bottom = boardBox.bottom;
  card.style.overflowY = 'auto';
  if(s.over){
    // Over the middle of the grid (never off the screen)
    card.style.bottom = '';
    card.style.maxHeight = (H - 2*gapPx) + 'px';
    const h = card.offsetHeight;
    card.style.top = Math.max(gapPx, Math.min(H - gapPx - h, top + (boardBox.height - h)/2)) + 'px';
  } else {
    const below = H - bottom > top;      // more room under the squares than above them?
    card.style.top    = below ? (bottom + gapPx) + 'px' : '';
    card.style.bottom = below ? '' : (H - top + gapPx) + 'px';
    card.style.maxHeight = ((below ? H - bottom : top) - 2*gapPx) + 'px';
  }
  card.scrollTop = 0;                               // start at the first sentence
  $('spot-ok').focus({ preventScroll: true });
}
function hideHint(){ $('spot').hidden = true; $('spot').classList.remove('instant'); $('spot-card').style.visibility = ''; }
// "Got it": the next part of the popup, or (after the last) close it.
// Tapping the dark area does the same.
function nextHint(){
  if(hintStep + 1 < hintList.length) showHint(hintList, hintStep + 1); else closeHint();
}
// (keepDark, 2026-11-13: when another popup follows straight after, the
// page stays dark and only the card goes, so the dark doesn't lift and
// come back: a flash)
function closeHint(){
  const s = hintList[hintStep];
  if(s && s.keepDark) $('spot-card').style.visibility = 'hidden';
  else hideHint();
  const then = hintOnClose;
  hintOnClose = null;
  if(then) then();
}
// (The Hint button is created with its slide, so listen on the page)
document.addEventListener('click', e=>{ if(e.target.closest('#hint-btn')) showHint(SLIDES[current].hintSteps, 0); });
$('spot-ok').onclick = nextHint;
$('spot').onclick = e=>{ if(!$('spot-card').contains(e.target)) nextHint(); };

// A tutorial puzzle got solved: freeze it (the uncovered squares stay as
// they are); then run the counting animation, or show the solved note and
// light up Next
// (Slide 5: its last piece is still flying in when it's solved; wait for it
// to land before the board switches to its solved view)
gameHooks.onSolved = ()=>{
  if(SLIDES[current].highlighterLesson) later(FLY_MS + 150, handleSolved);
  else handleSolved();
};
function handleSolved(){
  const s = SLIDES[current];
  solvedView[current] = { pieces: placedPieces.map(p=>({ name:p.name, color:p.color, cells:p.cells, row:p.row, col:p.col })),
                          oddRows: [], oddCols: [], empty: [], rings: false, status: '', good: true };
  setViewTiling(solvedView[current]);
  setGameMode('view');
  lightSteps();                                         // (no step glows once it's solved)
  if($('big-note')) $('big-note').classList.remove('lit');
  if($('hint-btn')) $('hint-btn').hidden = true;     // (gives its space to the solved note)
  $('hl-hint-btn').hidden = true;
  hideHint();
  hintOnClose = null;
  // (The solved note waits until any counting is done)
  if(s.countAnimation){
    // All the other text fades first. (It keeps its space, so the board
    // doesn't move.)
    $('play').classList.add('counting');
    $('n-boardr').classList.add('fading');
    if(PHONE_LAYOUT.matches){
      // Phones: nothing is cleared, so nothing above the grid shrinks and
      // the grid stays exactly where it was while it's counted (user,
      // 2026-11-06); the solved note will float just above it
      $('hl-tool').classList.add('fading');
      planPhoneWin();
    }
    // (Laptops: the note beside the board is cleared, making room for the solved badge)
    else later(TEXT_FADE_MS, ()=>{ $('n-boardr').innerHTML = ''; $('n-boardr').classList.remove('fading'); });
    // (slide 5 counts its empty squares, a little slower)
    drawCounts(true, null, s.countEmpty ? { step: 700 } : null);
  }
  else { addSolvedNote(); markDone(); }
}
const TEXT_FADE_MS = 500;      // how long text takes to fade out (see .fading)
function addSolvedNote(){
  const s = SLIDES[current];
  if(!s.solvedTitle) return;
  const badge = solvedBadge(s.solvedTitle, s.solvedNote, { animate: true });   // (no sound in the tutorial)
  if(!$('win-float').hidden) $('win-float').appendChild(badge);   // (phones: planPhoneWin chose its spot)
  else $('n-boardr').appendChild(badge);
}
/* Phones: where the solved note goes, worked out as soon as it's solved
   (before the counting), so it's fully on screen with no scrolling:
     - just above the column counts, if it fits on screen there (slides
       2, 4 and 6: over the faded text and pieces)
     - otherwise just under the grid (the last slide)
     - and if that would run off the bottom (small phones), the grid
       moves up into the empty pieces' row first, just enough */
const COUNT_ROOM = 30;    // px above the grid for the column counts
// The part of the screen between the header and the Back / Next bar (the
// slide area itself reaches a little behind both: see --edge-room)
function visibleArea(){
  return { top: document.querySelector('.tut-head').getBoundingClientRect().bottom,
           bottom: document.querySelector('.tut-foot').getBoundingClientRect().top };
}
function planPhoneWin(){
  const s = SLIDES[current], float = $('win-float');
  if(!s.solvedTitle) return;
  // (measure the note at its real width, unseen)
  float.style.visibility = 'hidden';
  float.hidden = false;
  float.appendChild(solvedBadge(s.solvedTitle, s.solvedNote));
  const h = float.offsetHeight;
  float.innerHTML = '';
  float.style.visibility = '';
  const view = visibleArea(), play = $('play').getBoundingClientRect();
  const board = $('board-outer').getBoundingClientRect();
  const visTop = view.top + 4, visBottom = view.bottom - 6;
  let top = board.top - COUNT_ROOM - h;
  if(top < visTop){
    top = board.bottom + 10;
    const over = top + h - visBottom;
    const room = Math.max(0, board.top - COUNT_ROOM - visTop);   // how far the grid can go up
    const shift = Math.min(Math.max(0, over), room);
    if(shift){ $('board-wrap').style.transform = `translateY(${-shift}px)`; top -= shift; }
    // (still too tall, e.g. Large text on an iPhone SE: it covers the
    // bottom of the grid rather than go off the screen)
    top = Math.min(top, visBottom - h);
  }
  float.style.top = (top - play.top) + 'px';
}

/* ── Slide 5: meet the highlighter ──
   Short messages, one at a time, in a popup under the highlighter (user,
   2026-11-05), each pointing at what to tap, which glows:
     'enable'  "Use the highlighter to mark empty squares. Tap it to turn it on."
     'grid'    (once it's on) the message goes away and the empty grid
               comes in
     'unmark'  (after the first highlight) "Tap a highlighted square again
               to clear it." Next lights up once they do.
   The word "pencil" is never used to players. */
const TAP = TOUCH ? 'Tap' : 'Click';
// (2026-11-11, user: "omit needless words". The color step is gone: a
// color is already chosen, and the dropdown is easy to find later.)
const HL_MSG = {    // [CONTENT]
  enable: { text: `Use the highlighter to mark empty squares. ${TAP} it to turn it on.`, point: '.hl-pencil', glow: 'glowing' },
  unmark: { text: `${TAP} a highlighted square again to clear it.` },
};
// (Things hidden until the highlighter is on. Empty since 2026-11-11: the
// user wants the grid visible from the start. It still glows once as the
// highlighter turns on, to say "now tap a square".)
const LATER_IN = [];
const GRID_GLOW_MS = 450;          // the grid glows as it comes in…
const GRID_GLOW_AGAIN_MS = 4000;   // …and again this much later if no square has been tapped
let introStage = null;
function showHighlighterIntro(){ introStage = null; introMarks = 0; setIntroStage('enable'); }
function setIntroStage(stage){
  introStage = stage;
  const bubble = $('hl-bubble'), tool = $('hl-tool'), msg = HL_MSG[stage];
  tool.classList.remove('glowing', 'glow-color');
  if(msg && msg.glow) tool.classList.add(msg.glow);
  if(stage === 'grid'){
    LATER_IN.forEach(id=>$(id).classList.add('shown'));
    // A soft glow round the grid as it comes in, and once more if they
    // haven't tapped a square 4 s later: a nudge with no words (user, 2026-11-05)
    const glowGrid = ()=>{ const b = $('board-outer'); b.classList.remove('invite'); void b.offsetWidth; b.classList.add('invite'); };
    later(GRID_GLOW_MS, glowGrid);
    later(GRID_GLOW_MS + GRID_GLOW_AGAIN_MS, ()=>{ if(introStage === 'grid') glowGrid(); });
  }
  if(!msg){ bubble.classList.add('gone'); return; }
  bubble.hidden = false;
  bubble.innerHTML = `<p>${msg.text}</p>`;
  bubble.classList.toggle('no-arrow', !msg.point);
  bubble.classList.remove('gone');
  placeBubble();
}
// The popup goes just under the highlighter, its arrow pointing at what to
// tap. The (empty) pieces' row makes room for the tallest message, so the
// grid comes in below it and never moves when the message changes.
function placeBubble(){
  const bubble = $('hl-bubble'), tool = $('hl-tool');
  if(bubble.hidden || !SLIDES[current].highlighterIntro) return;
  placeHighlighterTool();
  const play = $('play').getBoundingClientRect(), t = tool.getBoundingClientRect();
  const w = bubble.offsetWidth;
  const left = Math.max(4, Math.min(t.right - play.left - w + 6, play.width - w - 4));
  bubble.style.left = left + 'px';
  bubble.style.top = (t.bottom - play.top + 12) + 'px';
  const msg = HL_MSG[introStage], target = msg && msg.point && tool.querySelector(msg.point);
  if(target){
    const b = target.getBoundingClientRect();
    bubble.style.setProperty('--arrow-right', Math.max(10, left + w - (b.left + b.width/2 - play.left) - 9) + 'px');
  }
  // (the tallest of the messages, measured once at this width)
  const shown = bubble.innerHTML;
  let tallest = 0;
  Object.values(HL_MSG).forEach(m=>{ bubble.innerHTML = `<p>${m.text}</p>`; tallest = Math.max(tallest, bubble.offsetHeight); });
  bubble.innerHTML = shown;
  bubble.style.minHeight = tallest + 'px';
  const need = (t.bottom + 12 + tallest + 18) - $('tray').getBoundingClientRect().top;
  $('tray').style.minHeight = Math.max(60, need) + 'px';
}
window.addEventListener('resize', ()=>setTimeout(placeBubble, 150));   // (after game.js re-fits the board)
// Turned on → the message goes and the grid comes in
gameHooks.onHighlighter = on=>{
  if(on && (SLIDES[current].highlighterLesson || SLIDES[current].findEmpty)) $('hl-tool').classList.remove('glowing');   // (tapped, so it stops glowing)
  if(on) stepEvent('hlOn');
  if(!SLIDES[current].highlighterIntro) return;
  if(on && introStage === 'enable') setIntroStage('grid');
};
// The first highlight → the last message; then un-highlighting a square
// lights up Next (user, 2026-11-05)
let introMarks = 0;      // how many squares were highlighted after the last change
gameHooks.onMark = ()=>{
  if(SLIDES[current].highlighterLesson){ checkEmptySpacesFound(); return; }
  if(SLIDES[current].findEmpty){ checkAllEmptyFound(); return; }
  if(!SLIDES[current].highlighterIntro) return;
  const n = Object.keys(getMarks()).length, fewer = n < introMarks;
  introMarks = n;

};

/* ── Slide 6: use the highlighter ──

   closed with "Got it" (HL_POPUP: the rule, then the two steps; the grid
   stays lit). Then the short reminder beside the board (HL_NOTE) fades in
   and the highlighter glows until it's tapped (user, 2026-11-11: one block
   of instructions was too much at once). Pieces can be moved at any time
   (user's choice). Once both HL_GOALS are highlighted, the squares left
   for the pieces (HL_OPEN) glow twice and the 1st step gets a check: the
   payoff (2026-11-11).
   If they still aren't both highlighted HL_HINT_MS after the popup closes
   (and the puzzle isn't solved), HL_HINT pops into the note (user, 2026-11-05). */

const HL_POPUP = [  // [CONTENT] (one "Got it" each; "The first four will be easy…" removed, user 2026-11-13)

const PLACE_GAP_MS = 500;     // between the two pieces dropping in

const HL_SOLUTION = [

// The fewest turns (rotate / reflect) from one shape to another
const shapeKey = cells => normalize(cells).map(c=>c.join(',')).sort().join(';');
function turnsBetween(from, to){
  const goal = shapeKey(to), seen = new Set([shapeKey(from)]);
  let queue = [{ cells: from, path: [] }];
  while(queue.length){
    const next = [];
    for(const q of queue){
      if(shapeKey(q.cells) === goal) return q.path;
      [['rotate', rotateCells], ['reflect', reflectCells]].forEach(([how, fn])=>{
        const c = fn(q.cells), k = shapeKey(c);
        if(!seen.has(k)){ seen.add(k); next.push({ cells: c, path: q.path.concat([[how, fn]]) }); }
      });
    }
    queue = next;
  }
  return [];
}
// One piece: turn it at the top (the game's own spin / flip), one turn at a
// time, then it flies onto the grid; then the next piece
function autoPlace(list, i){
  if(i >= list.length || !SLIDES[current].highlighterLesson) return;
  const { name, at } = list[i];
  const r0 = Math.min(...at.map(c=>c[0])), c0 = Math.min(...at.map(c=>c[1]));
  const target = at.map(([r,c])=>[r-r0, c-c0]);
  const turns = turnsBetween(trayCells[name], target);
  const TURN_MS = 420;
  turns.forEach(([how, fn], j)=>later(j * TURN_MS, ()=>{
    trayCells[name] = fn(trayCells[name]);
    pendingFeel = { type:'turn', how, source:{ kind:'tray', name } };
    renderAll();
  }));
  later(turns.length * TURN_MS + 250, ()=>{
    const from = trayPieceEl(name).getBoundingClientRect();
    const id = 'auto' + i;
    const def = puzzle.pieces.find(d=>d.name === name);
    placedPieces.push({ id, name, color: def.color, cells: normalize(target), row: r0, col: c0 });
    renderAll();                     // (the last one solves it)
    const el = boardPieceEl(id);
    if(el && !REDUCED_MOTION){
      const to = el.getBoundingClientRect();
      el.animate([
        { transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(1.06)` },
        { transform: 'translate(0, 0) scale(0.97)', offset: 0.8 },
        { transform: 'none' },
      ], { duration: FLY_MS, easing: 'cubic-bezier(.3,.8,.35,1)' });
    }
    later(FLY_MS + PLACE_GAP_MS, ()=>autoPlace(list, i + 1));
  });
}

/* ── Slide 2: pick the grid with parity (2026-11-12) ──
   Two little boards (A = PAIR_BAD, B = PAIR_GOOD), each a button. Picking
   one counts it slowly, row by row then column by column:
     right → every count green, then a solved note; Next lights up
     wrong → the count stops on the first odd line, which stays red, with
             "There are 5 blocks in row 4…"; then the other board is
             counted ("Here is the Tiling that Solves for Parity") */
const PICK_STEP_MS = 800;        // per row / column: much slower than the game's count
const PICK_WRONG_PAUSE_MS = 3200; // reading time before the right one is counted
// (filled in by showPickSlide from the slide's boards: [wrong, right])
let PICK_BOARDS = [];
function pairSvg(p, cell){
  const gap = 3, pad = 6, step = cell + gap, R = 26, T = 24;
  const boardW = p.cols*cell + (p.cols-1)*gap + 2*pad, boardH = p.rows*cell + (p.rows-1)*gap + 2*pad;
  const svg = svgEl('svg', { width: boardW + R, height: boardH + T, viewBox: `0 0 ${boardW + R} ${boardH + T}`, 'aria-hidden':'true' });
  const g = svgEl('g', { transform: `translate(0,${T})` }, svg);
  svgEl('rect', { x:0, y:0, width:boardW, height:boardH, rx:8, class:'rb-frame' }, g);
  for(let r=0; r<p.rows; r++) for(let c=0; c<p.cols; c++)
    svgEl('rect', { x: pad + c*step, y: pad + r*step, width: cell, height: cell, rx: 3, class:'rb-cell' }, g);
  p.fixedPieces.forEach(f=>drawPiece(g, f.cells, f.color, pad + f.col*step, pad + f.row*step, cell, gap));
  const over = svgEl('g', {}, g);    // glows and counts go on top
  svg.geom = { over, cell, boardW, x: c=>pad + c*step, y: r=>pad + r*step };
  return svg;
}
// Count one little board's blocks; stopAtOdd = stop on the first odd line.
// onDone(the odd line or null)
function countPair(svg, p, stopAtOdd, onDone){
  // (the empty-squares slide counts the squares no piece covers)
  const G = svg.geom, lines = [];
  const filled = SLIDES[current].countEmpty ? new Set(emptyOf(p)) : coveredBy(p.fixedPieces);
  for(let r=0; r<p.rows; r++){ const cells = []; for(let c=0; c<p.cols; c++) if(filled.has(r+','+c)) cells.push([r,c]);
    lines.push({ cells, kind: 'row', n: r + 1, x: G.boardW + 13, y: G.y(r) + G.cell/2 }); }
  for(let c=0; c<p.cols; c++){ const cells = []; for(let r=0; r<p.rows; r++) if(filled.has(r+','+c)) cells.push([r,c]);
    lines.push({ cells, kind: 'column', n: c + 1, x: G.x(c) + G.cell/2, y: -12 }); }
  const run = i=>{
    if(i >= lines.length){ onDone(null); return; }
    const line = lines[i], odd = line.cells.length % 2 === 1;
    const glows = line.cells.map(([r,c])=>svgEl('rect', { x: G.x(c), y: G.y(r), width: G.cell, height: G.cell, rx: 3,
                                                          class: 'pc-glow' + (odd ? ' odd' : '') }, G.over));
    requestAnimationFrame(()=>glows.forEach(el=>el.classList.add('on')));
    const t = svgEl('text', { x: line.x, y: line.y, 'text-anchor':'middle', 'dominant-baseline':'central',
                              class: 'pc-count' + (odd ? ' odd' : '') }, G.over);
    t.textContent = line.cells.length;
    if(odd && stopAtOdd){ glows.forEach(el=>el.classList.add('stay')); later(400, ()=>onDone(line)); return; }
    later(PICK_STEP_MS * 0.75, ()=>glows.forEach(el=>el.classList.remove('on')));
    later(PICK_STEP_MS, ()=>run(i + 1));
  };
  later(300, ()=>run(0));
}

/* ── Slides 3 and 4: highlight every empty square (2026-11-12) ──

const piecesAllowedBefore = gameHooks.piecesAllowed;
